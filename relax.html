<title>Bridge Relax</title>
<style>
/* Bridge Relax — l'esthétique vient de l'étui de duplicate : carrés, bords rouges (vulnérable), cartes ivoire */
:root{
  --ink:#14233b;--ink-2:#3b4b66;--mute:#6a7890;
  --bg:#e9eef5;--paper:#ffffff;--paper-2:#f4f7fb;--line:#d3dbe7;
  --navy:#14233b;--navy-ink:#f3f6fb;
  --brass:#a97a1f;--brass-soft:#f2e6c9;
  --red:#c8342f;--red-soft:#fbe6e4;
  --green:#1f8a57;--green-soft:#dff2e8;
  --felt:#1d5c47;--felt-2:#164a39;
  --plate:#fbf8f0;--plate-ink:#1b2438;
  --shadow:0 1px 0 rgba(20,35,59,.05),0 10px 24px -14px rgba(20,35,59,.35);
  --serif:"Baskerville","Baskerville Old Face","Libre Baskerville",Georgia,"Times New Roman",serif;
  --sans:"Avenir Next","Avenir","Segoe UI",system-ui,-apple-system,Roboto,sans-serif;
}
@media (prefers-color-scheme:dark){
  :root{
    --ink:#e9eef6;--ink-2:#c3cddc;--mute:#8f9db3;
    --bg:#0c1320;--paper:#142033;--paper-2:#192840;--line:#27374f;
    --navy:#0a101b;--navy-ink:#eef3fa;
    --brass:#e0b255;--brass-soft:#3a2f17;
    --red:#ff6f66;--red-soft:#3b1d21;
    --green:#4cc38a;--green-soft:#133126;
    --felt:#16503d;--felt-2:#103a2d;
    --plate:#f3efe3;--plate-ink:#14192a;
    --shadow:0 1px 0 rgba(0,0,0,.4),0 12px 26px -16px rgba(0,0,0,.8);
  }
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.45 var(--sans);padding-bottom:calc(92px + env(safe-area-inset-bottom));min-height:100vh}
button,select,input,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--brass);outline-offset:2px}

/* En-tête */
header{position:sticky;top:0;z-index:5;background:var(--navy);color:var(--navy-ink);padding:calc(10px + env(safe-area-inset-top)) 16px 10px;display:flex;align-items:center;gap:12px}
header .logo{width:40px;height:40px;border-radius:10px;box-shadow:0 0 0 1.5px rgba(224,178,85,.7)}
header h1{margin:0;font:400 23px/1 var(--serif);letter-spacing:.2px;flex:1}
header .clock{font-variant-numeric:tabular-nums;text-align:right;font-size:13px;line-height:1.25;color:rgba(243,246,251,.82)}
header .clock b{display:block;font:400 21px/1.05 var(--serif);color:#fff}
main{max-width:1240px;margin:0 auto;padding:16px 14px}

/* Navigation */
nav{position:fixed;left:12px;right:12px;bottom:calc(10px + env(safe-area-inset-bottom));z-index:6;display:flex;gap:2px;background:var(--navy);border-radius:22px;padding:6px;box-shadow:0 14px 30px -10px rgba(0,0,0,.55)}
nav button{flex:1;border:0;background:none;color:rgba(243,246,251,.62);padding:8px 2px 7px;border-radius:16px;font-size:11.5px;display:flex;flex-direction:column;align-items:center;gap:3px}
nav button svg{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
nav button.on{background:rgba(224,178,85,.17);color:#f0cf86;font-weight:700}

/* Titres et textes */
h2{margin:0 0 4px;font:400 26px/1.15 var(--serif)}
h3{margin:0 0 6px;font:700 15px/1.3 var(--sans)}
.lead{color:var(--ink-2);margin:0 0 12px}
.mute{color:var(--mute);font-size:14px}
.sec{margin:0 0 22px}
.sec>h2{margin-bottom:10px}

/* Boutons */
.btn{border:1.5px solid var(--line);background:var(--paper);border-radius:14px;padding:10px 15px;font-weight:600;color:var(--ink);transition:transform .08s}
.btn:active{transform:scale(.97)}
.btn.pri{background:var(--navy);border-color:var(--navy);color:var(--navy-ink)}
@media (prefers-color-scheme:dark){.btn.pri{background:var(--brass);border-color:var(--brass);color:#1b1405}}
.btn.go{background:var(--felt);border-color:var(--felt);color:#fff;font-family:var(--serif);font-size:20px;font-weight:400;padding:15px 18px;border-radius:16px;box-shadow:inset 0 0 0 2px rgba(224,178,85,.55),0 10px 22px -12px rgba(0,0,0,.6)}
.btn.sm{padding:6px 11px;font-size:13px;border-radius:11px}
.btn.danger{color:var(--red)}
.btn:disabled{opacity:.45}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.grow{flex:1;min-width:0}
input[type=text],input[type=time],input[type=date],input[type=number],select,textarea{background:var(--paper);border:1.5px solid var(--line);border-radius:12px;padding:11px 12px;width:100%;color:var(--ink)}
label.f{display:block;font-size:13px;color:var(--mute);margin:12px 0 4px}
input[type=checkbox]{width:20px;height:20px;accent-color:var(--felt)}

/* Bandeau de situation */
.plan{display:flex;align-items:flex-end;justify-content:space-between;gap:14px;flex-wrap:wrap;margin-bottom:12px}
.plan .big{font:400 44px/0.95 var(--serif)}
.plan .big small{font:400 17px var(--sans);color:var(--mute);margin-left:6px}
.plan .txt{color:var(--ink-2);font-size:15px;max-width:22em}
.go-row{display:flex;gap:10px;align-items:stretch;margin:6px 0 4px}
.go-row select{width:auto;border-radius:14px}
.go-row .btn.go{flex:1}

/* Ligne du temps de l'après-midi */
.tl{margin:2px 0 18px}
.tl .bar{position:relative;height:14px;border-radius:9px;background:var(--paper-2);box-shadow:inset 0 0 0 1.5px var(--line);overflow:hidden}
.tl .seg{position:absolute;top:0;bottom:0;background:var(--felt);opacity:.9;border-right:2px solid var(--bg)}
.tl .seg.cur{background:var(--brass)}
.tl .now{position:absolute;top:-3px;bottom:-3px;width:3px;background:var(--red);border-radius:2px}
.tl .ticks{position:relative;height:18px;font-size:12px;color:var(--mute)}
.tl .ticks span{position:absolute;transform:translateX(-50%);top:4px}

/* Alertes */
.note{border-radius:14px;padding:11px 14px;margin:0 0 14px;font-size:15px;border:1.5px solid}
.note.warn{background:var(--brass-soft);border-color:var(--brass);color:var(--ink)}
.note.bad{background:var(--red-soft);border-color:var(--red);color:var(--ink)}
.note.ok{background:var(--green-soft);border-color:var(--green);color:var(--ink)}

/* Tables : l'étui vu de dessus */
.tables{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:18px}
.tcard{background:var(--paper);border-radius:22px;box-shadow:var(--shadow);overflow:hidden}
.tcard.closed{opacity:.5}
.tcard.deal{animation:deal .42s cubic-bezier(.2,.8,.25,1) both;animation-delay:calc(var(--i)*55ms)}
@keyframes deal{from{opacity:0;transform:translateY(18px) rotate(-1.6deg) scale(.97)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){.tcard.deal{animation:none}}
.felt{position:relative;background:radial-gradient(120% 90% at 50% 40%,var(--felt) 0%,var(--felt-2) 100%);padding:14px 12px 16px;color:#fff}
.felt .tag{position:absolute;right:12px;top:10px;font-size:12px;color:rgba(255,255,255,.8);text-align:right;line-height:1.25}
.felt .tag b{display:block;font:400 15px var(--serif);color:#f0cf86}
.seats{display:grid;grid-template-columns:minmax(0,1fr) 88px minmax(0,1fr);grid-template-rows:auto auto auto;gap:8px;align-items:center;margin-top:20px}
.plate{position:relative;background:var(--plate);color:var(--plate-ink);border-radius:12px;padding:8px 10px 8px 34px;min-height:50px;display:flex;align-items:center;font-weight:600;font-size:15px;line-height:1.2;box-shadow:0 2px 0 rgba(0,0,0,.25);word-break:break-word}
.plate .sl{position:absolute;left:7px;top:50%;transform:translateY(-50%);width:21px;height:21px;border-radius:50%;background:var(--navy);color:#fff;font:700 11px/21px var(--sans);text-align:center}
.plate.prof{box-shadow:0 0 0 3px #f0cf86,0 2px 0 rgba(0,0,0,.25)}
.plate.prof::after{content:"prof";position:absolute;right:7px;top:3px;font-size:10px;color:var(--brass);font-weight:700}
.plate.gone{background:var(--red-soft);color:var(--red);text-decoration:line-through}
.p-N{grid-column:1/4;grid-row:1;justify-self:center;width:62%}
.p-O{grid-column:1;grid-row:2}
.p-E{grid-column:3;grid-row:2}
.p-S{grid-column:1/4;grid-row:3;justify-self:center;width:62%}
.hub{grid-column:2;grid-row:2;aspect-ratio:1;border-radius:14px;background:rgba(0,0,0,.28);box-shadow:inset 0 0 0 2px rgba(240,207,134,.8);display:flex;flex-direction:column;align-items:center;justify-content:center;color:#fff}
.hub b{font:400 38px/1 var(--serif)}
.hub small{font-size:11px;color:rgba(255,255,255,.75)}
.boards{padding:4px 14px 12px}
.brow{display:flex;align-items:center;gap:12px;padding:10px 0;border-top:1px solid var(--line)}
.brow:first-child{border-top:0}
.brow .info{flex:1;min-width:0;font-size:14px;line-height:1.35}
.brow .info small{color:var(--mute);font-size:13px}
.brow .res{font-weight:700;font-size:16px}
.brow .btn{align-self:center}
/* mini-étui : bords rouges = camp vulnérable, point = donneur */
.mb{position:relative;flex:none;width:52px;height:52px;border-radius:8px;background:var(--paper-2);border:4px solid var(--line);display:flex;align-items:center;justify-content:center;font:400 19px/1 var(--serif);color:var(--ink)}
.mb.vns{border-top-color:var(--red);border-bottom-color:var(--red)}
.mb.veo{border-left-color:var(--red);border-right-color:var(--red)}
.mb i{position:absolute;width:7px;height:7px;border-radius:50%;background:var(--brass)}
.mb i.dN{top:3px;left:50%;margin-left:-3.5px}.mb i.dS{bottom:3px;left:50%;margin-left:-3.5px}
.mb i.dO{left:3px;top:50%;margin-top:-3.5px}.mb i.dE{right:3px;top:50%;margin-top:-3.5px}
.buf{padding:9px 14px 12px;background:var(--paper-2);display:flex;align-items:center;gap:8px;flex-wrap:wrap;font-size:13px;color:var(--mute)}
.fix{padding:0 14px 12px}
.fix .note{margin:10px 0 0}
.red{color:var(--red)}

/* Couleurs de cartes */
.su{font-family:"Segoe UI Symbol","Apple Symbols",var(--sans)}
.su.r{color:var(--red)}

/* Joueurs */
.plist{background:var(--paper);border-radius:20px;box-shadow:var(--shadow);padding:4px 14px}
.prow{display:flex;align-items:center;gap:12px;padding:10px 0;border-top:1px solid var(--line)}
.prow:first-child{border-top:0}
.av{flex:none;width:42px;height:42px;border-radius:50%;display:flex;align-items:center;justify-content:center;font:400 17px/1 var(--serif);color:#fff;background:var(--navy)}
.av.c1{background:#8c2b27}.av.c2{background:#1d5c47}.av.c3{background:#8a6416}.av.c4{background:#3b4b66}
.prow .nm{flex:1;min-width:0;font-weight:600;font-size:17px;line-height:1.2}
.prow .nm small{display:block;color:var(--mute);font-weight:400;font-size:12.5px}
.prow.off .nm{color:var(--mute);font-weight:500}
.prow.off .av{opacity:.45}
.sw{border:1.5px solid var(--line);background:var(--paper);border-radius:999px;padding:7px 14px;font-weight:700;font-size:14px;color:var(--mute);min-width:92px}
.sw.on{background:var(--green-soft);border-color:var(--green);color:var(--green)}
.star{border:0;background:none;font-size:22px;color:var(--mute);padding:4px}
.star.on{color:var(--brass)}
.x{border:0;background:none;color:var(--mute);font-size:18px;padding:6px}
.pill{display:inline-block;border-radius:999px;padding:1px 9px;font-size:12px;background:var(--brass-soft);color:var(--brass);font-weight:700}

/* Classement */
.rank{list-style:none;margin:0;padding:0;background:var(--paper);border-radius:20px;box-shadow:var(--shadow);padding:4px 14px}
.rank li{display:grid;grid-template-columns:40px 1fr auto;align-items:center;gap:10px;padding:10px 0;border-top:1px solid var(--line)}
.rank li:first-child{border-top:0}
.rk{width:34px;height:34px;border-radius:50%;display:flex;align-items:center;justify-content:center;font:400 17px var(--serif);background:var(--paper-2);color:var(--ink-2)}
.rk.g1{background:#e3b94f;color:#3b2a00}.rk.g2{background:#c5ccd6;color:#25303f}.rk.g3{background:#cf9a6b;color:#3a2210}
.rank .who b{display:block;font-size:17px;line-height:1.2}
.rank .who small{color:var(--mute);font-size:12.5px}
.rank .bar{height:6px;border-radius:3px;background:var(--paper-2);margin-top:5px;overflow:hidden}
.rank .bar i{display:block;height:100%;background:var(--felt)}
.rank .pc{font:400 24px var(--serif);text-align:right}
table.tr{width:100%;border-collapse:collapse;font-size:14px}
table.tr td{padding:6px 4px;border-bottom:1px solid var(--line)}
td.num{text-align:right;font-variant-numeric:tabular-nums}

/* Feuille de score */
.overlay{position:fixed;inset:0;background:rgba(6,12,22,.62);z-index:20;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--paper);width:100%;max-width:560px;border-radius:26px 26px 0 0;padding:18px 16px calc(18px + env(safe-area-inset-bottom));max-height:94vh;overflow:auto;animation:up .22s ease-out}
@keyframes up{from{transform:translateY(30px);opacity:.4}to{transform:none;opacity:1}}
@media (prefers-reduced-motion:reduce){.sheet{animation:none}}
.sheet h2{font-size:24px}
.chips{display:flex;gap:7px;flex-wrap:wrap;margin:4px 0 4px}
.chip{border:1.5px solid var(--line);background:var(--paper);border-radius:13px;min-width:46px;height:46px;padding:0 10px;font:400 20px/1 var(--serif);color:var(--ink);display:flex;align-items:center;justify-content:center;gap:5px}
.chip.on{background:var(--navy);border-color:var(--navy);color:var(--navy-ink)}
@media (prefers-color-scheme:dark){.chip.on{background:var(--brass);border-color:var(--brass);color:#1b1405}}
.chip.suit{font-size:26px;min-width:56px}
.chip.suit.r{color:var(--red)}
.chip.suit.r.on{color:#ffd9d6}
.chip.seatc{font:600 15px var(--sans);flex:1;min-width:120px;justify-content:flex-start;padding:0 12px}
.chip.seatc b{font:700 12px var(--sans);width:22px;height:22px;border-radius:50%;background:var(--paper-2);color:var(--ink);display:flex;align-items:center;justify-content:center}
.chip.seatc.on b{background:rgba(255,255,255,.22);color:inherit}
.step{display:flex;align-items:center;gap:10px}
.step .btn{width:54px;height:54px;font-size:26px;padding:0}
.step .val{flex:1;text-align:center;font:400 22px var(--serif)}
.big-score{margin:14px 0 12px;padding:12px;border-radius:16px;background:var(--paper-2);text-align:center;font:400 40px/1.1 var(--serif)}
.big-score small{display:block;font:500 13px var(--sans);color:var(--mute)}
.big-score.neg{color:var(--red)}

/* Plan des donnes */
.setcard{background:var(--paper);border-radius:18px;box-shadow:var(--shadow);padding:8px 14px 10px;margin:0 0 14px}
.setcard h3{font:400 20px var(--serif);margin:6px 0 2px}
.setcard input{margin-top:5px}
details{margin:0 0 12px}
details summary{cursor:pointer;font-weight:700;padding:8px 0}
.empty{text-align:center;padding:26px 10px 10px;color:var(--ink-2)}
.empty svg{width:150px;height:150px;margin-bottom:6px}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:13px;color:var(--mute);margin:0 0 14px;align-items:center}
.legend .mb{width:26px;height:26px;border-width:3px;font-size:11px}
.panel{background:var(--paper);border-radius:20px;box-shadow:var(--shadow);padding:14px 16px;margin:0 0 16px}

@media print{
  header,nav,.noprint{display:none!important}
  body{background:#fff;color:#000;padding:0}
  .tcard,.setcard,.panel{box-shadow:none;border:1px solid #999;break-inside:avoid}
}
@media (min-width:760px){
  body{padding-bottom:40px}
  nav{position:sticky;top:60px;left:auto;right:auto;bottom:auto;max-width:560px;margin:12px auto 0;box-shadow:none}
  nav button{flex-direction:row;justify-content:center;gap:8px;font-size:14px}
}

/* Portable, tablette en paysage et grands écrans */
.split{display:block}
.cols2{display:grid;grid-template-columns:repeat(auto-fit,minmax(340px,1fr));gap:16px;align-items:start}
.cols2 .panel{margin:0}
.sets{display:grid;grid-template-columns:repeat(auto-fill,minmax(330px,1fr));gap:16px;align-items:start}
.sets .setcard{margin:0}
@media (min-width:1000px){
  main{padding:22px 24px}
  .split{display:grid;grid-template-columns:340px minmax(0,1fr);grid-template-areas:"side tw" "annc tw";column-gap:28px;align-items:start}
  .side{grid-area:side;position:sticky;top:118px}
  .tw{grid-area:tw}
  .annc{grid-area:annc}
  .annc .panel{margin-top:6px}
  .plist{display:grid;grid-template-columns:1fr 1fr;column-gap:36px}
  .plist .prow:nth-child(2){border-top:0}
  .rank{display:grid;grid-template-columns:1fr 1fr;column-gap:36px}
  .rank li:nth-child(2){border-top:0}
}
@media (min-width:1700px){
  main{max-width:1560px}
  body:not(.salle-on){zoom:1.18}
}
@media (min-width:2300px){
  body:not(.salle-on){zoom:1.5}
}

/* Grand écran de la salle */
body.salle-on{padding:0;background:#0a2018}
.salle{min-height:100vh;display:flex;flex-direction:column;gap:1.4vw;padding:1.8vw 2.2vw;color:#fff;background:radial-gradient(130% 110% at 50% 20%,#1d5c47 0%,#0f3629 55%,#0a2018 100%)}
.stop{display:flex;align-items:center;gap:2vw}
.stop .sl1{display:flex;align-items:center;gap:1.4vw;min-width:22vw}
.stop .logo{width:5.2vw;height:5.2vw;border-radius:1.1vw;box-shadow:0 0 0 .15vw rgba(240,207,134,.8)}
.stop .sl1 b{display:block;font:400 3.6vw/1 var(--serif)}
.stop .sl1 span{font-size:1.5vw;color:rgba(255,255,255,.75)}
.scount{flex:1;text-align:center;font:400 2.8vw/1.1 var(--serif);color:#f0cf86}
.scount b{font-weight:400;color:#fff}
.sclock{font:400 4.6vw/1 var(--serif);min-width:12vw;text-align:right}
.sgrid{flex:1;display:grid;grid-template-columns:repeat(var(--cols),minmax(0,1fr));gap:1.3vw;grid-auto-rows:1fr}
.tile{display:flex;flex-direction:column;justify-content:center;gap:.5vw;min-height:0;border-radius:1.6vw;box-shadow:inset 0 0 0 .14vw rgba(240,207,134,.5);background:rgba(0,0,0,.22);padding:1vw 1.2vw;font-size:calc(100vw / var(--cols,4) / 13)}
.tile .th{display:flex;align-items:center;gap:.5em;margin-bottom:.1em}
.tile .th b{font:400 1.7em/1 var(--serif);background:#f0cf86;color:#14233b;border-radius:.35em;min-width:1.25em;text-align:center;padding:0 .2em}
.tile .th span{font-size:.9em;color:rgba(255,255,255,.75)}
.tile .grp{display:flex;flex-direction:column;gap:.25em;background:rgba(255,255,255,.08);border-radius:.6em;padding:.3em .4em}
.tile .grp.g2{background:rgba(240,207,134,.14)}
.tile .trw{display:flex;align-items:center;gap:.55em;line-height:1.15}
.tile .trw .sl{flex:none;width:1.5em;height:1.5em;border-radius:50%;background:#f0cf86;color:#14233b;font:700 .6em/1.5em var(--sans);text-align:center}
.tile .tn2{font-weight:600;min-width:0;overflow-wrap:anywhere}
.tile .trw.prof .tn2{color:#f0cf86}
.srest{font-size:1.7vw;color:#f0cf86;text-align:center}
.snames{flex:1;column-count:var(--cc);column-gap:2.4vw;font-size:1.9vw}
.ni{display:flex;align-items:center;justify-content:space-between;gap:1vw;padding:.5vw 1vw;margin:0 0 .7vw;border-radius:1vw;background:rgba(255,255,255,.09);break-inside:avoid}
.nn{font-weight:600;line-height:1.15}
.nt{display:flex;align-items:center;gap:.7vw;color:rgba(255,255,255,.82)}
.nt b{font:400 1.3em var(--serif);background:#f0cf86;color:#14233b;border-radius:.6vw;min-width:1.6em;text-align:center;padding:0 .35em}
.nt small{font-size:.62em}
.nt.rest small{color:#f0cf86}
.swait{margin:auto;text-align:center;font:400 7vw var(--serif)}
.swait small{display:block;font:400 2vw var(--sans);color:rgba(255,255,255,.75);margin-top:1vw}
.sctl{position:fixed;right:1vw;bottom:1vw;display:flex;gap:6px;opacity:.5;transition:opacity .2s;z-index:10;flex-wrap:wrap;justify-content:flex-end}
.sctl:hover,.sctl:focus-within{opacity:1}
.sctl button{border:1px solid rgba(255,255,255,.35);background:rgba(0,0,0,.5);color:#fff;border-radius:10px;padding:8px 12px;font-size:13px}
.sctl button.on{background:#f0cf86;color:#14233b;border-color:#f0cf86}

/* ===== Version colorée et très lisible ===== */
:root{--ns:#2b6fd6;--eo:#e0661e;--accent:#2b6fd6;--hi:#14233b;--hi-ink:#fff;--warn-bg:#fff7e0}
@media (prefers-color-scheme:light){
  :root{--bg:#eef3fb;--shadow:0 2px 0 rgba(20,35,59,.06),0 14px 30px -16px rgba(20,35,59,.45)}
  body{background:linear-gradient(180deg,#e3ecfb 0,#eef3fb 260px) fixed,var(--bg)}
}
@media (prefers-color-scheme:dark){
  :root{--ns:#5b9bff;--eo:#ff8a45;--accent:#6ea8ff;--hi:#f0cf86;--hi-ink:#14233b;--warn-bg:#3a2f17}
  body{background:var(--bg)}
}
body{font-size:17px}
header{background:linear-gradient(100deg,#14233b 0%,#1d4a7a 55%,#1f8a57 100%)}
header h1{font-weight:700;font-size:25px}
nav{background:linear-gradient(100deg,#14233b,#1d3d66)}
nav button{font-size:12.5px;font-weight:600}
nav button.on{background:#f0cf86;color:#14233b}
h2{font-weight:700;font-size:28px}
.btn{border-width:2px;border-radius:16px;padding:12px 18px;font-size:16px}
.btn.pri{background:linear-gradient(135deg,#1f8a57,#17694a);border-color:#17694a}

/* Cartes de table : une couleur par table */
.tcard{border-radius:24px;border:3px solid var(--tc,#1f8a57);box-shadow:var(--shadow)}
.felt{background:radial-gradient(120% 90% at 50% 40%,color-mix(in srgb,var(--tc,#1f8a57) 88%,#fff) 0%,var(--tc,#1f8a57) 45%,color-mix(in srgb,var(--tc,#1f8a57) 70%,#000) 100%);padding:16px 12px 18px}
.felt .tag{color:#fff;font-weight:600}
.felt .tag b{color:#fff;font:700 15px var(--sans);background:rgba(0,0,0,.28);padding:2px 9px;border-radius:99px;display:inline-block;margin-bottom:2px}
.plate{font-size:19px;font-weight:700;min-height:56px;padding-left:42px;border-radius:14px}
.plate .sl{width:27px;height:27px;left:8px;font:800 14px/27px var(--sans);color:#fff}
.plate.p-N .sl,.plate.p-S .sl{background:var(--ns)}
.plate.p-E .sl,.plate.p-O .sl{background:var(--eo)}
.plate.p-N,.plate.p-S{box-shadow:0 3px 0 rgba(0,0,0,.25),inset 0 -4px 0 var(--ns)}
.plate.p-E,.plate.p-O{box-shadow:0 3px 0 rgba(0,0,0,.25),inset 0 -4px 0 var(--eo)}
.plate.prof{outline:3px solid #f0cf86}
.hub{background:#fff;color:var(--tc,#14233b);box-shadow:0 3px 0 rgba(0,0,0,.25)}
.hub b{font:800 44px/1 var(--sans);color:var(--tc,#14233b)}
.hub small{color:var(--ink-2);font-weight:600;font-size:12px}
.brow .info{font-size:16px}
.brow .info b{font-size:17px}
.brow .info small{font-size:14px;color:var(--ink-2)}
.brow .res{font-size:18px;color:var(--tc,var(--ink))}
.mb{width:58px;height:58px;font-weight:700}
.tcard .btn.sm{background:var(--tc,#1f8a57);border-color:var(--tc,#1f8a57);color:#fff;min-width:84px}

/* Bandeau d'infos clair */
.tcount{font-weight:800}

/* Grand écran : une couleur par table, contraste maximal */
.salle{background:radial-gradient(130% 110% at 50% 10%,#1d3d66 0%,#10213a 60%,#0a1424 100%)}
.tile{background:rgba(255,255,255,.07);box-shadow:inset 0 0 0 .28vw var(--tc,#f0cf86)}
.tile .th b{background:var(--tc,#f0cf86);color:#fff;font-weight:800;font-family:var(--sans)}
.tile .th span{color:#fff;font-weight:600}

/* ===== v2 : séances, inscriptions, accueil, feuilles ===== */
.htitle{flex:1;min-width:0}

/* Onglets internes Inscriptions / Accueil / Liste */
.seg3{display:flex;background:var(--paper);border-radius:16px;padding:4px;box-shadow:var(--shadow);margin:6px 0 14px;max-width:520px}

/* Filtres à compteur */
.fchips{display:flex;gap:8px;flex-wrap:wrap;margin:0 0 12px}

/* Réponse à trois choix */
.rsvp{display:flex;flex:none;border:2px solid var(--line);border-radius:14px;overflow:hidden}
.rsvp button{border:0;background:var(--paper);padding:10px 10px;font-weight:700;font-size:14px;color:var(--mute);min-width:44px;min-height:44px}

.rsvp button.yes.on{background:var(--green);color:#fff}
.rsvp button.none.on{background:#d6a017;color:#fff}
.rsvp button.no.on{background:var(--red);color:#fff}
.prow.r-yes .av{box-shadow:0 0 0 3px var(--green)}
.prow.r-no .nm{color:var(--mute)}

/* Accueil : arrivée et départ */
.btn.arr{background:var(--green);border-color:var(--green);color:#fff;min-width:104px;min-height:48px;font-size:17px}

.prow.here{background:linear-gradient(90deg,var(--green-soft),transparent 70%);margin:0 -14px;padding-left:14px;padding-right:14px}

/* Cartes de séance */
.slist{display:grid;gap:12px}
@media (min-width:1000px){.slist{grid-template-columns:1fr 1fr}}
.scard{display:flex;gap:14px;align-items:flex-start;background:var(--paper);border-radius:20px;box-shadow:var(--shadow);padding:14px;border:3px solid transparent}

.scard.past{opacity:.72}
.sdate{flex:none;width:64px;border-radius:14px;overflow:hidden;text-align:center;background:linear-gradient(160deg,#2b6fd6,#1d4a7a);color:#fff;padding:6px 0 8px}

.sdate b{display:block;font:800 30px/1.05 var(--sans)}
.sdate span{font-size:13px;font-weight:600;text-transform:lowercase}
.sinfo{flex:1;min-width:0}
.st{font-weight:800;font-size:18px}

.sh{color:var(--ink-2);font-size:15px;margin:2px 0 6px}
.cnt{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:4px}
.k{border-radius:99px;padding:2px 10px;font-size:13px;font-weight:700}
.k.yes{background:var(--green-soft);color:var(--green)}
.k.none{background:var(--brass-soft);color:#8a6416}
.k.no{background:var(--red-soft);color:var(--red)}
.sact{display:flex;flex-direction:column;align-items:flex-end;gap:6px}

/* Table : étui reçu, réserve */
.from{padding:10px 16px 0;font-weight:700;color:var(--tc,var(--ink))}
.bchip{display:inline-flex;align-items:center;justify-content:center;min-width:38px;height:32px;margin-left:6px;border-radius:10px;background:var(--tc,#14233b);color:#fff;font-weight:800}

/* Feuilles d'étui : visibles seulement à l'impression */
.sheets{display:none}
@media print{

}

/* Deux statuts : réponse et présence */
.bds{display:flex!important;flex-wrap:wrap;gap:4px;margin-top:3px}

.toast{position:fixed;left:12px;right:12px;bottom:calc(96px + env(safe-area-inset-bottom));z-index:20;max-width:560px;margin:0 auto;background:#14233b;color:#fff;border-left:6px solid var(--green);border-radius:14px;padding:13px 16px;font-weight:600;font-size:16px;box-shadow:0 14px 30px -10px rgba(0,0,0,.6);animation:tin .25s ease-out}

/* Intertitres : oui, pas répondu, non */

.ghead:first-child{margin-top:0;border-top:0;border-radius:20px 20px 0 0}

.ghead.g-none{background:var(--brass-soft);color:#8a6416}.ghead.g-none span{background:#d6a017}

/* Qui manque encore ? */
.missing{display:flex;align-items:center;gap:14px;width:100%;text-align:left;border:2px solid #d6a017;background:var(--brass-soft);color:var(--ink);border-radius:18px;padding:12px 16px;margin:12px 0 4px;font:inherit}

/* ===== v3 : bilan, alertes, messages, lots ===== */
.kpis{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin:0 0 14px}

.kpis>div:nth-child(1) b{color:var(--green)}.kpis>div:nth-child(2) b{color:#2b6fd6}.kpis>div:nth-child(3) b{color:#e0661e}.kpis>div:nth-child(4) b{color:#8a3fc7}

a.btn{text-decoration:none;display:inline-flex;align-items:center;justify-content:center}

<script>
/* Bridge Relax — moteur d'organisation (rotation individuelle, donnes, scores) */
(function (root) {
  'use strict';

  const SEATS = ['N', 'E', 'S', 'O'];
  const SEAT_NAME = { N: 'Nord', E: 'Est', S: 'Sud', O: 'Ouest' };
  const VUL16 = ['-', 'NS', 'EW', 'ALL', 'NS', 'EW', 'ALL', '-', 'EW', 'ALL', '-', 'NS', 'ALL', '-', 'NS', 'EW'];

  // Poids de l'optimisation
  const W_P = 400;   // même partenaire qu'avant
  const W_O = 40;    // même adversaire qu'avant
  const W_R = 3000;  // rejouer une série déjà jouée
  const W_AV = 60000; // deux personnes à ne jamais réunir à la même table
  const W_PREV = 60;  // partenaires des séances précédentes (variété sur la saison)
  const W_LP = 150;   // partenaires de niveaux différents
  const W_LO = 30;    // adversaires de niveau différent (tables homogènes si possible)
  const W_S = 10;    // même siège qu'avant
  const W_D = 30;    // donner la main (déclarant prévu) à qui a le moins déclaré

  /* ---------- Donnes ---------- */
  function boardInfo(n) {
    const dealer = SEATS[(n - 1) % 4];
    const v = VUL16[(n - 1) % 16];
    return { n, dealer, vul: v, vulNS: v === 'NS' || v === 'ALL', vulEW: v === 'EW' || v === 'ALL' };
  }
  // Rôles d'un siège pour un étui préparé : déclarant, mort, entame, défense
  function roleOf(seat, declSeat) {
    const d = (SEATS.indexOf(seat) - SEATS.indexOf(declSeat) + 4) % 4;
    return ['D', 'L', 'M', 'F'][d];
  }
  function setOf(n, K) { return Math.floor((n - 1) / K) + 1; }
  function designated(n, K) { return SEATS[((n - 1) % K + setOf(n, K)) % 4]; }
  function boardsOfSet(set, K, count) {
    const c = count == null ? K : count;
    return Array.from({ length: c }, (_, i) => (set - 1) * K + i + 1);
  }

  /* ---------- Marque duplicate ---------- */
  function scoreContract(c, vulDecl) {
    const level = c.level, den = c.den, dbl = c.dbl || 0, res = c.res;
    const V = !!vulDecl;
    const per = (den === 'C' || den === 'D') ? 20 : 30;
    if (res >= 0) {
      let trick = den === 'SA' ? 40 + 30 * (level - 1) : per * level;
      trick *= dbl === 0 ? 1 : dbl === 1 ? 2 : 4;
      let s = trick + (trick >= 100 ? (V ? 500 : 300) : 50);
      if (level === 6) s += V ? 750 : 500;
      if (level === 7) s += V ? 1500 : 1000;
      if (dbl === 1) s += 50;
      if (dbl === 2) s += 100;
      if (res > 0) s += dbl === 0 ? res * per : res * (V ? 200 : 100) * (dbl === 2 ? 2 : 1);
      return s;
    }
    const down = -res;
    if (dbl === 0) return -down * (V ? 100 : 50);
    let pen = 0;
    for (let i = 1; i <= down; i++) pen += V ? (i === 1 ? 200 : 300) : (i === 1 ? 100 : i <= 3 ? 200 : 300);
    if (dbl === 2) pen *= 2;
    return -pen;
  }
  // Score vu du côté Nord-Sud
  function nsScore(r, boardNo) {
    if (r.pass || !r.level) return 0;
    const b = boardInfo(boardNo);
    const declNS = r.decl === 'N' || r.decl === 'S';
    const s = scoreContract(r, declNS ? b.vulNS : b.vulEW);
    return declNS ? s : -s;
  }

  /* ---------- Utilitaires ---------- */
  function mulberry32(a) {
    return function () {
      a |= 0; a = (a + 0x6D2B79F5) | 0;
      let t = Math.imul(a ^ (a >>> 15), 1 | a);
      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }
  function shuffle(a, rng) {
    for (let i = a.length - 1; i > 0; i--) {
      const j = Math.floor(rng() * (i + 1));
      const t = a[i]; a[i] = a[j]; a[j] = t;
    }
    return a;
  }
  const pk = (a, b) => (a < b ? a + '-' + b : b + '-' + a);
  function inc(o, k) { o[k] = (o[k] || 0) + 1; }

  /* ---------- Historique ---------- */
  function history(state) {
    const h = { partner: {}, opp: {}, seat: {}, seen: {}, rests: {}, lastRest: {}, played: {}, decl: {}, setUse: {}, setLast: {}, maxSet: 0, role: {}, avoid: {}, prev: state.prevPartners || {}, level: state.levels || {} };
    (state.avoid || []).forEach(x => { h.avoid[pk(x[0], x[1])] = 1; });
    state.rounds.forEach((r, ri) => {
      (r.rest || []).forEach(id => { inc(h.rests, id); h.lastRest[id] = ri; });
      r.tables.forEach(t => {
        const s = t.seats;
        inc(h.partner, pk(s.N, s.S)); inc(h.partner, pk(s.E, s.O));
        [[s.N, s.E], [s.N, s.O], [s.S, s.E], [s.S, s.O]].forEach(x => inc(h.opp, pk(x[0], x[1])));
        SEATS.forEach(k => {
          const id = s[k];
          if (!h.seat[id]) h.seat[id] = {};
          inc(h.seat[id], k);
        });
        const ids = [s.N, s.E, s.S, s.O].concat(t.extra || []);
        ids.forEach(id => {
          if (!h.seen[id]) h.seen[id] = new Set();
          h.seen[id].add(t.set);
        });
        [s.N, s.E, s.S, s.O].forEach(id => inc(h.played, id));
        inc(h.setUse, t.set);
        h.setLast[t.set] = { round: ri, table: t.n };
        if (t.set > h.maxSet) h.maxSet = t.set;
        // mains prévues déjà attribuées (mode donnes préparées)
        const K = (state.settings && state.settings.setSize) || 4;
        (t.boards || []).forEach(n => {
          const dz = designated(n, K);
          inc(h.decl, s[dz]);
          SEATS.forEach(k => { const id = s[k]; if (id == null) return; if (!h.role[id]) h.role[id] = { D: 0, M: 0, L: 0, F: 0 }; h.role[id][roleOf(k, dz)]++; });
        });
      });
    });
    return h;
  }

  /* ---------- Coûts ---------- */
  function tableCost(h, q, set) {
    let c = 0;
    const p1 = h.partner[pk(q[0], q[1])] || 0, p2 = h.partner[pk(q[2], q[3])] || 0;
    c += W_P * (p1 * p1 + p2 * p2);
    for (let i = 0; i < 2; i++) for (let j = 2; j < 4; j++) c += W_O * (h.opp[pk(q[i], q[j])] || 0);
    for (let i = 0; i < 4; i++) { const s = h.seen[q[i]]; if (s && s.has(set)) c += W_R; }
    for (let i = 0; i < 4; i++) for (let j = i + 1; j < 4; j++) if (h.avoid[pk(q[i], q[j])]) c += W_AV;
    c += W_PREV * ((h.prev[pk(q[0], q[1])] || 0) + (h.prev[pk(q[2], q[3])] || 0));
    // Niveaux : partenaires de même niveau d'abord, puis tables homogènes (niveau inconnu ou professeur : neutre)
    const L = h.level, dif = (a, b) => L[a] && L[b] && L[a] !== L[b];
    if (dif(q[0], q[1])) c += W_LP;
    if (dif(q[2], q[3])) c += W_LP;
    for (let i = 0; i < 2; i++) for (let j = 2; j < 4; j++) if (dif(q[i], q[j])) c += W_LO;
    return c;
  }

  function anneal(ids, slots, h, rng, iters, restarts) {
    const T = slots.length;
    let best = null, bc = Infinity;
    for (let r = 0; r < restarts; r++) {
      const cur = shuffle(ids.slice(), rng);
      const tc = [];
      for (let t = 0; t < T; t++) tc.push(tableCost(h, cur.slice(4 * t, 4 * t + 4), slots[t]));
      let total = tc.reduce((a, b) => a + b, 0);
      const t0 = 300, t1 = 0.5;
      for (let it = 0; it < iters; it++) {
        const temp = t0 * Math.pow(t1 / t0, it / iters);
        const i = Math.floor(rng() * cur.length), j = Math.floor(rng() * cur.length);
        if (i === j) continue;
        const ti = (i / 4) | 0, tj = (j / 4) | 0;
        const a = cur[i], b = cur[j];
        cur[i] = b; cur[j] = a;
        const ci = tableCost(h, cur.slice(4 * ti, 4 * ti + 4), slots[ti]);
        const cj = tj === ti ? ci : tableCost(h, cur.slice(4 * tj, 4 * tj + 4), slots[tj]);
        const delta = (ci - tc[ti]) + (tj === ti ? 0 : (cj - tc[tj]));
        if (delta <= 0 || rng() < Math.exp(-delta / temp)) {
          tc[ti] = ci; if (tj !== ti) tc[tj] = cj; total += delta;
        } else { cur[i] = a; cur[j] = b; }
      }
      if (total < bc) { bc = total; best = cur.slice(); }
    }
    return { arr: best, cost: bc };
  }

  // Place 4 joueurs (paires [0,1] et [2,3]) sur les sièges
  function orient(four, boardNums, h, K, rng, useDecl) {
    const bonus = { N: 0, E: 0, S: 0, O: 0 };
    boardNums.forEach(n => bonus[designated(n, K)]++);
    const pairs = [[four[0], four[1]], [four[2], four[3]]];
    let best = null, bc = Infinity;
    for (let ns = 0; ns < 2; ns++) for (let f1 = 0; f1 < 2; f1++) for (let f2 = 0; f2 < 2; f2++) {
      const pn = pairs[ns], pe = pairs[1 - ns];
      const seats = {
        N: f1 ? pn[1] : pn[0], S: f1 ? pn[0] : pn[1],
        E: f2 ? pe[1] : pe[0], O: f2 ? pe[0] : pe[1]
      };
      let c = 0;
      SEATS.forEach(k => {
        const id = seats[k];
        const sc = (h.seat[id] && h.seat[id][k]) || 0;
        c += W_S * sc * sc;
        if (useDecl) {
          // équilibrer les quatre rôles : chacun déclare, fait le mort, entame et défend
          const r0 = h.role[id] || { D: 0, M: 0, L: 0, F: 0 }, r = { D: r0.D, M: r0.M, L: r0.L, F: r0.F };
          boardNums.forEach(n => { r[roleOf(k, designated(n, K))]++; });
          c += W_D * (r.D * r.D + r.M * r.M + r.L * r.L + r.F * r.F) + 2 * W_D * r.D * r.D;
        }
      });
      c += rng() * 0.01;
      if (c < bc) { bc = c; best = seats; }
    }
    return best;
  }

  /* ---------- Plan du jour ---------- */
  function suggestPlan(P, hasTeacher) {
    if (hasTeacher && P % 4 === 3) return { tables: (P + 1) / 4, rest: 0, teacherPlays: true };
    const tables = Math.floor(P / 4);
    return { tables, rest: P - 4 * tables, teacherPlays: false };
  }

  function timeToMs(hhmm, ref) {
    const d = new Date(ref);
    const p = String(hhmm || '00:00').split(':');
    d.setHours(+p[0] || 0, +p[1] || 0, 0, 0);
    return d.getTime();
  }
  // Nombre de donnes conseillé pour le prochain tour, pour finir pile à l'heure
  function autoBoards(state, nowMs) {
    const s = state.settings;
    const end = timeToMs(s.end, nowMs);
    const start = timeToMs(s.start, nowMs);
    const from = Math.max(nowMs, start);
    let remaining = (end - from) / 60000;
    if (remaining <= 0) return 1;
    const done = (state.rounds || []).length;
    let roundsLeft;
    if (s.nRounds > 0) {
      // nombre de tours fixé (ex. 4 tours d'environ 45 min) ; la pause est prise à mi-parcours
      roundsLeft = Math.max(1, s.nRounds - done);
      if (s.pauseMin && done < Math.ceil(s.nRounds / 2)) remaining -= s.pauseMin;
    } else roundsLeft = Math.max(1, Math.round(remaining / s.roundMin));
    const per = remaining / roundsLeft - (s.changeMin || 0);
    const b = Math.floor(per / s.minPerBoard + 0.25);
    return Math.max(1, Math.min(s.relay ? 8 : s.setSize, b));
  }

  function roundSlot(state, nowMs) {
    const s = state.settings;
    const end = timeToMs(s.end, nowMs), start = timeToMs(s.start, nowMs);
    let remaining = (end - Math.max(nowMs, start)) / 60000;
    if (remaining <= 0) return s.minPerBoard;
    const done = (state.rounds || []).length;
    let roundsLeft;
    if (s.nRounds > 0) { roundsLeft = Math.max(1, s.nRounds - done); if (s.pauseMin && done < Math.ceil(s.nRounds / 2)) remaining -= s.pauseMin; }
    else roundsLeft = Math.max(1, Math.round(remaining / s.roundMin));
    return Math.max(10, remaining / roundsLeft - (s.changeMin || 0));
  }

  /* ---------- Relais des étuis ----------
     Chaque table commence avec k étuis. Après chaque donne, l'étui passe à la table suivante.
     La table t joue d'abord ses k étuis, puis ceux de la table t-1, puis de t-2, etc. */
  function relayBoards(T, k, b, base, t) {
    const out = [];
    const n = Math.min(b, k * T);
    for (let j = 0; j < n; j++) {
      const origin = (((t - 1 - Math.floor(j / k)) % T) + T) % T;
      out.push(base + origin * k + (j % k));
    }
    return out;
  }

  /* ---------- Génération d'un tour ---------- */
  function planRound(state, opt) {
    opt = opt || {};
    const rng = opt.rng || Math.random;
    const st = state.settings, K = st.setSize;
    const h = history(state);
    const present = state.players.filter(p => p.present);
    const teacher = present.find(p => p.teacher) || null;
    const pool = present.filter(p => !p.teacher);
    const P = pool.length;
    const plan = suggestPlan(P, !!teacher);
    const T = plan.tables;
    if (T < 1) return { error: 'Il faut au moins 4 joueurs présents (ou 3 avec le professeur).' };
    const b = Math.max(1, Math.min(st.relay ? 8 : K, opt.boards || autoBoards(state, opt.now || Date.now())));

    // Qui se repose ? (ceux qui se sont le moins reposés ; jamais un joueur qui n'a pas encore joué)
    const cand = pool.map(p => ({ p, never: (h.played[p.id] || 0) === 0 ? 1 : 0, r: h.rests[p.id] || 0, l: h.lastRest[p.id] == null ? -1 : h.lastRest[p.id], x: rng() }));
    cand.sort((a, c) => a.never - c.never || a.r - c.r || a.l - c.l || a.x - c.x);
    const rest = cand.slice(0, plan.rest).map(c => c.p);
    const restIds = new Set(rest.map(p => p.id));
    const players = pool.filter(p => !restIds.has(p.id));
    if (plan.teacherPlays) players.push(teacher);

    const warnings = [];
    if (st.relay) {
      // Mouvement relais : pas de lots ; on place les joueurs, puis on distribue les étuis
      const k = Math.max(1, st.perTable || 2);
      const base = opt.base || 1;
      const bb = Math.min(b, k * T);
      const ids0 = players.map(p => p.id);
      const dummy = []; for (let t = 0; t < T; t++) dummy.push(-1 - t);
      const res0 = anneal(ids0, dummy, h, rng, 2500 * T + 4000, 4);
      const tables0 = [];
      const stats0 = { repeatPartners: 0, repeatOpp: 0, replays: 0 };
      for (let t = 0; t < T; t++) {
        const q = res0.arr.slice(4 * t, 4 * t + 4);
        const boards = relayBoards(T, k, bb, base, t + 1);
        const seats = orient(q, boards, h, 4, rng, !!st.prepared);
        if ((h.partner[pk(seats.N, seats.S)] || 0) > 0) stats0.repeatPartners++;
        if ((h.partner[pk(seats.E, seats.O)] || 0) > 0) stats0.repeatPartners++;
        [[seats.N, seats.E], [seats.N, seats.O], [seats.S, seats.E], [seats.S, seats.O]].forEach(x => { if (h.opp[pk(x[0], x[1])]) stats0.repeatOpp++; });
        tables0.push({ n: t + 1, set: null, boards, own: boards.slice(0, Math.min(k, boards.length)), seats, closed: false, results: {}, extra: [], passTo: T > 1 ? (t + 1) % T + 1 : null, recvFrom: T > 1 ? ((t - 1 + T) % T) + 1 : null });
      }
      if (b > k * T) warnings.push('Avec ' + T + ' tables et ' + k + ' étuis par table, chaque table ne peut jouer que ' + (k * T) + ' étuis différents par période.');
      return {
        n: state.rounds.length + 1, startedAt: opt.now || Date.now(), b: bb,
        tables: tables0, rest: rest.map(p => p.id), teacherPlays: plan.teacherPlays,
        relay: { k, base, count: k * T, last: base + k * T - 1 },
        warnings, stats: stats0
      };
    }

    // Séries de donnes de ce tour
    const poolSize = Math.min(st.bankSets, Math.max(T + 3, h.maxSet));
    const order = [];
    for (let i = 1; i <= poolSize; i++) order.push(i);
    order.sort((a, c) => (h.setUse[a] || 0) - (h.setUse[c] || 0) || a - c);
    if (T > poolSize) warnings.push('Pas assez de séries de donnes (' + poolSize + ') pour ' + T + ' tables : augmentez le nombre de séries dans les réglages.');

    // On essaie plusieurs combinaisons d'étuis et on garde celle où personne ne rejoue un étui déjà vu
    const ids = players.map(p => p.id);
    let res = null, slots = null;
    for (let attempt = 0; attempt < 8; attempt++) {
      let ord = order.slice();
      if (attempt > 0) {
        // on garde les moins utilisés en tête, mais on mélange le reste du lot
        const lead = Math.max(0, T - 2);
        ord = order.slice(0, lead).concat(shuffle(order.slice(lead), rng));
      }
      const chosen = [];
      for (let i = 0; i < T; i++) chosen.push(ord[i % ord.length]);
      // l'étui passe à la table suivante
      const sl = new Array(T).fill(null);
      const todo = [];
      chosen.forEach(s => {
        const last = h.setLast[s];
        const want = last ? (last.table % T) : -1;
        if (last && T > 1 && sl[want] == null) sl[want] = s; else todo.push(s);
      });
      todo.sort((x, y) => x - y);
      for (let t = 0; t < T; t++) if (sl[t] == null) sl[t] = todo.shift();
      const r = anneal(ids, sl, h, rng, 2500 * T + 4000, attempt === 0 ? 4 : 2);
      if (!res || r.cost < res.cost) { res = r; slots = sl; }
      if (res.cost < W_R) break;
    }
    const tables = [];
    const stats = { repeatPartners: 0, repeatOpp: 0, replays: 0 };
    for (let t = 0; t < T; t++) {
      const q = res.arr.slice(4 * t, 4 * t + 4);
      const set = slots[t];
      const boards = boardsOfSet(set, K, b);
      const seats = orient(q, boards, h, K, rng, !!st.prepared);
      if ((h.partner[pk(seats.N, seats.S)] || 0) > 0) stats.repeatPartners++;
      if ((h.partner[pk(seats.E, seats.O)] || 0) > 0) stats.repeatPartners++;
      [[seats.N, seats.E], [seats.N, seats.O], [seats.S, seats.E], [seats.S, seats.O]].forEach(x => { if (h.opp[pk(x[0], x[1])]) stats.repeatOpp++; });
      q.forEach(id => { if (h.seen[id] && h.seen[id].has(set)) stats.replays++; });
      tables.push({ n: t + 1, set, boards, seats, closed: false, results: {}, extra: [], from: h.setLast[set] ? h.setLast[set].table : null });
    }
    return {
      n: state.rounds.length + 1, startedAt: opt.now || Date.now(), b,
      tables, rest: rest.map(p => p.id), teacherPlays: plan.teacherPlays,
      warnings, stats
    };
  }

  /* ---------- Pendant un tour ---------- */
  function currentRound(state) { return state.rounds.length ? state.rounds[state.rounds.length - 1] : null; }

  function waiting(state) {
    const r = currentRound(state);
    const seated = new Set();
    if (r) r.tables.forEach(t => { if (!t.closed) SEATS.forEach(k => seated.add(t.seats[k])); });
    const present = state.players.filter(p => p.present && !seated.has(p.id));
    return {
      players: present.filter(p => !p.teacher),
      teacherFree: present.some(p => p.teacher),
      teacher: present.find(p => p.teacher) || null
    };
  }

  function replaceSeat(state, tableN, seat, newId) {
    const r = currentRound(state);
    const t = r && r.tables.find(x => x.n === tableN);
    if (!t) return false;
    const old = t.seats[seat];
    t.extra = t.extra || [];
    if (t.extra.indexOf(old) < 0) t.extra.push(old);
    t.seats[seat] = newId;
    r.rest = (r.rest || []).filter(id => id !== newId);
    return true;
  }

  function dissolveTable(state, tableN) {
    const r = currentRound(state);
    const t = r && r.tables.find(x => x.n === tableN);
    if (t) t.closed = true;
  }

  function canOpenTable(state) {
    const w = waiting(state);
    const n = w.players.length;
    return n >= 4 || (n === 3 && w.teacherFree);
  }

  function openExtraTable(state, opt) {
    opt = opt || {};
    const rng = opt.rng || Math.random;
    const r = currentRound(state);
    if (!r || !canOpenTable(state)) return null;
    const st = state.settings, K = st.setSize;
    const h = history(state);
    const w = waiting(state);
    let four = w.players.slice().sort((a, c) => (h.rests[a.id] || 0) - (h.rests[c.id] || 0)).slice(0, 4);
    if (four.length === 3) four.push(w.teacher);
    const ids = four.map(p => p.id);
    if (r.relay) {
      const used = Math.max(r.relay.last, ...r.tables.map(t => Math.max(0, ...(t.boards || [0]))));
      const boards = []; for (let i = 1; i <= r.b; i++) boards.push(used + i);
      const perms = [[0, 1, 2, 3], [0, 2, 1, 3], [0, 3, 1, 2]];
      let bp = null, bpc = Infinity;
      perms.forEach(p => { const q = p.map(i => ids[i]); const c = tableCost(h, q, -99); if (c < bpc) { bpc = c; bp = q; } });
      const seats = orient(bp, boards, h, 4, rng, !!st.prepared);
      const n = Math.max.apply(null, r.tables.map(t => t.n)) + 1;
      const table = { n, set: null, boards, own: boards.slice(), seats, closed: false, results: {}, extra: [], late: true, solo: true };
      r.tables.push(table);
      r.rest = (r.rest || []).filter(id => ids.indexOf(id) < 0);
      return table;
    }
    // série : pas déjà jouée par ces joueurs, la moins utilisée, pas déjà sur une table de ce tour
    const used = new Set(r.tables.filter(t => !t.closed).map(t => t.set));
    const nTables = r.tables.length + 1;
    const poolSize = Math.min(st.bankSets, Math.max(nTables + 3, h.maxSet));
    let bestSet = null, bs = Infinity;
    for (let s = 1; s <= poolSize; s++) {
      if (used.has(s)) continue;
      let c = (h.setUse[s] || 0);
      ids.forEach(id => { if (h.seen[id] && h.seen[id].has(s)) c += 1000; });
      if (c < bs) { bs = c; bestSet = s; }
    }
    if (bestSet == null) return null;
    const boards = boardsOfSet(bestSet, K, r.b);
    // meilleur appariement parmi les 3 possibles
    const perms = [[0, 1, 2, 3], [0, 2, 1, 3], [0, 3, 1, 2]];
    let bp = null, bpc = Infinity;
    perms.forEach(p => {
      const q = p.map(i => ids[i]);
      const c = tableCost(h, q, bestSet);
      if (c < bpc) { bpc = c; bp = q; }
    });
    const seats = orient(bp, boards, h, K, rng, !!st.prepared);
    const n = Math.max.apply(null, r.tables.map(t => t.n)) + 1;
    const table = { n, set: bestSet, boards, seats, closed: false, results: {}, extra: [], late: true };
    r.tables.push(table);
    r.rest = (r.rest || []).filter(id => ids.indexOf(id) < 0);
    return table;
  }

  /* ---------- Scores ---------- */
  function computeScores(state) {
    const byBoard = {};
    state.rounds.forEach((r, ri) => {
      r.tables.forEach(t => {
        Object.keys(t.results || {}).forEach(bn => {
          const x = t.results[bn];
          if (!x || !x.players) return;
          (byBoard[bn] = byBoard[bn] || []).push({ round: r.n, table: t.n, r: x, ns: nsScore(x, +bn) });
        });
      });
    });
    const acc = {};
    const add = (id, pct) => { const a = acc[id] || (acc[id] = { sum: 0, n: 0 }); a.sum += pct; a.n++; };
    Object.keys(byBoard).forEach(bn => {
      const list = byBoard[bn];
      const n = list.length;
      list.forEach(x => {
        if (n < 2) { x.pct = null; return; }
        let mp = 0;
        list.forEach(o => { if (o !== x) mp += x.ns > o.ns ? 1 : x.ns === o.ns ? 0.5 : 0; });
        x.pct = mp / (n - 1) * 100;
        add(x.r.players.N, x.pct); add(x.r.players.S, x.pct);
        add(x.r.players.E, 100 - x.pct); add(x.r.players.O, 100 - x.pct);
      });
    });
    const h = history(state);
    const players = state.players.map(p => {
      const a = acc[p.id];
      return { id: p.id, name: p.name, teacher: !!p.teacher, avg: a ? a.sum / a.n : null, boards: a ? a.n : 0, declared: h.decl[p.id] || 0, rounds: h.played[p.id] || 0 };
    });
    return { players, byBoard };
  }

  const BR = {
    SEATS, SEAT_NAME, boardInfo, setOf, designated, boardsOfSet,
    roleOf, relayBoards, scoreContract, nsScore, mulberry32, history, suggestPlan, autoBoards, roundSlot, timeToMs,
    planRound, currentRound, waiting, replaceSeat, dissolveTable, canOpenTable, openExtraTable, computeScores
  };
  if (typeof module !== 'undefined' && module.exports) module.exports = BR;
  else root.BR = BR;
})(typeof window !== 'undefined' ? window : globalThis);

</script>
<script>
/* Bridge Relax — interface (v2 : séances datées, inscriptions, feuilles d'étui) */

      step(4, 'Noter les réponses', 'Joueurs, puis Réponses : touchez Oui, ? ou Non à côté de chaque nom.') +
      step(5, 'Imprimer les feuilles d\'étui', 'Aujourd\'hui, étape « Préparer les étuis ». Une feuille par étui, à glisser dedans.') + '</div>' +
      '<div class="panel"><h3 class="hh">Le jour même</h3>' +
      step(6, 'Accueillir', 'Joueurs, puis Arrivées : touchez « Arrivé » quand une personne arrive. Une erreur ? Touchez « Annuler ».') +
      step(7, 'Lancer la période', 'Aujourd\'hui ou Tables : le gros bouton vert. L\'application forme les tables toute seule.') +
      step(8, 'Annoncer les tables', 'Lisez la liste « Qui va où ? », ou touchez « Grand écran » si l\'appareil est relié à une télévision.') +
      step(9, 'Quelqu\'un part', 'Joueurs, Arrivées : touchez « Départ ». Sa place est aussitôt donnée à quelqu\'un qui attend, ou au professeur.') +
      step(10, 'Fin de la période', 'Un signal sonne 5 minutes avant la fin, puis à la fin. On note les scores sur la feuille de l\'étui, on rebat les cartes, puis on relance.') + '</div>' +
      '<div class="panel"><h3 class="hh">Après</h3>' +
      step(11, 'Le bilan', 'Aujourd\'hui, dernière étape : qui est venu, qui a joué avec qui.') +
      step(12, 'Une sauvegarde', 'Plus, Réglages, « Exporter » : une copie de sécurité de la liste et des séances.') + '</div>' +
      '<p class="mute">Bridge Relax, version ' + VERSION + ' du ' + VERSION_DATE + '.</p>';
  }
  const hh = t => String(t).replace(':00', 'h').replace(':', 'h');
  // Un nom ne se coupe jamais au milieu : on réduit la police jusqu'à ce qu'il tienne sur une ligne
  function fitNames() {
    // largeur exacte du texte (au dixième de pixel) comparée à la place disponible
    const over = el => {
      const r = document.createRange(); r.selectNodeContents(el);
      return r.getBoundingClientRect().width > el.getBoundingClientRect().width - 0.5;
    };
    document.querySelectorAll('.plate .pn').forEach(el => {
      el.style.fontSize = ''; el.classList.remove('wrap');
      if (!el.getBoundingClientRect().width) return;
      let fs = parseFloat(getComputedStyle(el).fontSize) || 19;
      let guard = 0;
      while (over(el) && fs > 12 && guard++ < 30) { fs -= 0.5; el.style.fontSize = fs + 'px'; }
      // Toujours trop long (nom composé) : retour à la ligne seulement entre deux mots
      if (over(el) && /[\s-]/.test(el.textContent)) el.classList.add('wrap');
    });
  }
  window.addEventListener('resize', () => { clearTimeout(ui.fitT); ui.fitT = setTimeout(fitNames, 120); });
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(fitNames);
  document.addEventListener('toggle', e => { if (e.target.classList && e.target.classList.contains('lvconf')) ui.lvOpen = e.target.open; }, true);
  window.addEventListener('online', () => { if (!ui.cover && ui.tab !== 'salle') render(); });
  window.addEventListener('offline', () => { if (!ui.cover && ui.tab !== 'salle') render(); });
  window.addEventListener('orientationchange', () => setTimeout(fitNames, 300));
  function render() {
    if (ui.cover) { document.body.className = 'cover-on'; document.body.innerHTML = viewCover(); return; }
    document.body.className = (ui.tab === 'salle' ? 'salle-on' : '') + (D.settings.big ? ' big' : '');
    if (ui.tab === 'salle') { document.body.innerHTML = viewSalle(); ui.fresh = false; updateClock(); return; }
    const simple = D.settings.simple !== false;
    if (!simple && (ui.tab === 'today' || ui.tab === 'plus')) ui.tab = ui.tab === 'today' ? 'tour' : 'reglages';
    const tabs = simple
      ? [['today', 'Aujourd\'hui'], ['joueurs', 'Joueurs'], ['tour', 'Tables'], ['plus', 'Plus']]
      : [['seances', 'Séances'], ['joueurs', 'Joueurs'], ['tour', 'Période'], ['etuis', 'Étuis'], ['reglages', 'Réglages']];
    const inPlus = ['seances', 'etuis', 'reglages', 'bilan', 'aide', 'plus'];
    const s = cur();
    document.body.innerHTML =
      '<header><img class="logo" src="' + LOGO + '" alt="Page de garde" data-a="cover"><div class="htitle"><h1>Bridge Relax</h1><button class="hdate" data-a="tab" data-v="seances">' + esc(cap(fmtDate(s.date, { weekday: 'short', day: 'numeric', month: 'short' }))) + ' · ' + hh(s.start) + '–' + hh(s.end) + '</button></div><div class="clock" id="hclock"></div></header>' +
      '<nav>' + tabs.map(t => '<button data-a="tab" data-v="' + t[0] + '" class="' + (ui.tab === t[0] || (simple ? (t[0] === 'plus' && inPlus.indexOf(ui.tab) >= 0) : (ui.tab === 'bilan' && t[0] === 'seances')) ? 'on' : '') + '"><svg viewBox="0 0 24 24" aria-hidden="true">' + ICON[t[0]] + '</svg>' + t[1] + '</button>').join('') + '</nav>' +
      (navigator.onLine === false ? '<div class="offbar">Pas de réseau : l\'application fonctionne normalement, tout est enregistré sur cet appareil.</div>' : '') +
      (ui.toast ? '<div id="toast" class="toast' + (ui.toast.warn ? ' warn' : '') + '" data-a="toastclose">' + esc(ui.toast.msg) + '</div>' : '') +
      '<main>' + ({ seances: viewSessions, joueurs: viewPlayers, tour: viewRound, etuis: viewBoards, reglages: viewSettings, bilan: viewBilan, aide: viewHelp, today: viewToday, plus: viewPlus }[ui.tab] || viewRound)() + '</main>';
    ui.fresh = false;
    updateClock();
    fitNames();
    // second passage une fois la mise en page stabilisée
    if (window.requestAnimationFrame) requestAnimationFrame(fitNames);
    setTimeout(fitNames, 250);
  }

  /* ---------- Comptes ---------- */
  function counts(s) {
    const c = { yes: 0, no: 0, none: 0, present: 0, left: 0, teacherYes: false, teacherPresent: false };
    D.roster.forEach(p => {
      if (p.archived) return;
      const v = rsvpOf(s, p.id); c[v]++;
      if (v === 'yes' && p.teacher) c.teacherYes = true;
      const a = s.att[p.id] || {};
      if (a.present) { c.present++; if (p.teacher) c.teacherPresent = true; }
      else if (a.left) c.left++;
    });
    return c;
  }
  function expected(s, raw) {
    const c = counts(s);
    const n = c.yes - (c.teacherYes ? 1 : 0);
    let plan = BR.suggestPlan(n, c.teacherYes);
    // si davantage de personnes sont déjà arrivées que de « oui », on compte les présents
    const nHere = D.roster.filter(p => !p.archived && !p.teacher && (s.att[p.id] || {}).present).length;
    const hp = BR.suggestPlan(nHere, c.teacherPresent);
    if (hp.tables > plan.tables) plan = hp;
    const e = { players: Math.max(c.yes, c.present), tables: plan.tables };
    if (raw) return e;
    const k = Math.max(1, D.settings.perTable || 2), f = fmt(s);
    e.k = k; e.circ = plan.tables * k;
    // Donnes préparées, ou non préparées sans rebattre : de nouveaux étuis à chaque période
    e.fresh = D.settings.prepared || D.settings.reshuffle === false;
    e.etuis = e.fresh ? e.circ * f.nRounds : e.circ;
    return e;
  }

  /* ---------- Situation du jour ---------- */
  function planInfo() {
    const c = C();
    const present = c.players.filter(p => p.present);
    const teacher = present.find(p => p.teacher);
    const n = present.filter(p => !p.teacher).length;
    const plan = BR.suggestPlan(n, !!teacher);
    let txt = plural(present.length, 'personne présente', 'personnes présentes') + (teacher ? ', professeur compris' : '') + '.';
    if (plan.tables < 1) txt = plural(present.length, 'personne présente', 'personnes présentes') + '. Il en faut au moins 4 pour une table (3 avec le professeur).';
    else {
      if (plan.teacherPlays) txt += ' Le professeur joue à une table.';
      if (plan.rest) {
        txt += ' ' + plural(plan.rest, 'joueur au repos', 'joueurs au repos') + ' à chaque période.';
        const need = teacher ? 3 - plan.rest : 4 - plan.rest;
        if (need > 0) txt += ' Encore ' + plural(need, 'arrivée', 'arrivées') + ' et une table de plus s\'ouvre.';
      }
    }
    return { tables: plan.tables, txt };
  }
  function planBlock() {
    const p = planInfo();
    return '<div class="plan"><div class="big">' + p.tables + '<small>' + (p.tables > 1 ? 'tables' : 'table') + '</small></div><div class="txt">' + esc(p.txt) + '</div></div>';
  }
  function timeline() {
    const s = cur(), now = Date.now();
    const a = sessMs(s, s.start), z = sessMs(s, s.end);
    const span = Math.max(1, z - a);
    const pct = t => Math.max(0, Math.min(100, (t - a) / span * 100));
    const r = BR.currentRound(C());
    const segs = s.rounds.map(x => '<i class="seg' + (x === r ? ' cur' : '') + '" style="left:' + pct(x.startedAt) + '%;width:' + Math.max(1, pct(roundEnd(x)) - pct(x.startedAt)) + '%"></i>').join('');
    let ticks = '';
    const d0 = new Date(a); d0.setMinutes(0, 0, 0);
    for (let t = d0.getTime(); t <= z; t += 3600000) if (t >= a) ticks += '<span style="left:' + pct(t) + '%">' + new Date(t).getHours() + ' h</span>';
    return '<div class="tl"><div class="bar">' + segs + (now >= a && now <= z ? '<i class="now" style="left:' + pct(now) + '%"></i>' : '') + '</div><div class="ticks">' + ticks + '</div></div>';
  }

  /* ---------- Aujourd'hui : le fil conducteur, étape par étape ---------- */
  function viewToday() {
    const s = cur(), now = Date.now(), dd = daysUntil(s.date), c = counts(s), e = expected(s), f = fmt(s);
    const start = sessMs(s, s.start), end = sessMs(s, s.end);
    const over = dd < 0 || (dd === 0 && now >= end);
    const r = BR.currentRound(C());
    const nPlay = D.roster.filter(p => !p.archived && !p.teacher && isPresent(p.id)).length;
    const teacherHere = D.roster.some(p => p.teacher && isPresent(p.id));
    const canPlay = nPlay >= 4 || (nPlay >= 3 && teacherHere);
    const upcoming = D.sessions.filter(x => sessMs(x, x.end) > now).sort((a, b) => a.date.localeCompare(b.date));
    // étape en cours
    let step = 2;
    if (over) step = s.rounds.length ? 6 : 1;
    else if (dd === 0 && now >= start - 3 * 3600000) step = s.rounds.length ? 5 : (c.present >= 3 ? 5 : 4);
    else if (c.none === 0 && c.yes) step = 3;
    const card = (n, title, body, btns, done) => '<section class="step' + (n === step ? ' now' : '') + (done && n !== step ? ' done' : '') + '"><div class="sn">' + (done && n !== step ? '✓' : n) + '</div><div class="sb"><h3>' + title + '</h3>' + body + (btns ? '<div class="sbtn">' + btns + '</div>' : '') + '</div></section>';
    const B = (a, label, extra, cls) => '<button class="btn ' + (cls || '') + '" data-a="' + a + '"' + (extra || '') + '>' + label + '</button>';
    let h = '<div class="sec"><h2>' + (dd === 0 ? 'Aujourd\'hui' : over ? 'Séance terminée' : 'Prochaine séance') + '</h2><p class="lead">Suivez les étapes dans l\'ordre. L\'étape en cours est encadrée.</p></div>';
    // 1. La séance
    h += card(1, 'La séance', '<p class="big1">' + esc(cap(fmtDate(s.date))) + '<br><small>' + hh(s.start) + ' à ' + hh(s.end) + ' · ' + f.nRounds + ' périodes de ' + f.label + '</small></p><p class="place">📍 ' + placeLines(s).map(esc).join(', ') + '</p>' +
      (over && !upcoming.length ? '<p>Cette séance est passée. Créez la suivante.</p>' : ''),
      over && upcoming.length ? B('sopen', 'Ouvrir la séance du ' + esc(fmtDate(upcoming[0].date, { day: 'numeric', month: 'long' })), ' data-id="' + upcoming[0].id + '"', 'pri') : (over ? B('tab', 'Créer la prochaine séance', ' data-v="seances"', 'pri') : B('tab', 'Changer la date ou l\'heure', ' data-v="seances"')), true);
    // 2. Les réponses
    h += card(2, 'Qui vient ?', '<div class="cnt3"><span class="k yes">' + c.yes + ' oui</span><span class="k none">' + c.none + ' pas répondu</span><span class="k no">' + c.no + ' non</span></div>' +
      '<p>' + (c.yes + c.none + c.no ? 'Notez la réponse de chacun : Oui, ? ou Non.' : 'Ajoutez d\'abord la liste des joueurs.') + '</p>',
      (c.yes + c.none + c.no ? B('gotoresp', 'Noter les réponses', '', step === 2 ? 'pri' : '') + B('gotoinvite', 'Écrire l\'invitation') : B('gotolist', 'Ajouter les joueurs', '', 'pri')), c.none === 0 && c.yes > 0);
    // 3. Les étuis
    h += card(3, 'Préparer les étuis', e.tables ? '<p>Apportez <b>' + plural(e.etuis, 'étui', 'étuis') + '</b> (numéros 1 à ' + e.etuis + '), avec une feuille dans chaque étui, et <b>un jeu de cartes de secours</b> par table.</p>' : '<p>Le nombre d\'étuis sera calculé dès qu\'il y aura des réponses « oui ».</p>',
      e.tables ? B('gosheets', 'Imprimer les feuilles d\'étui', '', step === 3 ? 'pri' : '') : '', false);
    // 4. Les arrivées
    h += card(4, 'Accueillir les joueurs', '<p class="big1">' + c.present + ' <small>arrivé' + (c.present > 1 ? 's' : '') + (c.yes ? ' sur ' + c.yes + ' attendu' + (c.yes > 1 ? 's' : '') : '') + '</small></p><p>Touchez « Arrivé » à côté du nom de chaque personne qui arrive.</p>',
      B('gotoarr', 'Accueillir les joueurs', '', step === 4 ? 'pri' : ''), c.present > 0 && s.rounds.length > 0);
    // 5. Jouer
    let body5, btn5;
    if (r) {
      const left = (roundEnd(r) - now) / 60000;
      body5 = '<p class="big1">Période ' + r.n + ' sur ' + f.nRounds + '<br><small>' + (left > 0 ? 'fin vers ' + fmtT(roundEnd(r)) + ', dans ' + fmtDur(left) : 'temps écoulé : quand les tables ont fini, lancez la suivante') + '</small></p>';
      btn5 = B('tab', 'Voir les tables', ' data-v="tour"', left > 0 ? 'pri' : '') + (s.rounds.length < f.nRounds || left <= 0 ? B('next', 'Lancer la période ' + (s.rounds.length + 1), '', left <= 0 ? 'pri go' : '') : '') + B('salle', 'Grand écran');
    } else if (canPlay && !over) {
      body5 = '<p>' + esc(planInfo().txt) + '</p>';
      btn5 = B('next', s.rounds.length ? 'Lancer la période ' + (s.rounds.length + 1) : 'Lancer la première période', '', 'pri go');
    } else {
      body5 = '<p>' + (over ? 'La séance est terminée.' : 'Il faut au moins 4 joueurs arrivés (ou 3 avec le professeur) pour former une table.') + '</p>';
      btn5 = '';
    }
    h += card(5, 'Jouer', body5, btn5, s.rounds.length >= f.nRounds);
    // 6. Le bilan
    h += card(6, 'Après la séance', '<p>Le bilan : présents, absents inscrits, qui a joué avec qui.</p>', s.rounds.length ? B('bilan', 'Voir le bilan', ' data-id="' + s.id + '"', step === 6 ? 'pri' : '') : '', false);
    h += levelSummary(s);
    h += '<p class="mute" style="text-align:center;margin-top:16px">Besoin d\'aide ? <button class="lnk" data-a="help">Mode d\'emploi</button></p>';
    return h;
  }
  /* ---------- Plus : tout le reste ---------- */
  function viewPlus() {
    const it = (a, extra, icon, t, d) => '<button class="pitem" data-a="' + a + '"' + extra + '><span class="pi">' + icon + '</span><span><b>' + t + '</b><small>' + d + '</small></span><span class="pc">›</span></button>';

      it('bilan', ' data-id="' + cur().id + '"', '📋', 'Bilan de la séance', 'Présents, absents, qui a joué avec qui') +
      it('goavoid', '', '⛔', 'Incompatibilités', 'Deux personnes jamais à la même table') +
      it('tab', ' data-v="reglages"', '⚙️', 'Réglages', 'Durée des périodes, étuis, son, sauvegarde') +
      it('help', '', '❓', 'Mode d\'emploi', 'Les étapes d\'un après-midi, une par une') +

      '</div><div class="panel"><h3>Affichage</h3>' +

      '<label class="chk"><input type="checkbox" data-f="simple"' + (D.settings.simple !== false ? ' checked' : '') + '> Mode simple (4 onglets)</label>' +
      '<p class="mute">Le mode complet montre tous les onglets et réglages, pour l\'organisateur qui veut tout régler.</p></div>';
  }

  /* ---------- Séances ---------- */
  function sessionCard(s) {
    const c = counts(s), e = expected(s), isCur = s.id === D.cur;
    const d = dateObj(s.date), dd = daysUntil(s.date);
    const when = dd === 0 ? 'aujourd\'hui' : dd === 1 ? 'demain' : dd > 1 ? 'dans ' + dd + ' jours' : 'passée';
    let h = '<div class="scwrap"><div class="scard' + (isCur ? ' cur' : '') + (dd < 0 ? ' past' : '') + '">' +
      '<div class="sdate"><b>' + d.getDate() + '</b><span>' + esc(fmtDate(s.date, { month: 'short' })) + '</span></div>' +
      '<div class="sinfo"><div class="st">' + esc(cap(fmtDate(s.date, { weekday: 'long' }))) + ' <small>' + when + '</small></div>' +
      '<div class="sh">' + esc(placeName(s)) + ' · ' + s.start.replace(':', 'h') + ' à ' + s.end.replace(':', 'h') + ', ' + fmt(s).nRounds + ' périodes de ' + fmt(s).label + (s.rounds.length ? ', ' + plural(s.rounds.length, 'période jouée', 'périodes jouées') : '') + '</div>' +
      '<div class="cnt"><span class="k yes">' + c.yes + ' inscrits</span><span class="k none">' + c.none + ' sans réponse</span><span class="k no">' + c.no + ' refus</span></div>' +
      (e.tables ? '<div class="mute">Prévu : ' + plural(e.tables, 'table', 'tables') + ', ' + plural(e.etuis, 'étui', 'étuis') + ' à apporter.</div>' : '') + '</div>' +
      '<div class="sact">' + (isCur ? '<span class="pill">ouverte</span>' : '<button class="btn sm pri" data-a="sopen" data-id="' + s.id + '">Ouvrir</button>') +
      (s.rounds.length || dd < 0 ? '<button class="btn sm" data-a="bilan" data-id="' + s.id + '">Bilan</button>' : '') +
      '' + '</div></div>';
    // Suppression : bouton clair, puis confirmation explicite
    const c0 = counts(s);
    const delz = '<div class="sdelz">' + (ui.delS === s.id
      ? '<div class="sdelask"><b>Supprimer la séance du ' + esc(fmtDate(s.date)) + ' ?</b><p>Les réponses (' + plural(c0.yes, 'oui', 'oui') + ', ' + c0.no + ' non), les présences' + (s.rounds.length ? ' et les ' + plural(s.rounds.length, 'période jouée', 'périodes jouées') : '') + ' de cette séance seront effacées. La liste des joueurs est conservée.</p><div class="row"><button class="btn danger" data-a="sdelok" data-id="' + s.id + '">Oui, supprimer</button><button class="btn" data-a="sdelno">Non, garder</button></div></div>'
      : (D.sessions.length > 1 ? '<button class="btn sm sdelb" data-a="sdel" data-id="' + s.id + '"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h16M9 7V4.5h6V7M6.5 7l1 13h9l1-13M10 11v6M14 11v6"/></svg>Supprimer la séance</button>' : '<span class="mute small">Seule séance : modifiez sa date plutôt que de la supprimer.</span>')) + '</div>';
    if (isCur) {
      h += '<div class="sedit"><div class="grow"><label class="f">Date</label><input type="date" data-f="sess" data-k="date" value="' + s.date + '"></div><div><label class="f">Début</label><input type="time" data-f="sess" data-k="start" value="' + s.start + '"></div><div><label class="f">Fin</label><input type="time" data-f="sess" data-k="end" value="' + s.end + '"></div><div class="grow"><label class="f">Lieu</label>' + placeSelect('data-f="splace"', s.place) + '</div><div><label class="f">Durée des périodes</label><select data-f="sess" data-k="dur">' + Object.keys(FORMATS).map(k => '<option value="' + k + '"' + (fmt(s).key === k ? ' selected' : '') + '>' + FORMATS[k].label + '</option>').join('') + '</select></div></div>';
    }
    return h + delz + '</div>';
  }
  function suggestNextDate() {
    const last = D.sessions.map(s => s.date).sort().pop();
    let d = last ? dateObj(last) : new Date();
    d.setDate(d.getDate() + 7);
    const t = dateObj(todayIso());
    while (d < t) d.setDate(d.getDate() + 7);
    return isoDay(d);
  }
  function viewSessions() {
    const t = todayIso();
    const up = D.sessions.filter(s => s.date >= t).sort((a, b) => a.date.localeCompare(b.date));
    const past = D.sessions.filter(s => s.date < t).sort((a, b) => b.date.localeCompare(a.date));
    let h = '<div class="sec"><h2>Séances</h2><p class="lead">Chaque après-midi a sa date, ses heures et ses inscriptions. La liste des joueurs est commune à toutes les séances.</p></div>';
    h += '<div class="panel newsess"><h3>Nouvelle séance</h3><div class="sedit"><div class="grow"><label class="f">Date</label><input type="date" id="ns-date" value="' + suggestNextDate() + '"></div><div><label class="f">Début</label><input type="time" id="ns-start" value="' + D.settings.start + '"></div><div><label class="f">Fin</label><input type="time" id="ns-end" value="' + D.settings.end + '"></div><div class="grow"><label class="f">Lieu</label>' + placeSelect('id="ns-place" data-f="nsplace"', D.settings.defPlace) + '</div><div><label class="f">Durée des périodes</label><select id="ns-dur">' + Object.keys(FORMATS).map(k => '<option value="' + k + '"' + ((D.settings.format || '45') === k ? ' selected' : '') + '>' + FORMATS[k].label + '</option>').join('') + '</select></div></div><button class="btn pri" style="margin-top:10px" data-a="snew">Créer et ouvrir</button></div>';
    h += '<h3 class="lbl">À venir</h3>' + (up.length ? '<div class="slist">' + up.map(sessionCard).join('') + '</div>' : '<p class="mute">Aucune séance à venir.</p>');
    if (past.length) h += '<h3 class="lbl">Passées</h3><div class="slist">' + past.map(sessionCard).join('') + '</div>';
    return h;
  }

  /* ---------- Joueurs : inscriptions, accueil, liste ---------- */
