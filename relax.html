      const bonus = BR.boardsOfSet(t.set, kk).filter(n => t.boards.indexOf(n) < 0);
      if (bonus.length) h += '<div class="buf">Étui de réserve si vous finissez en avance : ' + bonus.map(bn => '<span class="bchip">' + bn + '</span>').join('') + '</div>';
    } else if (!t.closed) h += '<div class="buf">En attente d\'un étui ? Jouez une donne libre avec le jeu de secours de la table.</div>';
    return h + '</div>';
  }
  function tableLevel(t) {
    const ls = SEATS.map(k => getP(t.seats[k])).filter(p => p && !p.teacher).map(p => p.level);
    if (!ls.length || ls.some(x => !x)) return '';
    const u0 = [...new Set(ls)];
    return u0.length === 1 ? ' <span class="lv lv' + u0[0] + '">N' + u0[0] + '</span>' : ' <span class="lv lvm">N1+N2</span>';
  }
  function originTable(r, bn) {
    const t = r.tables.find(x => (x.own || []).indexOf(bn) >= 0);
    return t ? t.n : '?';
  }
  function miniBoard(b) {
    return '<span class="mb' + (b.vulNS ? ' vns' : '') + (b.vulEW ? ' veo' : '') + '"><i class="d' + b.dealer + '"></i>' + b.n + '</span>';
  }

  /* ---------- Étuis et feuilles ---------- */
  function sheetRows() {
    const f = fmt(), k = Math.max(1, D.settings.perTable || 2);
    const perPeriod = Math.ceil(4 / k) + 1;
    const fresh = D.settings.prepared || D.settings.reshuffle === false;
    return Math.min(8, fresh ? perPeriod + 1 : Math.ceil(4 / k) * f.nRounds);
  }
  function sheetHtml(bn) {
    const s = cur(), n = sheetRows(), b = BR.boardInfo(bn);
    const fresh = D.settings.prepared || D.settings.reshuffle === false;
    return '<div class="sp-board"><div class="sp-bt"><span class="sp-n' + (b.vulNS ? ' vns' : '') + (b.vulEW ? ' veo' : '') + '">' + bn + '</span>Étui ' + bn + ' <small>Donneur : ' + SN[b.dealer] + '. Vulnérable : ' + vulName(b.vul) + '.' + (D.settings.prepared ? ' Déclarant prévu : ' + SN[roleSeats(bn).D] + ', entame : ' + SN[roleSeats(bn).L] + '.' : '') + '</small><span class="sp-d">Bridge Relax, ' + esc(fmtDate(s.date, { day: 'numeric', month: 'long' })) + '</span></div>' +
      '<div class="sp-ex">Exemple : contrat <b>4♠ par Sud</b> · entame <b>Roi de ♥</b> · résultat <b>=</b> (contrat juste fait), <b>+1</b> (une levée de plus) ou <b>−2</b> (chute de deux) · points dans la colonne du camp qui marque.</div>' +
      '<table class="sp-t"><thead><tr>' + (fresh ? '' : '<th class="w1">Période</th>') + '<th class="w1">Table</th><th>Contrat<br><small>et qui le joue</small></th><th>Entame</th><th class="w2">Résultat<br><small>=, +1, −1…</small></th><th class="w2">Points<br>Nord-Sud</th><th class="w2">Points<br>Est-Ouest</th></tr></thead><tbody>' +
      ('<tr>' + (fresh ? '' : '<td></td>') + '<td></td><td></td><td></td><td></td><td></td><td></td></tr>').repeat(n) + '</tbody></table></div>';
  }
  function viewBoards() {
    const s = cur(), e = expected(s), f = fmt(s);
    const k = e.k;
    const r = BR.currentRound(C());
    const T = (r && r.relay) ? r.tables.filter(t => !t.closed && !t.solo).length : e.tables;
    const circ = (r && r.relay) ? r.relay.count : e.circ;
    const total = Math.max(e.etuis, r && r.relay ? r.relay.last : 0);
    const upto = Math.min(ui.printTo || total || k * 6, 200);
    let h = '<div class="sec"><h2>Étuis</h2>' +
      '<div class="relay"><div class="rbig"><b>' + (circ || '–') + '</b><span>étuis en circulation' + (circ ? '<small>n° ' + (r && r.relay ? r.relay.base + ' à ' + r.relay.last : '1 à ' + circ) + (r && r.relay ? ', période ' + r.n : ', pour ' + plural(T, 'table', 'tables')) + '</small>' : '<small>calculé dès qu\'il y aura des réponses « oui » ou des arrivées</small>') + '</span></div>' +
      '<p>Chaque table commence avec ' + plural(k, 'étui', 'étuis') + '. Les joueurs restent à leur table pendant toute la période ; <b>après chaque donne, l\'étui passe à la table suivante</b>. Ainsi, personne ne joue deux fois le même étui dans une période. Entre deux périodes, les joueurs changent de table et de partenaire.</p>' +
      (D.settings.prepared
        ? '<p><b>Donnes préparées :</b> chaque période utilise de nouveaux étuis. Pour ' + plural(f.nRounds, 'période', 'périodes') + ' et environ ' + plural(T, 'table', 'tables') + ', ' + (e.etuis ? 'préparez les étuis 1 à ' + e.etuis + '.' : 'le nombre d\'étuis à préparer sera calculé dès qu\'il y aura des réponses « oui ».') + '</p>'
        : (D.settings.reshuffle !== false
          ? '<p><b>Donnes non préparées :</b> au début de chaque période, chaque table bat et distribue ses étuis de départ. À la fin de la période, on rebat toutes les cartes : personne ne rejouera jamais une donne. ' + (circ ? 'Les mêmes étuis 1 à ' + circ + ' servent à chaque période.' : 'Les mêmes étuis servent à chaque période.') + '</p>'
          : '<p><b>Donnes non préparées, sans rebattre :</b> chaque période utilise de nouveaux étuis' + (e.etuis ? ' (1 à ' + e.etuis + ' au total)' : '') + '.</p>')) +
      '<p class="mute">Prévoyez aussi un jeu de cartes de secours par table : une table qui attend un étui joue une donne libre en attendant.</p></div>';
    if (total > D.settings.stock) h += '<div class="note bad">Il faut ' + total + ' étuis, vous en avez ' + D.settings.stock + ' (Réglages). Mettez 1 étui par table au départ, ou rebattez les cartes à chaque période.</div>';
    // Plan de départ de la période en cours, ou plan prévu
    const plan = r && r.relay ? r.tables.filter(t => !t.closed) : Array.from({ length: T }, (_, i) => ({ n: i + 1, own: Array.from({ length: k }, (_, j) => i * k + j + 1) }));
    if (plan.length) h += '<div class="panel"><h3>' + (r && r.relay ? 'Étuis de départ, période ' + r.n : 'Étuis de départ prévus') + '</h3><div class="dgrid">' + plan.map(t => '<div class="dcell" style="--tc:' + tcol(t.n) + '"><b>Table ' + t.n + '</b><span>' + (t.own || []).map(n => '<i>' + n + '</i>').join('') + '</span><small>' + (t.solo ? 'hors relais' : 'passe à la table ' + (r && r.relay ? nextActive(r, t) : (t.n % plan.length) + 1)) + '</small></div>').join('') + '</div></div>';
    h += '<div class="panel"><h3>Feuilles d\'étui</h3><div class="row"><label class="f" style="margin:0">Imprimer les feuilles des étuis 1 à</label><input type="number" min="1" max="200" value="' + upto + '" data-f="printto" style="width:90px"><button class="btn pri" data-a="printsheets">Imprimer (' + Math.ceil(upto / 3) + ' pages)</button></div>' +
      '<p class="mute">Trois feuilles par page A4, à découper et à glisser chacune dans son étui. Chaque table y note le contrat, l\'entame, le résultat et les points. Les scores ne sont pas saisis dans l\'application.</p>' +
      '<div class="legend"><span class="mb vns" style="display:flex">9</span>Bords rouges : camp vulnérable. Point doré : donneur.</div></div>';
    if (D.settings.prepared) {
      h += '<div class="panel prepbox"><h3>Préparer les donnes</h3><p class="mute">Pour chaque étui : le déclarant prévu, qui entame et qui fait le mort. L\'application place les joueurs pour que chacun soit tour à tour déclarant, mort, à l\'entame et en défense. Composez chaque donne pour que la paire du déclarant joue le contrat (environ 24 à 27 points, une belle couleur, une petite difficulté de jeu ou d\'entame).</p><div class="row"><button class="btn pri" data-a="printprep">Imprimer la fiche de préparation</button>' + (D.settings.prepLink ? '<a class="btn" target="_blank" rel="noopener" href="' + esc(D.settings.prepLink) + '">Ouvrir l\'application de préparation</a>' : '') + '</div></div>';
      h += '<div class="sets">';
      const per = Math.max(1, e.circ || k * Math.max(1, T));
      for (let p = 0; p * per < upto; p++) {
        h += '<div class="setcard"><h3>Période ' + (p + 1) + ' <small class="mute">étuis ' + (p * per + 1) + ' à ' + Math.min(upto, (p + 1) * per) + '</small></h3>';
        for (let bn = p * per + 1; bn <= Math.min(upto, (p + 1) * per); bn++) {
          const b = BR.boardInfo(bn), rs = roleSeats(bn);
          h += '<div class="brow" style="align-items:flex-start">' + miniBoard(b) + '<div class="info"><b>Étui ' + bn + '</b> <small>donneur ' + SN[b.dealer].toLowerCase() + ', vulnérable : ' + vulName(b.vul) + '</small><br><span class="rl rD">Déclarant</span> ' + SN[rs.D] + ' <span class="rl rL">Entame</span> ' + SN[rs.L] + ' <span class="rl rM">Mort</span> ' + SN[rs.M] +
            '<div class="prepf"><input type="text" data-f="pc" data-b="' + bn + '" placeholder="Contrat visé, joué par ' + SN[rs.D] + ' (ex. 4♠)" value="' + esc((D.prep && D.prep[bn]) || '') + '"><input type="text" data-f="note" data-b="' + bn + '" placeholder="Thème (ex. impasse, entame sous l\'as, affranchissement)" value="' + esc(D.notes[bn] || '') + '"></div></div></div>';
        }
        h += '</div>';
      }
      h += '</div>';
    }
    let sh = '';
    for (let bn = 1; bn <= upto; bn++) sh += (bn % 3 === 1 ? '<section class="sheet-p">' : '') + sheetHtml(bn) + (bn % 3 === 0 || bn === upto ? '</section>' : '');
    let pr = '';
    if (D.settings.prepared) {
      pr = '<div class="prepsheet"><h2>Bridge Relax, ' + esc(fmtDate(s.date)) + ' : fiche de préparation des étuis</h2><p>Composez chaque donne pour que la paire du déclarant joue le contrat ; l\'entame part de la main indiquée.</p><table><thead><tr><th>Étui</th><th>Donneur</th><th>Vulnérable</th><th>Déclarant</th><th>Entame</th><th>Mort</th><th>Contrat visé</th><th>Thème</th></tr></thead><tbody>';
      for (let bn = 1; bn <= upto; bn++) { const b = BR.boardInfo(bn), rs = roleSeats(bn); pr += '<tr><td><b>' + bn + '</b></td><td>' + SN[b.dealer] + '</td><td>' + vulName(b.vul) + '</td><td><b>' + SN[rs.D] + '</b></td><td>' + SN[rs.L] + '</td><td>' + SN[rs.M] + '</td><td>' + esc((D.prep && D.prep[bn]) || '') + '</td><td>' + esc(D.notes[bn] || '') + '</td></tr>'; }
      pr += '</tbody></table></div>';
    }
    return h + '<div class="sheets">' + sh + '</div>' + pr;
  }

  /* ---------- Bilan de la séance ---------- */
  function viewBilan() {
    const s = D.sessions.find(x => x.id === ui.bilanId) || cur();
    const A = id => s.att[id] || {};
    const people = D.roster.filter(p => A(p.id).arr || A(p.id).present).sort((a, b) => a.name.localeCompare(b.name, 'fr'));
    const ouiAbs = D.roster.filter(p => !p.archived && rsvpOf(s, p.id) === 'yes' && !A(p.id).arr).sort((a, b) => a.name.localeCompare(b.name, 'fr'));
    const sansOui = people.filter(p => rsvpOf(s, p.id) !== 'yes');
    const partis = people.filter(p => A(p.id).left && !A(p.id).present);
    const boards = new Set(), lots = new Set(); let donnes = 0;
    s.rounds.forEach(r => r.tables.forEach(t => { if (t.closed) return; t.boards.forEach(b => boards.add(b)); lots.add(t.set); donnes += t.boards.length; }));
    const names = l => l.length ? l.map(p => esc(p.name)).join(', ') : '<span class="mute">personne</span>';
    let h = '<div class="sec"><button class="btn sm" data-a="tab" data-v="seances">‹ Séances</button><h2 style="margin-top:12px">Bilan du ' + esc(fmtDate(s.date)) + '</h2></div>' +
      '<div class="kpis"><div><b>' + people.length + '</b>présents</div><div><b>' + s.rounds.length + '</b>' + (s.rounds.length > 1 ? 'périodes jouées' : 'période jouée') + '</div><div><b>' + boards.size + '</b>étuis utilisés</div><div><b>' + (Math.max(0, ...s.rounds.map(r => r.relay ? r.relay.count : 0)) || lots.size) + '</b>étuis en circulation (au plus)</div></div>' +
      '<div class="cols2"><div class="panel"><h3>Ont dit oui mais ne sont pas venus <span class="cnt1">' + ouiAbs.length + '</span></h3><p>' + names(ouiAbs) + '</p></div>' +
      '<div class="panel"><h3>Venus sans avoir dit oui <span class="cnt1">' + sansOui.length + '</span></h3>' + (sansOui.length ? [['none', 'Sans réponse'], ['no', 'Avaient dit non']].map(k => { const l = sansOui.filter(p => (rsvpOf(s, p.id) === 'no') === (k[0] === 'no')); return l.length ? '<p><b>' + k[1] + ' (' + l.length + ') :</b> ' + l.map(p => esc(p.name)).join(', ') + '</p>' : ''; }).join('') : '<p class="mute">personne</p>') + '</div>' +
      '<div class="panel"><h3>Partis avant la fin <span class="cnt1">' + partis.length + '</span></h3><p>' + (partis.length ? partis.map(p => esc(p.name) + ' <small class="mute">(' + fmtT(A(p.id).left) + ')</small>').join(', ') : '<span class="mute">personne</span>') + '</p></div>' +
      '<div class="panel"><h3>Présents</h3><p>' + names(people) + '</p></div></div>';
    if (s.rounds.length) {
      const cell = (r, id) => {
        for (const t of r.tables) {
          if (t.closed) continue;
          const q = t.seats, k = SEATS.find(x => q[x] === id);
          if (k) { const pt = q[{ N: 'S', S: 'N', E: 'O', O: 'E' }[k]]; return '<b>' + esc(nm(pt)) + '</b><small>table ' + t.n + '</small>'; }
          if ((t.extra || []).indexOf(id) >= 0) return '<span class="mute">remplacé</span>';
        }
        return (r.rest || []).indexOf(id) >= 0 ? '<span class="mute">repos</span>' : '<span class="mute">·</span>';
      };
      h += '<div class="panel"><h3>Qui a joué avec qui</h3><p class="mute">Le partenaire de chacun, période par période.</p><div class="tscroll"><table class="who"><thead><tr><th>Joueur</th>' + s.rounds.map(r => '<th>Période ' + r.n + '</th>').join('') + '</tr></thead><tbody>' +
        people.map(p => '<tr><td>' + esc(p.name) + '</td>' + s.rounds.map(r => '<td>' + cell(r, p.id) + '</td>').join('') + '</tr>').join('') + '</tbody></table></div></div>';
    }
    if (D.settings.prepared && s.rounds.length) {
      const kk = sessK(s), cnt = {};
      s.rounds.forEach(r => r.tables.forEach(t => { if (t.closed) return; t.boards.forEach(bn => { const dz = BR.designated(bn, kk); SEATS.forEach(x => { const id = t.seats[x]; cnt[id] = cnt[id] || { D: 0, M: 0, L: 0, F: 0 }; cnt[id][BR.roleOf(x, dz)]++; }); }); }));
      h += '<div class="panel"><h3>Rôles joués (donnes préparées)</h3><div class="tscroll"><table class="who"><thead><tr><th>Joueur</th><th>Déclarant</th><th>Mort</th><th>Entame</th><th>Défense</th></tr></thead><tbody>' +
        people.filter(p => cnt[p.id]).map(p => { const c = cnt[p.id]; const z = v => v ? v : '<b class="red">0</b>'; return '<tr><td>' + esc(p.name) + '</td><td>' + z(c.D) + '</td><td>' + z(c.M) + '</td><td>' + z(c.L) + '</td><td>' + z(c.F) + '</td></tr>'; }).join('') + '</tbody></table></div></div>';
    }
    h += '<div class="row noprint"><button class="btn" data-a="print">Imprimer le bilan</button><button class="btn" data-a="copybilan">Copier le résumé</button></div>';
    return h;
  }
  function bilanText() {
    const s = D.sessions.find(x => x.id === ui.bilanId) || cur();
    const A = id => s.att[id] || {};
    const people = D.roster.filter(p => A(p.id).arr || A(p.id).present);
    const ouiAbs = D.roster.filter(p => !p.archived && rsvpOf(s, p.id) === 'yes' && !A(p.id).arr).map(p => p.name);
    return 'Bridge Relax du ' + fmtDate(s.date) + ' : ' + people.length + ' présents, ' + s.rounds.length + ' périodes jouées.' + (ouiAbs.length ? ' Inscrits absents : ' + ouiAbs.join(', ') + '.' : '');
  }

  /* ---------- Lieux ---------- */
  const placeOf = s => (D.places.find(p => p.id === s.place) || D.places[0] || { text: '' });
  const placeLines = s => placeOf(s).text.split('\n').map(x => x.trim()).filter(Boolean);
  const placeName = s => placeLines(s)[0] || '';
  const mapsUrl = s => 'https://maps.google.com/?q=' + placeLines(s).join(', ').replace(/[#&?]/g, ' ').replace(/\s+/g, '+');
  function placeSelect(id, cur0) {
    return '<select ' + id + '>' + D.places.map(p => '<option value="' + p.id + '"' + (p.id === cur0 ? ' selected' : '') + '>' + esc(p.text.split('\n').map(x => x.trim()).filter(Boolean).join(', ')) + '</option>').join('') + '<option value="new">Autre lieu…</option></select>';
  }

  /* ---------- Messages ---------- */
  const hfm = t => String(t || '').replace(':', 'h').replace('h00', 'h');
  // « accueil à 15h30, jeu de 15h45 à 18h45 »
  function horaire(s) { const w = welcomeOf(s); return (w && w < s.start ? 'accueil à ' + hfm(w) + ', jeu de ' : 'de ') + hfm(s.start) + ' à ' + hfm(s.end); }
  function msgText(type) {
    if (type === 'affiche') return afficheText();
    const s = cur(), d = fmtDate(s.date), h1 = s.start.replace(':', 'h').replace('h00', 'h'), h2 = s.end.replace(':', 'h').replace('h00', 'h');
    const f = fmt(), prof = D.roster.find(p => p.teacher && !p.archived);
    const sign = D.settings.sign ? '\n' + D.settings.sign : '';
    const c = counts(s);
    const lieu = '\n\nLieu :\n' + placeLines(s).join('\n') + '\nItinéraire : ' + mapsUrl(s);
    if (type === 'relance') {
      // Message de groupe : on ne cite personne
      return 'Bonjour à tous,\n\nPetit rappel : Bridge Relax le ' + d + ', ' + horaire(s) + ', ' + placeName(s) + '.\nSi vous ne m\'avez pas encore répondu, un simple oui ou non me suffit, pour que je prépare les tables.\n\nMerci !' + sign;
    }
    if (type === 'veille') {
      const dd = daysUntil(s.date);
      return 'Bonjour à tous,\n\nRappel : Bridge Relax ' + (dd === 1 ? 'demain, ' : 'le ') + d + ', ' + horaire(s) + ', ' + placeName(s) + '.' + lieu + '\n\nNous sommes déjà ' + c.yes + ' inscrits. Merci d\'arriver ' + (welcomeOf(s) && welcomeOf(s) < s.start ? 'dès ' + hfm(welcomeOf(s)) : 'quelques minutes avant ' + h1) + ' pour que le jeu commence à l\'heure.\nUn empêchement ? Prévenez-moi, cela m\'aide à préparer les tables.\n\nÀ ' + (dd === 1 ? 'demain' : 'bientôt') + ' !' + sign;
    }
    return 'Bonjour à tous,\n\nProchain Bridge Relax le ' + d + ', ' + horaire(s) + '.' + lieu + '\n\n' + f.nRounds + ' périodes de ' + f.dur + ' minutes, avec un nouveau partenaire à chaque période.' + (D.settings.prepared ? ' Donnes préparées : chacun jouera des contrats, entamera, fera le mort et défendra.' : '') + (prof ? ' ' + prof.name + ' sera là pour répondre à vos questions.' : '') + ' Tous niveaux bienvenus.\n\nMerci de me répondre dès que possible, oui ou non, pour que je prépare les tables.\n\nÀ bientôt !' + sign;
  }
  /* ---------- L'affiche d'invitation (image jointe au message WhatsApp) ---------- */
  const FLY = 'bridge-relax-affiche';
  function flyer() { try { return localStorage.getItem(FLY) || window.BR_FLYER || ''; } catch (e) { return window.BR_FLYER || ''; } }
  function afficheText() {
    const s = cur(), sign = D.settings.sign ? '\n' + D.settings.sign : '';
    return 'Bonjour à tous,\n\nLe prochain entraînement Bridge Relax a lieu ' + fmtDate(s.date, { weekday: 'long', day: 'numeric', month: 'long' }) + ', ' + horaire(s) + '.\nToutes les infos sont sur l\'affiche ci-jointe.\n\nBonne journée' + sign;
  }
  function dataUrlFile(u, name) {
    const m = /^data:([^;]+);base64,(.*)$/.exec(u); if (!m) return null;
    const bin = atob(m[2]), a = new Uint8Array(bin.length);
    for (let i = 0; i < bin.length; i++) a[i] = bin.charCodeAt(i);
    return new File([a], name + (m[1] === 'image/png' ? '.png' : '.jpg'), { type: m[1] });
  }
  // Partage : image + texte (téléphone, tablette, et la plupart des ordinateurs) ; sinon téléchargement + WhatsApp avec le texte
  function shareAffiche(txt) {
    const t = txt || afficheText(), url = flyer(), f = url && dataUrlFile(url, 'Bridge Relax - invitation');
    try { navigator.clipboard && navigator.clipboard.writeText(t).catch(() => {}); } catch (e) { /* ignore */ }
    if (f && navigator.canShare && navigator.canShare({ files: [f] })) {
      navigator.share({ files: [f], text: t }).then(() => toast('Si le texte n\'apparaît pas sous l\'affiche dans WhatsApp, collez-le : il est déjà copié.')).catch(() => {});
      return;
    }
    if (f) { const a = document.createElement('a'); a.href = url; a.download = f.name; document.body.appendChild(a); a.click(); a.remove(); }
    window.open('https://wa.me/?text=' + encodeURIComponent(t), '_blank', 'noopener');
    toast(f ? 'L\'affiche est enregistrée dans vos téléchargements. Dans WhatsApp, joignez-la avec le trombone.' : 'Ajoutez d\'abord l\'affiche dans Réglages.', !f);
  }
  // Bouton WhatsApp : ouvre WhatsApp avec le message déjà écrit ; on choisit le groupe ou la personne, puis Envoyer
  const WA_ICO = '<svg class="waico" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3a9 9 0 0 0-7.8 13.5L3 21l4.6-1.2A9 9 0 1 0 12 3z" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/><path d="M8.5 9.5c.3 2.6 2.4 4.8 5 5.2l1.2-1.3 2 .9c-.3 1.2-1.3 1.9-2.6 1.7-3.2-.5-6-3.3-6.5-6.5-.2-1.3.5-2.3 1.7-2.6l.9 2z" fill="currentColor"/></svg>';
  function waBtn(type, label, extraCls) {
    return '<button class="btn wa' + (extraCls ? ' ' + extraCls : '') + '" data-a="pv" data-v="' + type + '">' + WA_ICO + label + '</button>';

  /* ---------- Grand écran ---------- */
  function salleTile(t, r) {
    const row = k => {
      const p = getP(t.seats[k]);
      return '<div class="trw' + (p && p.teacher ? ' prof' : '') + '"><span class="sl">' + k + '</span><span class="tn2">' + esc(p ? p.name : '?') + '</span></div>';
    };
    const et = r && r.relay && t.own ? '<div class="tet"><span>Étuis</span>' + t.own.map(n => '<i>' + n + '</i>').join('') + (t.solo ? '' : '<em>→ table ' + nextActive(r, t) + '</em>') + '</div>' : '';
    return '<div class="tile" style="--tc:' + tcol(t.n) + '"><div class="th"><b>' + t.n + '</b><span>table</span></div><div class="grp">' + row('N') + row('S') + '</div><div class="grp g2">' + row('E') + row('O') + '</div>' + et + '</div>';
  }
  /* ---------- Plan de la salle : tables en cercles concentriques ----------
     Cercle intérieur dans le sens des aiguilles d'une montre, cercle extérieur en sens inverse :
     chaque étui ne fait qu'un pas, y compris de la dernière table vers la table 1. */
  function roomN(s, r) {
    let m = 0;
    try { m = expected(s).tables || 0; } catch (e) { m = 0; }
    (s.rounds || []).forEach(x => x.tables.forEach(t => { if (!t.solo) m = Math.max(m, t.n); }));
    if (r) r.tables.forEach(t => { if (!t.solo) m = Math.max(m, t.n); });
    return m;
  }
  // Cercle intérieur fixé dès la 1re période (0 = un seul cercle) : les tables ne « bougent » pas en cours de séance
  function ringInner(s, r) {
    const r0 = (s.rounds || []).find(x => x.tables && x.tables.length) || r;
    let m0 = 0;
    if (r0) r0.tables.forEach(t => { if (!t.solo) m0 = Math.max(m0, t.n); });
    else { try { m0 = expected(s).tables || 0; } catch (e) { m0 = 0; } }
    return m0 <= 6 ? 0 : (m0 <= 12 ? 3 : 4);
  }
  function ringPos(m, inner) {
    const P = {};
    const n1 = inner ? Math.min(inner, m) : m, r1 = inner ? 0.42 : 0.85, r2 = 0.9, sI = 2 * Math.PI / Math.max(1, n1);
    for (let i = 0; i < n1; i++) { const a = -Math.PI / 2 + i * sI; P[i + 1] = { x: r1 * Math.cos(a), y: r1 * Math.sin(a), ring: 0 }; }
    if (m > n1) {
      const out = m - n1, sO = 2 * Math.PI / out, a0 = -Math.PI / 2 + (n1 - 1) * sI;
      for (let j = 0; j < out; j++) { const a = a0 - j * sO; P[n1 + 1 + j] = { x: r2 * Math.cos(a), y: r2 * Math.sin(a), ring: 1 }; }
    }
    return { P, inner: n1, m };
  }
  function ringText(s, r) {
    const m = roomN(s, r), inner = ringInner(s, r);
    if (m < 2) return '';
    const base = !inner || inner >= m ? 'Tables en un cercle, de 1 à ' + m + ' dans le sens des aiguilles d\'une montre.'
      : 'Cercle intérieur : tables 1 à ' + inner + ' (sens des aiguilles d\'une montre). Cercle extérieur : tables ' + (inner + 1) + ' à ' + m + ', dans l\'autre sens, en commençant derrière la table ' + inner + '.';
    return base + ' Besoin d\'une table en plus ? Placez-la entre la table ' + m + ' et la table 1 : elle prendra le numéro ' + (m + 1) + '. Une table qui se vide reste en place, les étuis la sautent.';
  }
  let svgSeq = 0;
  function planSvg(s, r, withBoards, wide) {
    const m = roomN(s, r);
    if (!m) return '';
    const L = ringPos(m, ringInner(s, r)), SX = wide ? 175 : 130, SY = 100, sz = (m <= 6 ? 30 : 25) * (wide ? 1.2 : 1), id = 'ah' + (++svgSeq);
    const pos = n => ({ x: L.P[n].x * SX, y: L.P[n].y * SY });
    const byN = {}; if (r) r.tables.forEach(t => { if (!t.solo) byN[t.n] = t; });
    const on = n => r ? !!(byN[n] && !byN[n].closed) : true;
    let arrows = '', boxes = '';
    const act = []; for (let n = 1; n <= m; n++) if (on(n)) act.push(n);
    if (act.length > 1) act.forEach((n, i) => {
      const to = act[(i + 1) % act.length], a = pos(n), b = pos(to);
      const dx = b.x - a.x, dy = b.y - a.y, d = Math.hypot(dx, dy) || 1, k = sz * 0.72;
      const s1 = { x: a.x + dx / d * k, y: a.y + dy / d * k }, e1 = { x: b.x - dx / d * k, y: b.y - dy / d * k };
      let path;
      if (L.P[n].ring === L.P[to].ring && act.length > 2) {
        const mx = (s1.x + e1.x) / 2, my = (s1.y + e1.y) / 2, ml = Math.hypot(mx, my) || 1, bulge = Math.min(14, d * 0.18);
        path = 'M' + s1.x.toFixed(1) + ' ' + s1.y.toFixed(1) + ' Q' + (mx + mx / ml * bulge).toFixed(1) + ' ' + (my + my / ml * bulge).toFixed(1) + ' ' + e1.x.toFixed(1) + ' ' + e1.y.toFixed(1);
      } else path = 'M' + s1.x.toFixed(1) + ' ' + s1.y.toFixed(1) + ' L' + e1.x.toFixed(1) + ' ' + e1.y.toFixed(1);
      arrows += '<path class="pa" d="' + path + '" marker-end="url(#' + id + ')"/>';
    });
    for (let n = 1; n <= m; n++) {
      const c = pos(n), live = on(n), t = byN[n];
      boxes += '<g class="ptab' + (live ? '' : ' off') + '" data-n="' + n + '">' +
        '<rect x="' + (c.x - sz / 2).toFixed(1) + '" y="' + (c.y - sz / 2).toFixed(1) + '" width="' + sz + '" height="' + sz + '" rx="' + (sz / 4) + '" style="fill:' + (live ? tcol(n) : 'none') + '"/>' +
        '<text x="' + c.x.toFixed(1) + '" y="' + (c.y + sz * 0.2).toFixed(1) + '" class="pnum" style="font-size:' + (sz * 0.6) + 'px">' + n + '</text>' +
        (withBoards && live && t && t.own ? '<text x="' + c.x.toFixed(1) + '" y="' + (c.y + sz / 2 + 8.5).toFixed(1) + '" class="pet">étuis ' + t.own.join(' · ') + '</text>' : '') + '</g>';
    }
    return '<svg class="plan" viewBox="' + (wide ? '-200 -104 400 220' : '-152 -104 304 220') + '" role="img" aria-label="Plan de la salle"><defs><marker id="' + id + '" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path class="pah" d="M0 0 L10 5 L0 10 z"/></marker></defs>' + arrows + boxes + '</svg>';
  }
  function soloNote(r) {
    const so = r ? r.tables.filter(t => t.solo && !t.closed) : [];
    return so.length ? '<div class="psolo">' + so.map(t => 'Table ' + t.n + ' : garde ses étuis' + (t.own ? ' (' + t.own.join(', ') + ')' : '')).join(' · ') + '</div>' : '';
  }
  function salleEtuis(r) {
    return '<div class="srule">Dès qu\'une donne est jouée, passez l\'étui à la table suivante, en suivant les flèches.</div>' +
      '<div class="splan">' + planSvg(C(), r, true, true) + '</div>' + soloNote(r);
  }
  function viewSalle() {
    const c = C();
    const r = BR.currentRound(c);
    const present = c.players.filter(p => p.present);
    const top = '<div class="stop"><div class="sl1"><img class="logo" src="' + LOGO + '" alt=""><div><b>' + (r ? 'Période ' + r.n : 'Bridge Relax') + '</b><span>' + (r ? plural(r.b, 'donne', 'donnes') : plural(present.length, 'joueur présent', 'joueurs présents')) + '</span></div></div><div class="scount" id="scount"></div><div class="sclock" id="sclock"></div></div>';
    let body;
    if (!r) {
      body = '<div class="swait"><div>Bienvenue</div><small>Installez-vous : les tables vont être annoncées ici.</small></div>';
    } else {
      const w = BR.waiting(c);
      const act = r.tables.filter(t => !t.closed);
      if (ui.salleView === 'etuis' && r.relay) {
        body = salleEtuis(r);
      } else if (ui.salleView === 'tables') {
        const n = act.length;
        const cols = n <= 2 ? n : n <= 4 ? 2 : n <= 6 ? 3 : n <= 8 ? 4 : 5;
        body = '<div class="sgrid" style="--cols:' + cols + '">' + act.map(t => salleTile(t, r)).join('') + '</div>';
        if (w.players.length) body += '<div class="srest">Sans table pour l\'instant : ' + w.players.map(p => esc(p.name)).join(', ') + '</div>';
      } else {
        const rows = [];
        act.forEach(t => SEATS.forEach(k => rows.push({ name: nm(t.seats[k]), t: t.n, seat: SN[k] })));
        w.players.forEach(p => rows.push({ name: p.name, t: null, seat: 'repos' }));
        rows.sort((a, b) => a.name.localeCompare(b.name, 'fr'));
        const cc = rows.length <= 16 ? 2 : rows.length <= 30 ? 3 : 4;
        body = '<div class="snames" style="--cc:' + cc + '">' + rows.map(x => '<div class="ni"><span class="nn">' + esc(x.name) + '</span><span class="nt' + (x.t ? '' : ' rest') + '">' + (x.t ? '<b style="background:' + tcol(x.t) + ';color:#fff">' + x.t + '</b>' : '') + '<small>' + x.seat + '</small></span></div>').join('') + '</div>';
      }
    }
    const ctl = '<div class="sctl noprint"><button class="' + (ui.salleView === 'noms' ? 'on' : '') + '" data-a="salleview" data-v="noms">Par nom</button><button class="' + (ui.salleView === 'tables' ? 'on' : '') + '" data-a="salleview" data-v="tables">Par table</button><button class="' + (ui.salleView === 'etuis' ? 'on' : '') + '" data-a="salleview" data-v="etuis">Étuis</button><button class="' + (ui.auto ? 'on' : '') + '" data-a="salleauto">Alterner</button><button data-a="fullscreen">Plein écran</button><button data-a="salleclose">' + (ui.second ? 'Fermer la fenêtre' : 'Fermer') + '</button></div>';
    return '<div class="salle' + (ui.salleView === 'noms' ? '' : ' fit') + '">' + top + body + ctl + '</div>';
  }

  /* ---------- Impression ---------- */
  // Application lancée depuis l'écran d'accueil de l'iPhone/iPad : l'impression y est bloquée par Apple
  function isStandalone() {
    try { return !!(navigator.standalone || (window.matchMedia && window.matchMedia('(display-mode: standalone)').matches)); } catch (e) { return false; }
  }
  function printJob(cls, html, title) {
    if (isStandalone()) {
      const data = btoa(unescape(encodeURIComponent(JSON.stringify({ cls, html, title }))));
      const url = location.href.split('#')[0] + '#print=' + data;
      const w = window.open(url, '_blank');
      if (!w) { const a = document.createElement('a'); a.href = url; a.target = '_blank'; a.rel = 'noopener'; document.body.appendChild(a); a.click(); a.remove(); }
      toast('La page d\'impression s\'ouvre dans le navigateur. Touchez « Imprimer ».');
      return;
    }
    if (cls) document.body.classList.add(cls);
    setTimeout(() => { window.print(); setTimeout(() => { if (cls) document.body.classList.remove(cls); }, 800); }, 50);
  }

  /* ---------- Actions ---------- */
  function twoTap(key, id) {
    if (ui[key] !== id) { ui[key] = id; render(); clearTimeout(ui[key + 'T']); ui[key + 'T'] = setTimeout(() => { ui[key] = null; render(); }, 4000); return false; }
    ui[key] = null; return true;
  }
  function copyText(txt) {
    const done = () => toast('Copié. Collez-le dans WhatsApp ou dans un e-mail.') || render();
    if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(txt).then(done, () => prompt('Copiez ce texte :', txt));
    else prompt('Copiez ce texte :', txt);
  }
  const actions = {
    tab(el) { ui.tab = el.dataset.v; ui.filter = ''; ui.pf = 'all'; render(); window.scrollTo(0, 0); },
    pmode(el) { ui.pmode = el.dataset.v; ui.pf = 'all'; render(); },
    pf(el) { ui.pf = el.dataset.v; render(); },
    add() {
      const p = addPlayer($('#pname').value);
      if (!p) return;
      const m = pmode();
      if (m === 'insc') cur().rsvp[p.id] = 'yes';
      if (m === 'accueil') arrive(p);
      ui.filter = ''; commit(); const i = $('#pname'); if (i) i.focus();
    },
    bulk() {
      const b = bulkSplit();
      b.add.forEach(x => { const p = addPlayer(x.name); if (p && x.level) p.level = x.level; });
      b.dup.forEach(x => { const p = D.roster.find(q => q.name.toLowerCase() === x.name.toLowerCase()); if (p && x.level && !p.level) p.level = x.level; });
      commit(); toast(plural(b.add.length, 'nom ajouté', 'noms ajoutés') + ' à la liste.');
    },
    addone() {
      const i = $('#pnew'), v = i ? i.value.trim() : ''; if (!v) { toast('Tapez d\'abord le prénom et le nom.', true); if (i) i.focus(); return; }
      const ex = D.roster.find(x => !x.archived && x.name.toLowerCase() === v.toLowerCase());
      if (ex) { toast(ex.name + ' est déjà dans la liste.', true); return; }
      const p = addPlayer(v); commit(); toast(p.name + ' ajouté(e) à la liste.');
      const j = $('#pnew'); if (j) j.focus();
    },
    bmeth(el) { const t = $('#bulk'), keep = t ? t.value : ''; ui.bm = el.dataset.v; render(); const n = $('#bulk'); if (n && keep) { n.value = keep; bulkPreview(); } },
    bulkclear() { const t = $('#bulk'); if (t) { t.value = ''; bulkPreview(); t.focus(); } },
    rsvp(el) {
      const s = cur(), id = +el.dataset.id, v = el.dataset.v;
      if (rsvpOf(s, id) === v) return;
      s.rsvp[id] = v;
      if (pmode() === 'accueil') {
        ui.moved = id; clearTimeout(ui.movedT); ui.movedT = setTimeout(() => { ui.moved = null; const r = $('.acc tr.moved'); if (r) r.classList.remove('moved'); }, 2500);
        toast(nm(id) + ' : ' + { yes: 'réponse oui', none: 'pas répondu', no: 'réponse non' }[v] + '.');
      }
      commit();
      if (pmode() === 'accueil') { const r = $('.acc tr.moved'); if (r && r.scrollIntoView) r.scrollIntoView({ block: 'center', behavior: 'smooth' }); }
    },
    arrive(el) { const p = getP(+el.dataset.id); if (p) { arrive(p); commit(); } },
    depart(el) { const s = cur(), id = +el.dataset.id; s.att[id] = Object.assign({}, s.att[id], { present: false, left: Date.now() }); onLeave(id); commit(); },
    toastclose() { ui.toast = null; render(); },
    copynone() {
      const s = cur();
      const l = D.roster.filter(p => !p.archived && !p.teacher && rsvpOf(s, p.id) === 'none').map(p => p.name).sort((a, b) => a.localeCompare(b, 'fr'));
      if (!l.length) { alert('Tout le monde a répondu.'); return; }
      copyText(l.join(', '));
    },
    copywait() {
      const s = cur();
      const l = D.roster.filter(p => !p.archived && rsvpOf(s, p.id) === 'yes' && !isPresent(p.id) && !att(p.id).left).map(p => p.name).sort((a, b) => a.localeCompare(b, 'fr'));
      if (l.length) copyText(l.join(', '));
    },
    allnone() { if (confirm('Remettre toutes les réponses à « pas répondu » ?')) { cur().rsvp = {}; commit(); } },
    lvtoggle() { ui.showLv = !ui.showLv; render(); },
    level(el) { const p = getP(+el.dataset.id); if (!p) return; const v = +el.dataset.v; p.level = p.level === v ? undefined : v; commit(); },
    teach(el) { const p = getP(+el.dataset.id); if (!p) return; const v = !p.teacher; D.roster.forEach(x => { x.teacher = false; }); p.teacher = v; commit(); },
    del(el) {
      const id = +el.dataset.id, p = getP(id); if (!p) return;
      if (!twoTap('delId', id)) return;
      if (playedAny(id)) p.archived = true;
      else { D.roster = D.roster.filter(x => x.id !== id); D.sessions.forEach(s => { delete s.rsvp[id]; delete s.att[id]; }); }
      commit();
    },
    affiche() { shareAffiche(); },
    pv(el) { ui.preview = { type: el.dataset.v, text: msgText(el.dataset.v), edit: false }; render(); },
    pvedit() { const t = $('#pvt'); if (t) ui.preview.text = t.value; ui.preview.edit = !ui.preview.edit; render(); if (ui.preview.edit) { const z = $('#pvt'); if (z) z.focus(); } },
    pvclose() { ui.preview = null; render(); },
    pvsend() { const t = $('#pvt'); if (t) ui.preview.text = t.value; shareAffiche(ui.preview.text); ui.preview = null; setTimeout(render, 300); },
    pvdone() { setTimeout(() => { ui.preview = null; render(); }, 400); },
    flyreset() { try { localStorage.removeItem(FLY); } catch (e) { /* ignore */ } render(); },
    newtoggle() { setTimeout(() => { const d = $('details.newsess'); ui.newOpen = !!(d && d.open); }, 0); },
    msadd() {
      const d = $('#ms-date') && $('#ms-date').value; if (!d) { toast('Choisissez d\'abord une date.', true); return; }
      ui.multi = Array.from(new Set([...(ui.multi || []), d])).sort(); render();
    },
    msweek() {
      const from = $('#ns-date').value || todayIso(), to = $('#ms-until') && $('#ms-until').value;
      if (!to || to < from) { toast('Choisissez une date de fin après le ' + fmtDate(from) + '.', true); return; }
      const L = new Set(ui.multi || []); const d = dateObj(from);
      for (let i = 0; i < 60 && isoDay(d) <= to; i++) { L.add(isoDay(d)); d.setDate(d.getDate() + 7); }
      ui.multi = Array.from(L).sort(); render();
    },
    msrm(el) { ui.multi = (ui.multi || []).filter(d => d !== el.dataset.d); ui.multiOpen = true; render(); },
    msclear() { ui.multi = []; ui.multiOpen = true; render(); },
    mscreate() {
      const have = new Set(D.sessions.map(s => s.date)), L = (ui.multi || []).filter(d => !have.has(d));
      if (!L.length) return;
      const st = $('#ns-start').value || D.settings.start, en = $('#ns-end').value || D.settings.end, du = $('#ns-dur').value;
      const pv = $('#ns-place') && $('#ns-place').value;
      const wl = $('#ns-welcome') && $('#ns-welcome').value;
      L.forEach(d => { const s = newSession(D, d, st, en); s.dur = du; if (wl) s.welcome = wl; if (pv && pv !== 'new') s.place = +pv; });
      ui.multi = []; ui.multiOpen = false; commit(); toast(plural(L.length, 'séance créée', 'séances créées') + '.');
    },
    snew() {
      const d = $('#ns-date').value || todayIso();
      const s = newSession(D, d, $('#ns-start').value || D.settings.start, $('#ns-end').value || D.settings.end);
      s.dur = $('#ns-dur').value;
      if ($('#ns-welcome') && $('#ns-welcome').value) s.welcome = $('#ns-welcome').value;
      const pv = $('#ns-place') && $('#ns-place').value; if (pv && pv !== 'new') s.place = +pv;
      D.cur = s.id; ui.pmode = null; commit();
    },
    sopen(el) { D.cur = +el.dataset.id; ui.pmode = null; commit(); },
    sdel(el) { ui.delS = +el.dataset.id; render(); const z = $('.sdelask'); if (z && z.scrollIntoView) z.scrollIntoView({ block: 'center' }); },
    sdelno() { ui.delS = null; render(); },
    sdelok(el) {
      const id = +el.dataset.id;
      if (D.sessions.length < 2) return;
      const s = D.sessions.find(x => x.id === id);
      D.sessions = D.sessions.filter(x => x.id !== id);
      if (D.cur === id) D.cur = D.sessions[0].id;
      ui.delS = null;
      toast('Séance du ' + fmtDate(s.date) + ' supprimée.');
      commit();
    },
    next() {
      unlockAudio();
      const s = cur();
      const b = $('#bsel') ? +$('#bsel').value : BR.autoBoards(C(), Date.now());
      const c = C(), now = Date.now();
      const cr = BR.currentRound(c);
      if (cr && roundEnd(cr) - now > 5 * 60000 && !confirm('La période ' + cr.n + ' n\'est pas finie (encore ' + fmtDur((roundEnd(cr) - now) / 60000) + ').\n\nLancer quand même la période ' + (s.rounds.length + 1) + ' ? Les tables seront refaites.')) return;
      const slot = BR.roundSlot(c, now);
      // Numéros des étuis : les mêmes à chaque période si l'on rebat tout, sinon de nouveaux
      let base = 1;
      const fresh = D.settings.prepared || D.settings.reshuffle === false;
      const lastR = s.rounds[s.rounds.length - 1];
      if (fresh && lastR) base = 1 + Math.max(0, ...s.rounds.map(x => x.relay ? x.relay.last : 0), ...s.rounds.flatMap(x => x.tables.flatMap(t => t.boards || [])));
      const r = BR.planRound(c, { boards: b, now, base });
      if (r.error) { alert(r.error); return; }
      r.endAt = now + Math.round(slot) * 60000;
      if (r.relay && r.relay.last > (D.settings.stock || 36)) r.warnings.push('Cette période utilise les étuis ' + r.relay.base + ' à ' + r.relay.last + ' : c\'est plus que les ' + D.settings.stock + ' étuis indiqués dans les réglages.');
      s.rounds.push(r); ui.fresh = true; ui.tab = 'tour'; commit(); window.scrollTo(0, 0);
    },
    opentable() { if (!BR.openExtraTable(C())) alert('Impossible d\'ouvrir une table.'); ui.fresh = false; commit(); },
    replace(el) {
      const sel = $('#rep-' + el.dataset.t + '-' + el.dataset.s);
      if (sel) { BR.replaceSeat(C(), +el.dataset.t, el.dataset.s, +sel.value); commit(); }
    },
    dissolve(el) { if (confirm('Fermer cette table ?')) { BR.dissolveTable(C(), +el.dataset.t); commit(); } },
    print() { printJob('', $('main').innerHTML, 'Bridge Relax'); },
    openfromcover(el) { D.cur = +el.dataset.id; save(); ui.cover = false; ui.pmode = null; ui.tab = D.settings.simple !== false ? 'today' : (daysUntil(cur().date) === 0 ? 'joueurs' : 'seances'); render(); window.scrollTo(0, 0); },
    newfromcover() { ui.cover = false; ui.tab = 'seances'; render(); window.scrollTo(0, 0); },
    enter() { ui.cover = false; if (D.settings.simple !== false) ui.tab = 'today'; render(); window.scrollTo(0, 0); },
    gotoresp() { ui.tab = 'joueurs'; ui.pmode = 'insc'; ui.pf = 'all'; render(); window.scrollTo(0, 0); },
    gotoinvite() { ui.tab = 'joueurs'; ui.pmode = 'insc'; ui.msg = 'invit'; render(); const p = $('.msgp'); if (p && p.scrollIntoView) p.scrollIntoView({ block: 'start' }); },
    gotolist() { ui.tab = 'joueurs'; ui.pmode = 'liste'; render(); window.scrollTo(0, 0); },
    gotoarr() { ui.tab = 'joueurs'; ui.pmode = 'accueil'; ui.pf = 'all'; render(); window.scrollTo(0, 0); },
    gosheets() { ui.tab = 'etuis'; render(); actions.printsheets(); },
    unarrive(el) { const s = cur(), id = +el.dataset.id; delete s.att[id]; toast('Arrivée de ' + nm(id) + ' annulée.'); commit(); },
    goavoid() { ui.cover = false; ui.tab = 'joueurs'; ui.pmode = 'liste'; ui.avoidOpen = true; render(); const a = $('.avoid'); if (a && a.scrollIntoView) a.scrollIntoView({ block: 'center' }); },
    help() { ui.cover = false; ui.tab = 'aide'; render(); window.scrollTo(0, 0); },
    cover() { ui.cover = true; render(); window.scrollTo(0, 0); },
    msg(el) { ui.msg = el.dataset.v; render(); const p = $('.msgp'); if (p && p.scrollIntoView) p.scrollIntoView({ block: 'start' }); },
    msgclose() { ui.msg = null; render(); },
    copymsg() { copyText($('#msgt').value); },
    avoidadd() {
      const a = +$('#av1').value, b = +$('#av2').value;
      if (!a || !b || a === b) { alert('Choisissez deux personnes différentes.'); return; }
      D.avoid = D.avoid || [];
      if (!D.avoid.some(x => (x[0] === a && x[1] === b) || (x[0] === b && x[1] === a))) D.avoid.push([a, b]);
      ui.avoidOpen = true; commit();
    },
    avoiddel(el) { D.avoid.splice(+el.dataset.i, 1); ui.avoidOpen = true; commit(); },
    bilan(el) { ui.cover = false; ui.bilanId = +el.dataset.id; ui.tab = 'bilan'; render(); window.scrollTo(0, 0); },
    copybilan() { copyText(bilanText()); },
    placeadd() {
      const t = ($('#newplace').value || '').split('\n').map(x => x.trim()).filter(Boolean).join('\n');
      if (!t) { alert('Écrivez le nom et l\'adresse du lieu.'); return; }
      const id = 1 + Math.max(0, ...D.places.map(p => p.id));
      D.places.push({ id, text: t });
      if (ui.placeFor) { const s = D.sessions.find(x => x.id === ui.placeFor); if (s) s.place = id; ui.placeFor = null; ui.tab = 'seances'; }
      toast('Lieu ajouté : ' + t.split('\n')[0] + '.');
      commit();
    },
    placedel(el) {
      const id = +el.dataset.id;
      if (!confirm('Retirer ce lieu de la liste ?')) return;
      D.places = D.places.filter(p => p.id !== id);
      ensurePlaces(D); commit();
    },
    testsound() { const was = D.settings.sound; D.settings.sound = true; chime(1); D.settings.sound = was; },
    printacc() {
      const keep = ui.pf; ui.pf = 'all'; ui.filter = ''; render();
      const html = ($('.ptitle') ? $('.ptitle').outerHTML : '') + $('#plist').outerHTML;
      printJob('pacc', html, 'Tableau d\'accueil');
      if (!isStandalone()) setTimeout(() => { ui.pf = keep; render(); }, 900); else { ui.pf = keep; render(); }
    },
    printprep() { printJob('pprep', $('.prepsheet').outerHTML, 'Fiche de préparation des étuis'); },
    printsheets() { printJob('psheets', $('.sheets').outerHTML, 'Feuilles d\'étui'); },
    salle() { ui.tab = 'salle'; ui.tick = 0; render(); },
    salle2() {
      const w = window.open(location.href.split('#')[0] + '#salle', 'bridge-relax-projecteur', 'popup=yes,width=1280,height=760');
      if (!w) { alert('La fenêtre a été bloquée par le navigateur. Autorisez les fenêtres pour ce site, ou utilisez « Afficher sur grand écran ».'); return; }
      toast('Fenêtre du projecteur ouverte : faites-la glisser sur l\'écran du projecteur, puis touchez « Plein écran ».');
    },
    salleclose() {
      if (ui.second) { try { window.close(); } catch (e) { /* ignore */ } setTimeout(() => { ui.second = false; ui.tab = 'tour'; render(); }, 200); return; } if (document.fullscreenElement && document.exitFullscreen) document.exitFullscreen(); ui.tab = 'tour'; render(); },
    salleview(el) { ui.salleView = el.dataset.v; ui.auto = false; render(); },
    salleauto() { ui.auto = !ui.auto; render(); },
    fullscreen() {
      const el = document.documentElement;
      if (document.fullscreenElement) { document.exitFullscreen(); return; }
      if (el.requestFullscreen) el.requestFullscreen(); else if (el.webkitRequestFullscreen) el.webkitRequestFullscreen();
    },
    export() {
      const blob = new Blob([JSON.stringify(D)], { type: 'application/json' });
      const a = document.createElement('a'); a.href = URL.createObjectURL(blob);
      a.download = 'bridge-relax-' + todayIso() + '.json';
      document.body.appendChild(a); a.click(); setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 500);
    },
    reset() { if (confirm('Tout effacer, y compris la liste des joueurs et toutes les séances ?') && confirm('Vraiment tout effacer ?')) { D = defaults(); commit(); } }
  };

  document.addEventListener('click', e => {
    const el = e.target.closest('[data-a]');
    if (!el) return;
    const f = actions[el.dataset.a];
    if (f) f(el);
  });
  document.addEventListener('keydown', e => {
    if (e.key === 'Enter' && e.target.id === 'pname' && pmode() !== 'liste') { e.preventDefault(); actions.add(); }
    if (e.key === 'Enter' && e.target.id === 'pnew') { e.preventDefault(); actions.addone(); }
  });
  document.addEventListener('input', e => {
    const el = e.target;
    if (el.id === 'pname') { ui.filter = el.value; const l = $('#plist'); if (l) l.innerHTML = playersListHtml(); }
    else if (el.dataset.f === 'note') { D.notes[el.dataset.b] = el.value; save(); }
    else if (el.dataset.f === 'pc') { D.prep = D.prep || {}; D.prep[el.dataset.b] = el.value; save(); }
    else if (el.dataset.f === 'plink') { D.settings.prepLink = el.value.trim(); save(); }
    else if (el.id === 'bulk') bulkPreview();
    else if (el.id === 'pvt') { ui.preview.text = el.value; const a = $('#pvsend'); if (a && a.tagName === 'A') a.href = 'https://wa.me/?text=' + encodeURIComponent(el.value); }
    else if (el.dataset.f === 'sign' || el.id === 'msgt') {
      if (el.dataset.f === 'sign') { D.settings.sign = el.value; save(); const t = $('#msgt'); if (t) t.value = msgText(ui.msg); }
      const t = $('#msgt').value, s = cur();
      const wa = $('#wa'), ml = $('#ml');
      if (wa) wa.href = 'https://wa.me/?text=' + encodeURIComponent(t);
      if (ml) ml.href = 'mailto:?subject=' + encodeURIComponent('Bridge Relax du ' + fmtDate(s.date)) + '&body=' + encodeURIComponent(t);
    }
  });
  document.addEventListener('change', e => {
    const el = e.target;
    if (el.dataset.f === 'bulkfile' && el.files && el.files[0]) {
      const f = el.files[0];
      if (/\.(xlsx?|docx?|pdf|numbers|pages)$/i.test(f.name)) { toast('Ce type de fichier ne s\'ouvre pas ici : ouvrez-le, copiez les noms et collez-les dans le cadre.', true); el.value = ''; return; }
      const put = t => { const ta = $('#bulk'); if (ta) { ta.value = t; bulkPreview(); } };
      const rd = new FileReader();
      rd.onload = () => { const t = String(rd.result || '');
        if (t.indexOf('\uFFFD') >= 0) { const r2 = new FileReader(); r2.onload = () => put(String(r2.result || '')); r2.readAsText(f, 'windows-1252'); } else put(t); };
      rd.readAsText(f, 'utf-8'); el.value = ''; return;
    }
    if (el.dataset.f === 'flyer' && el.files && el.files[0]) {
      const img = new Image(), rd = new FileReader();
      rd.onload = () => { img.onload = () => {
        const W = Math.min(1200, img.naturalWidth), cv = document.createElement('canvas');
        cv.width = W; cv.height = Math.round(img.naturalHeight * W / img.naturalWidth);
        const g = cv.getContext('2d'); g.fillStyle = '#fff'; g.fillRect(0, 0, cv.width, cv.height); g.drawImage(img, 0, 0, cv.width, cv.height);
        try { localStorage.setItem(FLY, cv.toDataURL('image/jpeg', 0.82)); toast('Nouvelle affiche enregistrée.'); } catch (x) { toast('Image trop lourde. Essayez une capture d\'écran de l\'affiche.', true); }
        render();
      }; img.src = rd.result; };
      rd.readAsDataURL(el.files[0]); return;
    }
    if (el.dataset.f === 'format') { D.settings.format = el.value; commit(); }
    else if (el.dataset.f === 'splace' || el.dataset.f === 'nsplace') {
      if (el.value === 'new') { ui.placeFor = el.dataset.f === 'splace' ? cur().id : null; ui.tab = 'reglages'; render(); const t = $('#newplace'); if (t) { if (t.scrollIntoView) t.scrollIntoView({ block: 'center' }); t.focus(); } toast('Écrivez le nouveau lieu, puis touchez « Ajouter ce lieu ».'); return; }
      if (el.dataset.f === 'splace') { cur().place = +el.value; commit(); }
    }
    else if (el.dataset.f === 'defplace') { D.settings.defPlace = +el.value; commit(); }
    else if (el.dataset.f === 'big') { D.settings.big = el.checked; commit(); }
    else if (el.dataset.f === 'simple') { D.settings.simple = el.checked; ui.tab = el.checked ? 'plus' : 'reglages'; commit(); }
    else if (el.dataset.f === 'levelMatch') { D.settings.levelMatch = el.checked; commit(); }
    else if (el.dataset.f === 'reshuffle') { D.settings.reshuffle = el.checked; commit(); }
    else if (el.dataset.f === 'perTable') { D.settings.perTable = +el.value; commit(); }
    else if (el.dataset.f === 'sound') { D.settings.sound = el.checked; save(); unlockAudio(); }
    else if (el.dataset.f === 'printto') { ui.printTo = Math.max(1, +el.value || 1); render(); }
    else if (el.dataset.f === 'avoidsel') { /* choix en attente */ }
    else if (el.dataset.f === 'mode') { D.settings.prepared = el.value === 'prep'; commit(); }
    else if (el.dataset.f === 'sess') {
      if (el.value) {
        const s = cur(); s[el.dataset.k] = el.value;
        if (el.dataset.k === 'start' && welcomeOf(s) && welcomeOf(s) > s.start) toast('Attention : l\'accueil (' + hh(welcomeOf(s)) + ') est après le début du jeu.', true);
        commit();
      }
    }
    else if (el.dataset.f === 'set') {
      const k = el.dataset.k;
      D.settings[k] = (k === 'start' || k === 'end' || k === 'welcome') ? el.value : Math.max(0, +el.value || 0);
      if (k === 'setSize') D.settings.setSize = Math.max(2, Math.min(6, D.settings.setSize));
      if (k === 'bankSets') D.settings.bankSets = Math.max(3, Math.min(30, D.settings.bankSets));
      save();
    } else if (el.id === 'imp' && el.files[0]) {
      const rd = new FileReader();
      rd.onload = () => { try { const m = migrate(JSON.parse(rd.result)); if (m) { D = m; commit(); } else alert('Fichier non reconnu.'); } catch (x) { alert('Fichier illisible.'); } };
      rd.readAsText(el.files[0]);
    }
  });

  if (location.hash === '#salle') { ui.second = true; ui.cover = false; ui.tab = 'salle'; ui.salleView = 'tables'; }
  render();
  setInterval(updateClock, 5000);
  document.addEventListener('visibilitychange', () => { if (!document.hidden) { keepAwake(); updateClock(); } });
  document.addEventListener('click', () => { unlockAudio(); keepAwake(); }, { capture: true });
  setInterval(() => {
    if (ui.tab !== 'salle') return;
    updateClock();
    ui.tick++;
    if (ui.auto && ui.tick % 15 === 0 && BR.currentRound(C())) { { const order = BR.currentRound(C()).relay ? ['noms', 'tables', 'etuis'] : ['noms', 'tables']; ui.salleView = order[(order.indexOf(ui.salleView) + 1) % order.length]; } render(); }
  }, 1000);
  window.__BR_UI = { get state() { return D; }, ui, render, actions, C };
})();

</script>
