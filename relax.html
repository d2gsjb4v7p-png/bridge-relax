<title>Bridge Relax</title>
<style>
:root{
  --bg:#f4f1ea;--card:#ffffff;--ink:#1d2a24;--mute:#6b7771;--line:#ddd7c8;
  --accent:#1f6b4f;--accent-ink:#ffffff;--warn:#b4561b;--warn-bg:#fdeede;--bad:#b3261e;--bad-bg:#fbe4e1;
  --ok-bg:#e3f1ea;--chip:#ece8dc;--red:#c0392b;
}
@media (prefers-color-scheme:dark){
  :root{--bg:#121714;--card:#1c2420;--ink:#e8efe9;--mute:#98a59d;--line:#2d3832;
    --accent:#49b384;--accent-ink:#06150e;--warn:#f0a867;--warn-bg:#35261a;--bad:#ff8b80;--bad-bg:#3a1f1c;
    --ok-bg:#1d3329;--chip:#26302b;--red:#ff7b6b}
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.4 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif}
body{padding-bottom:84px}
header{position:sticky;top:0;z-index:5;background:var(--accent);color:var(--accent-ink);padding:10px 14px;display:flex;justify-content:space-between;align-items:center;gap:8px}
header h1{margin:0;font-size:18px;letter-spacing:.2px}
header .clock{font-variant-numeric:tabular-nums;font-size:13px;text-align:right;line-height:1.25}
main{max-width:1100px;margin:0 auto;padding:12px}
nav{position:fixed;bottom:0;left:0;right:0;z-index:6;display:flex;background:var(--card);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom)}
nav button{flex:1;border:0;background:none;color:var(--mute);padding:10px 2px 9px;font-size:12px;display:flex;flex-direction:column;align-items:center;gap:2px}
nav button .ic{font-size:20px;line-height:1}
nav button.on{color:var(--accent);font-weight:700}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px;margin:0 0 12px}
h2{margin:2px 0 8px;font-size:17px}
h3{margin:0 0 6px;font-size:15px}
.mute{color:var(--mute);font-size:14px}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.grow{flex:1}
button,select,input,textarea{font:inherit;color:inherit}
.btn{border:1px solid var(--line);background:var(--chip);border-radius:10px;padding:9px 13px;font-weight:600;cursor:pointer}
.btn.pri{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.big{padding:14px 18px;font-size:17px;border-radius:12px}
.btn.sm{padding:5px 9px;font-size:13px;border-radius:8px}
.btn.danger{color:var(--bad)}
.btn:disabled{opacity:.45}
input[type=text],input[type=time],input[type=number],select,textarea{background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:9px 10px;width:100%}
input[type=checkbox]{width:20px;height:20px}
label.f{display:block;font-size:13px;color:var(--mute);margin:8px 0 3px}
.notice{border-radius:12px;padding:10px 12px;margin:0 0 12px;font-size:14px}
.notice.warn{background:var(--warn-bg);color:var(--warn)}
.notice.bad{background:var(--bad-bg);color:var(--bad)}
.notice.ok{background:var(--ok-bg)}
.prow{display:flex;align-items:center;gap:8px;padding:7px 0;border-bottom:1px solid var(--line)}
.prow:last-child{border:0}
.prow .nm{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.prow.off .nm{color:var(--mute);text-decoration:line-through}
.pill{display:inline-block;border-radius:999px;padding:2px 9px;font-size:12px;background:var(--chip);color:var(--mute)}
.pill.on{background:var(--ok-bg);color:var(--accent);font-weight:700}
.pill.warn{background:var(--warn-bg);color:var(--warn)}
.tables{display:grid;grid-template-columns:repeat(auto-fill,minmax(290px,1fr));gap:12px}
.tcard{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:10px}
.tcard.closed{opacity:.55}
.thead{display:flex;justify-content:space-between;align-items:baseline;gap:6px;margin-bottom:6px}
.thead b{font-size:17px}
.cross{display:grid;grid-template-columns:1fr 1fr 1fr;grid-template-rows:auto auto auto;gap:4px;text-align:center;margin:4px 0 8px}
.seat{background:var(--chip);border-radius:9px;padding:5px 4px;font-size:14px;min-height:46px;display:flex;flex-direction:column;justify-content:center;word-break:break-word}
.seat small{color:var(--mute);font-size:11px;display:block}
.seat.gone{background:var(--bad-bg);color:var(--bad)}
.seat.prof{outline:2px solid var(--accent)}
.s-N{grid-column:2;grid-row:1}.s-O{grid-column:1;grid-row:2}.s-E{grid-column:3;grid-row:2}.s-S{grid-column:2;grid-row:3}
.mid{grid-column:2;grid-row:2;align-self:center;font-size:12px;color:var(--mute)}
.brow{display:flex;align-items:center;gap:6px;padding:6px 0;border-top:1px solid var(--line);font-size:14px}
.brow .bn{font-weight:700;min-width:34px}
.brow .info{flex:1;min-width:0}
.brow .info small{color:var(--mute)}
.vul{font-size:11px;border-radius:5px;padding:1px 5px;background:var(--chip);color:var(--mute)}
.vul.v{background:var(--bad-bg);color:var(--bad)}
.rank td,.rank th{padding:6px 6px;text-align:left;border-bottom:1px solid var(--line)}
table{border-collapse:collapse;width:100%}
td.num,th.num{text-align:right;font-variant-numeric:tabular-nums}
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:20;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--card);width:100%;max-width:520px;border-radius:18px 18px 0 0;padding:16px;max-height:92vh;overflow:auto}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.big-score{font-size:28px;font-weight:800;text-align:center;margin:8px 0}
details{margin:0 0 10px}
details summary{cursor:pointer;font-weight:600;padding:6px 0}
.setcard{border:1px solid var(--line);border-radius:12px;padding:8px;margin:0 0 8px;background:var(--card)}
.setcard .brow:first-of-type{border-top:0}
@media print{
  header,nav,.noprint{display:none!important}
  body{background:#fff;color:#000;padding:0}
  .card,.tcard,.setcard{border:1px solid #999;break-inside:avoid}
}
@media (min-width:760px){
  body{padding-bottom:0}
  nav{position:sticky;top:46px;bottom:auto;border-top:0;border-bottom:1px solid var(--line);justify-content:center}
  nav button{flex:none;flex-direction:row;gap:6px;padding:10px 18px;font-size:14px}
}

</style>

<script>
/* Bridge Relax — moteur d'organisation (rotation individuelle, donnes, scores) */
(function (root) {
  'use strict';

  const SEATS = ['N', 'E', 'S', 'O'];
  const SEAT_NAME = { N: 'Nord', E: 'Est', S: 'Sud', O: 'Ouest' };
  const VUL16 = ['-', 'NS', 'EW', 'ALL', 'NS', 'EW', 'ALL', '-', 'EW', 'ALL', '-', 'NS', 'ALL', '-', 'NS', 'EW'];

  // Poids de l'optimisation
  const W_P = 400;   // même partenaire qu'avant
  const W_O = 40;    // même adversaire qu'avant
  const W_R = 3000;  // rejouer une série déjà jouée
  const W_S = 10;    // même siège qu'avant
  const W_D = 30;    // donner la main (déclarant prévu) à qui a le moins déclaré

  /* ---------- Donnes ---------- */
  function boardInfo(n) {
    const dealer = SEATS[(n - 1) % 4];
    const v = VUL16[(n - 1) % 16];
    return { n, dealer, vul: v, vulNS: v === 'NS' || v === 'ALL', vulEW: v === 'EW' || v === 'ALL' };
  }
  function setOf(n, K) { return Math.floor((n - 1) / K) + 1; }
  function designated(n, K) { return SEATS[((n - 1) % K + setOf(n, K)) % 4]; }
  function boardsOfSet(set, K, count) {
    const c = count == null ? K : count;
    return Array.from({ length: c }, (_, i) => (set - 1) * K + i + 1);
  }

  /* ---------- Marque duplicate ---------- */
  function scoreContract(c, vulDecl) {
    const level = c.level, den = c.den, dbl = c.dbl || 0, res = c.res;
    const V = !!vulDecl;
    const per = (den === 'C' || den === 'D') ? 20 : 30;
    if (res >= 0) {
      let trick = den === 'SA' ? 40 + 30 * (level - 1) : per * level;
      trick *= dbl === 0 ? 1 : dbl === 1 ? 2 : 4;
      let s = trick + (trick >= 100 ? (V ? 500 : 300) : 50);
      if (level === 6) s += V ? 750 : 500;
      if (level === 7) s += V ? 1500 : 1000;
      if (dbl === 1) s += 50;
      if (dbl === 2) s += 100;
      if (res > 0) s += dbl === 0 ? res * per : res * (V ? 200 : 100) * (dbl === 2 ? 2 : 1);
      return s;
    }
    const down = -res;
    if (dbl === 0) return -down * (V ? 100 : 50);
    let pen = 0;
    for (let i = 1; i <= down; i++) pen += V ? (i === 1 ? 200 : 300) : (i === 1 ? 100 : i <= 3 ? 200 : 300);
    if (dbl === 2) pen *= 2;
    return -pen;
  }
  // Score vu du côté Nord-Sud
  function nsScore(r, boardNo) {
    if (r.pass || !r.level) return 0;
    const b = boardInfo(boardNo);
    const declNS = r.decl === 'N' || r.decl === 'S';
    const s = scoreContract(r, declNS ? b.vulNS : b.vulEW);
    return declNS ? s : -s;
  }

  /* ---------- Utilitaires ---------- */
  function mulberry32(a) {
    return function () {
      a |= 0; a = (a + 0x6D2B79F5) | 0;
      let t = Math.imul(a ^ (a >>> 15), 1 | a);
      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }
  function shuffle(a, rng) {
    for (let i = a.length - 1; i > 0; i--) {
      const j = Math.floor(rng() * (i + 1));
      const t = a[i]; a[i] = a[j]; a[j] = t;
    }
    return a;
  }
  const pk = (a, b) => (a < b ? a + '-' + b : b + '-' + a);
  function inc(o, k) { o[k] = (o[k] || 0) + 1; }

  /* ---------- Historique ---------- */
  function history(state) {
    const h = { partner: {}, opp: {}, seat: {}, seen: {}, rests: {}, lastRest: {}, played: {}, decl: {}, setUse: {}, setLast: {}, maxSet: 0 };
    state.rounds.forEach((r, ri) => {
      (r.rest || []).forEach(id => { inc(h.rests, id); h.lastRest[id] = ri; });
      r.tables.forEach(t => {
        const s = t.seats;
        inc(h.partner, pk(s.N, s.S)); inc(h.partner, pk(s.E, s.O));
        [[s.N, s.E], [s.N, s.O], [s.S, s.E], [s.S, s.O]].forEach(x => inc(h.opp, pk(x[0], x[1])));
        SEATS.forEach(k => {
          const id = s[k];
          if (!h.seat[id]) h.seat[id] = {};
          inc(h.seat[id], k);
        });
        const ids = [s.N, s.E, s.S, s.O].concat(t.extra || []);
        ids.forEach(id => {
          if (!h.seen[id]) h.seen[id] = new Set();
          h.seen[id].add(t.set);
        });
        [s.N, s.E, s.S, s.O].forEach(id => inc(h.played, id));
        inc(h.setUse, t.set);
        h.setLast[t.set] = { round: ri, table: t.n };
        if (t.set > h.maxSet) h.maxSet = t.set;
        Object.keys(t.results || {}).forEach(bn => {
          const res = t.results[bn];
          if (res && !res.pass && res.level && res.players) inc(h.decl, res.players[res.decl]);
        });
      });
    });
    return h;
  }

  /* ---------- Coûts ---------- */
  function tableCost(h, q, set) {
    let c = 0;
    const p1 = h.partner[pk(q[0], q[1])] || 0, p2 = h.partner[pk(q[2], q[3])] || 0;
    c += W_P * (p1 * p1 + p2 * p2);
    for (let i = 0; i < 2; i++) for (let j = 2; j < 4; j++) c += W_O * (h.opp[pk(q[i], q[j])] || 0);
    for (let i = 0; i < 4; i++) { const s = h.seen[q[i]]; if (s && s.has(set)) c += W_R; }
    return c;
  }

  function anneal(ids, slots, h, rng, iters, restarts) {
    const T = slots.length;
    let best = null, bc = Infinity;
    for (let r = 0; r < restarts; r++) {
      const cur = shuffle(ids.slice(), rng);
      const tc = [];
      for (let t = 0; t < T; t++) tc.push(tableCost(h, cur.slice(4 * t, 4 * t + 4), slots[t]));
      let total = tc.reduce((a, b) => a + b, 0);
      const t0 = 300, t1 = 0.5;
      for (let it = 0; it < iters; it++) {
        const temp = t0 * Math.pow(t1 / t0, it / iters);
        const i = Math.floor(rng() * cur.length), j = Math.floor(rng() * cur.length);
        if (i === j) continue;
        const ti = (i / 4) | 0, tj = (j / 4) | 0;
        const a = cur[i], b = cur[j];
        cur[i] = b; cur[j] = a;
        const ci = tableCost(h, cur.slice(4 * ti, 4 * ti + 4), slots[ti]);
        const cj = tj === ti ? ci : tableCost(h, cur.slice(4 * tj, 4 * tj + 4), slots[tj]);
        const delta = (ci - tc[ti]) + (tj === ti ? 0 : (cj - tc[tj]));
        if (delta <= 0 || rng() < Math.exp(-delta / temp)) {
          tc[ti] = ci; if (tj !== ti) tc[tj] = cj; total += delta;
        } else { cur[i] = a; cur[j] = b; }
      }
      if (total < bc) { bc = total; best = cur.slice(); }
    }
    return { arr: best, cost: bc };
  }

  // Place 4 joueurs (paires [0,1] et [2,3]) sur les sièges
  function orient(four, boardNums, h, K, rng) {
    const bonus = { N: 0, E: 0, S: 0, O: 0 };
    boardNums.forEach(n => bonus[designated(n, K)]++);
    const pairs = [[four[0], four[1]], [four[2], four[3]]];
    let best = null, bc = Infinity;
    for (let ns = 0; ns < 2; ns++) for (let f1 = 0; f1 < 2; f1++) for (let f2 = 0; f2 < 2; f2++) {
      const pn = pairs[ns], pe = pairs[1 - ns];
      const seats = {
        N: f1 ? pn[1] : pn[0], S: f1 ? pn[0] : pn[1],
        E: f2 ? pe[1] : pe[0], O: f2 ? pe[0] : pe[1]
      };
      let c = 0;
      SEATS.forEach(k => {
        const id = seats[k];
        const sc = (h.seat[id] && h.seat[id][k]) || 0;
        c += W_S * sc * sc;
        c -= W_D * bonus[k] / (1 + (h.decl[id] || 0));
      });
      c += rng() * 0.01;
      if (c < bc) { bc = c; best = seats; }
    }
    return best;
  }

  /* ---------- Plan du jour ---------- */
  function suggestPlan(P, hasTeacher) {
    if (hasTeacher && P % 4 === 3) return { tables: (P + 1) / 4, rest: 0, teacherPlays: true };
    const tables = Math.floor(P / 4);
    return { tables, rest: P - 4 * tables, teacherPlays: false };
  }

  function timeToMs(hhmm, ref) {
    const d = new Date(ref);
    const p = String(hhmm || '00:00').split(':');
    d.setHours(+p[0] || 0, +p[1] || 0, 0, 0);
    return d.getTime();
  }
  // Nombre de donnes conseillé pour le prochain tour, pour finir pile à l'heure
  function autoBoards(state, nowMs) {
    const s = state.settings;
    const end = timeToMs(s.end, nowMs);
    const start = timeToMs(s.start, nowMs);
    const from = Math.max(nowMs, start);
    const remaining = (end - from) / 60000;
    if (remaining <= 0) return 1;
    const roundsLeft = Math.max(1, Math.round(remaining / s.roundMin));
    const per = remaining / roundsLeft - (s.changeMin || 0);
    const b = Math.floor(per / s.minPerBoard + 0.25);
    return Math.max(1, Math.min(s.setSize, b));
  }

  /* ---------- Génération d'un tour ---------- */
  function planRound(state, opt) {
    opt = opt || {};
    const rng = opt.rng || Math.random;
    const st = state.settings, K = st.setSize;
    const h = history(state);
    const present = state.players.filter(p => p.present);
    const teacher = present.find(p => p.teacher) || null;
    const pool = present.filter(p => !p.teacher);
    const P = pool.length;
    const plan = suggestPlan(P, !!teacher);
    const T = plan.tables;
    if (T < 1) return { error: 'Il faut au moins 4 joueurs présents (ou 3 avec le professeur).' };
    const b = Math.max(1, Math.min(K, opt.boards || autoBoards(state, opt.now || Date.now())));

    // Qui se repose ? (ceux qui se sont le moins reposés ; jamais un joueur qui n'a pas encore joué)
    const cand = pool.map(p => ({ p, never: (h.played[p.id] || 0) === 0 ? 1 : 0, r: h.rests[p.id] || 0, l: h.lastRest[p.id] == null ? -1 : h.lastRest[p.id], x: rng() }));
    cand.sort((a, c) => a.never - c.never || a.r - c.r || a.l - c.l || a.x - c.x);
    const rest = cand.slice(0, plan.rest).map(c => c.p);
    const restIds = new Set(rest.map(p => p.id));
    const players = pool.filter(p => !restIds.has(p.id));
    if (plan.teacherPlays) players.push(teacher);

    // Séries de donnes de ce tour
    const warnings = [];
    const poolSize = Math.min(st.bankSets, Math.max(T + 2, h.maxSet));
    const order = [];
    for (let i = 1; i <= poolSize; i++) order.push(i);
    order.sort((a, c) => (h.setUse[a] || 0) - (h.setUse[c] || 0) || a - c);
    const chosen = [];
    for (let i = 0; i < T; i++) chosen.push(order[i % order.length]);
    if (T > poolSize) warnings.push('Pas assez de séries de donnes (' + poolSize + ') pour ' + T + ' tables : augmentez le nombre de séries dans les réglages.');

    // Chaque série reste, si possible, à la même table
    const slots = new Array(T).fill(null);
    const todo = [];
    chosen.forEach(s => {
      const last = h.setLast[s];
      if (last && last.table <= T && slots[last.table - 1] == null) slots[last.table - 1] = s; else todo.push(s);
    });
    todo.sort((a, c) => a - c);
    for (let t = 0; t < T; t++) if (slots[t] == null) slots[t] = todo.shift();

    // Optimisation des tables
    const ids = players.map(p => p.id);
    const res = anneal(ids, slots, h, rng, 2500 * T + 4000, 4);
    const tables = [];
    const stats = { repeatPartners: 0, repeatOpp: 0, replays: 0 };
    for (let t = 0; t < T; t++) {
      const q = res.arr.slice(4 * t, 4 * t + 4);
      const set = slots[t];
      const boards = boardsOfSet(set, K, b);
      const seats = orient(q, boards, h, K, rng);
      if ((h.partner[pk(seats.N, seats.S)] || 0) > 0) stats.repeatPartners++;
      if ((h.partner[pk(seats.E, seats.O)] || 0) > 0) stats.repeatPartners++;
      [[seats.N, seats.E], [seats.N, seats.O], [seats.S, seats.E], [seats.S, seats.O]].forEach(x => { if (h.opp[pk(x[0], x[1])]) stats.repeatOpp++; });
      q.forEach(id => { if (h.seen[id] && h.seen[id].has(set)) stats.replays++; });
      tables.push({ n: t + 1, set, boards, seats, closed: false, results: {}, extra: [] });
    }
    return {
      n: state.rounds.length + 1, startedAt: opt.now || Date.now(), b,
      tables, rest: rest.map(p => p.id), teacherPlays: plan.teacherPlays,
      warnings, stats
    };
  }

  /* ---------- Pendant un tour ---------- */
  function currentRound(state) { return state.rounds.length ? state.rounds[state.rounds.length - 1] : null; }

  function waiting(state) {
    const r = currentRound(state);
    const seated = new Set();
    if (r) r.tables.forEach(t => { if (!t.closed) SEATS.forEach(k => seated.add(t.seats[k])); });
    const present = state.players.filter(p => p.present && !seated.has(p.id));
    return {
      players: present.filter(p => !p.teacher),
      teacherFree: present.some(p => p.teacher),
      teacher: present.find(p => p.teacher) || null
    };
  }

  function replaceSeat(state, tableN, seat, newId) {
    const r = currentRound(state);
    const t = r && r.tables.find(x => x.n === tableN);
    if (!t) return false;
    const old = t.seats[seat];
    t.extra = t.extra || [];
    if (t.extra.indexOf(old) < 0) t.extra.push(old);
    t.seats[seat] = newId;
    r.rest = (r.rest || []).filter(id => id !== newId);
    return true;
  }

  function dissolveTable(state, tableN) {
    const r = currentRound(state);
    const t = r && r.tables.find(x => x.n === tableN);
    if (t) t.closed = true;
  }

  function canOpenTable(state) {
    const w = waiting(state);
    const n = w.players.length;
    return n >= 4 || (n === 3 && w.teacherFree);
  }

  function openExtraTable(state, opt) {
    opt = opt || {};
    const rng = opt.rng || Math.random;
    const r = currentRound(state);
    if (!r || !canOpenTable(state)) return null;
    const st = state.settings, K = st.setSize;
    const h = history(state);
    const w = waiting(state);
    let four = w.players.slice().sort((a, c) => (h.rests[a.id] || 0) - (h.rests[c.id] || 0)).slice(0, 4);
    if (four.length === 3) four.push(w.teacher);
    const ids = four.map(p => p.id);
    // série : pas déjà jouée par ces joueurs, la moins utilisée, pas déjà sur une table de ce tour
    const used = new Set(r.tables.filter(t => !t.closed).map(t => t.set));
    const nTables = r.tables.length + 1;
    const poolSize = Math.min(st.bankSets, Math.max(nTables + 2, h.maxSet));
    let bestSet = null, bs = Infinity;
    for (let s = 1; s <= poolSize; s++) {
      if (used.has(s)) continue;
      let c = (h.setUse[s] || 0);
      ids.forEach(id => { if (h.seen[id] && h.seen[id].has(s)) c += 1000; });
      if (c < bs) { bs = c; bestSet = s; }
    }
    if (bestSet == null) return null;
    const boards = boardsOfSet(bestSet, K, r.b);
    // meilleur appariement parmi les 3 possibles
    const perms = [[0, 1, 2, 3], [0, 2, 1, 3], [0, 3, 1, 2]];
    let bp = null, bpc = Infinity;
    perms.forEach(p => {
      const q = p.map(i => ids[i]);
      const c = tableCost(h, q, bestSet);
      if (c < bpc) { bpc = c; bp = q; }
    });
    const seats = orient(bp, boards, h, K, rng);
    const n = Math.max.apply(null, r.tables.map(t => t.n)) + 1;
    const table = { n, set: bestSet, boards, seats, closed: false, results: {}, extra: [], late: true };
    r.tables.push(table);
    r.rest = (r.rest || []).filter(id => ids.indexOf(id) < 0);
    return table;
  }

  /* ---------- Scores ---------- */
  function computeScores(state) {
    const byBoard = {};
    state.rounds.forEach((r, ri) => {
      r.tables.forEach(t => {
        Object.keys(t.results || {}).forEach(bn => {
          const x = t.results[bn];
          if (!x || !x.players) return;
          (byBoard[bn] = byBoard[bn] || []).push({ round: r.n, table: t.n, r: x, ns: nsScore(x, +bn) });
        });
      });
    });
    const acc = {};
    const add = (id, pct) => { const a = acc[id] || (acc[id] = { sum: 0, n: 0 }); a.sum += pct; a.n++; };
    Object.keys(byBoard).forEach(bn => {
      const list = byBoard[bn];
      const n = list.length;
      list.forEach(x => {
        if (n < 2) { x.pct = null; return; }
        let mp = 0;
        list.forEach(o => { if (o !== x) mp += x.ns > o.ns ? 1 : x.ns === o.ns ? 0.5 : 0; });
        x.pct = mp / (n - 1) * 100;
        add(x.r.players.N, x.pct); add(x.r.players.S, x.pct);
        add(x.r.players.E, 100 - x.pct); add(x.r.players.O, 100 - x.pct);
      });
    });
    const h = history(state);
    const players = state.players.map(p => {
      const a = acc[p.id];
      return { id: p.id, name: p.name, teacher: !!p.teacher, avg: a ? a.sum / a.n : null, boards: a ? a.n : 0, declared: h.decl[p.id] || 0, rounds: h.played[p.id] || 0 };
    });
    return { players, byBoard };
  }

  const BR = {
    SEATS, SEAT_NAME, boardInfo, setOf, designated, boardsOfSet,
    scoreContract, nsScore, mulberry32, history, suggestPlan, autoBoards, timeToMs,
    planRound, currentRound, waiting, replaceSeat, dissolveTable, canOpenTable, openExtraTable, computeScores
  };
  if (typeof module !== 'undefined' && module.exports) module.exports = BR;
  else root.BR = BR;
})(typeof window !== 'undefined' ? window : globalThis);

</script>
<script>
/* Bridge Relax — interface */
(function () {
  'use strict';
  const LS = 'bridge-relax-v1';
  const SEATS = BR.SEATS, SN = BR.SEAT_NAME;
  const DEN = { C: '♣', D: '♦', H: '♥', S: '♠', SA: 'SA' };

  function defaults() {
    return { v: 1, nextId: 1, settings: { start: '15:00', end: '18:30', roundMin: 30, minPerBoard: 9, setSize: 4, bankSets: 12, changeMin: 2 }, players: [], rounds: [], notes: {} };
  }
  function load() {
    try {
      const j = JSON.parse(localStorage.getItem(LS));
      if (j && j.v === 1) { const d = defaults(); return Object.assign(d, j, { settings: Object.assign(d.settings, j.settings) }); }
    } catch (e) { /* ignore */ }
    return defaults();
  }
  let S = load();
  const ui = { tab: 'tour', score: null, filter: '' };
  function save() { try { localStorage.setItem(LS, JSON.stringify(S)); } catch (e) { /* ignore */ } }
  function commit() { save(); render(); }

  const $ = s => document.querySelector(s);
  const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  const getP = id => S.players.find(p => p.id === id);
  const nm = id => { const p = getP(id); return p ? p.name : '?'; };
  const pad = n => String(n).padStart(2, '0');
  const fmtT = ms => { const d = new Date(ms); return pad(d.getHours()) + ':' + pad(d.getMinutes()); };
  const fmtDur = min => { min = Math.max(0, Math.round(min)); return min >= 60 ? Math.floor(min / 60) + ' h ' + pad(min % 60) : min + ' min'; };
  const plural = (n, a, b) => n + ' ' + (n > 1 ? b : a);
  const K = () => S.settings.setSize;

  /* ---------- En-tête ---------- */
  function updateClock() {
    const now = Date.now();
    const end = BR.timeToMs(S.settings.end, now);
    const left = (end - now) / 60000;
    const el = $('#hclock');
    if (el) el.innerHTML = fmtT(now) + '<br>' + (left > 0 ? 'reste ' + fmtDur(left) : 'heure de fin dépassée');
    const rc = $('#rcount');
    const r = BR.currentRound(S);
    if (rc && r) {
      const endR = r.startedAt + r.b * S.settings.minPerBoard * 60000;
      const m = (endR - now) / 60000;
      rc.textContent = m > 0 ? 'fin prévue ' + fmtT(endR) + ' (dans ' + fmtDur(m) + ')' : 'fin prévue ' + fmtT(endR) + ' — temps écoulé, on passe au tour suivant dès que possible';
    }
  }

  /* ---------- Rendu ---------- */
  function render() {
    const tabs = [['joueurs', '👥', 'Joueurs'], ['tour', '🃏', 'Tour'], ['scores', '🏆', 'Scores'], ['donnes', '🗂️', 'Donnes'], ['reglages', '⚙️', 'Réglages']];
    document.body.innerHTML =
      '<header><h1>♠ Bridge Relax</h1><div class="clock" id="hclock"></div></header>' +
      '<nav>' + tabs.map(t => '<button data-a="tab" data-v="' + t[0] + '" class="' + (ui.tab === t[0] ? 'on' : '') + '"><span class="ic">' + t[1] + '</span>' + t[2] + '</button>').join('') + '</nav>' +
      '<main>' + ({ joueurs: viewPlayers, tour: viewRound, scores: viewScores, donnes: viewBoards, reglages: viewSettings }[ui.tab] || viewRound)() + '</main>' +
      (ui.score ? scoreSheet() : '');
    updateClock();
  }

  /* ---------- Joueurs ---------- */
  function playersListHtml() {
    const f = ui.filter.trim().toLowerCase();
    const list = S.players.slice().sort((a, b) => a.name.localeCompare(b.name, 'fr')).filter(p => !f || p.name.toLowerCase().includes(f));
    if (!list.length) return '<p class="mute">' + (S.players.length ? 'Aucun nom ne correspond — appuyez sur « Ajouter » pour créer ce joueur.' : 'Ajoutez les joueurs au fur et à mesure de leur arrivée.') + '</p>';
    return list.map(p =>
      '<div class="prow ' + (p.present ? '' : 'off') + '">' +
      '<span class="nm">' + esc(p.name) + (p.teacher ? ' <span class="pill on">prof</span>' : '') + (p.present && p.arrivedAt ? ' <span class="pill">' + fmtT(p.arrivedAt) + '</span>' : '') + '</span>' +
      '<button class="btn sm" data-a="teach" data-id="' + p.id + '" title="Professeur">' + (p.teacher ? '★' : '☆') + '</button>' +
      '<button class="btn sm ' + (p.present ? 'pri' : '') + '" data-a="pres" data-id="' + p.id + '">' + (p.present ? 'Présent' : 'Absent') + '</button>' +
      '<button class="btn sm danger" data-a="del" data-id="' + p.id + '">✕</button></div>').join('');
  }
  function planSummary() {
    const present = S.players.filter(p => p.present);
    const teacher = present.find(p => p.teacher);
    const n = present.filter(p => !p.teacher).length;
    const plan = BR.suggestPlan(n, !!teacher);
    let txt = '<b>' + plural(present.length, 'présent', 'présents') + '</b>' + (teacher ? ' (dont le professeur)' : '') + ' — ';
    if (plan.tables < 1) return txt + 'pas encore assez pour une table.';
    txt += '<b>' + plural(plan.tables, 'table', 'tables') + '</b>';
    if (plan.teacherPlays) txt += ', le professeur joue';
    if (plan.rest) {
      txt += ', ' + plural(plan.rest, 'joueur au repos', 'joueurs au repos');
      const need = teacher ? 3 - plan.rest : 4 - plan.rest;
      if (need > 0) txt += '<br><span class="mute">Il manque ' + plural(need, 'joueur', 'joueurs') + ' pour une table de plus.</span>';
    }
    return txt;
  }
  function viewPlayers() {
    return '<div class="card"><div id="psum">' + planSummary() + '</div></div>' +
      '<div class="card"><div class="row"><input type="text" id="pname" class="grow" placeholder="Nom (taper pour chercher ou ajouter)" autocomplete="off" value="' + esc(ui.filter) + '"><button class="btn pri" data-a="add">Ajouter</button></div>' +
      '<div class="row" style="margin-top:8px"><button class="btn sm" data-a="allpres">Tout le monde présent</button><button class="btn sm" data-a="nonepres">Tout le monde absent</button></div>' +
      '<details><summary>Coller une liste de noms</summary><textarea id="bulk" rows="5" placeholder="Un nom par ligne"></textarea><button class="btn" data-a="bulk" style="margin-top:6px">Importer la liste</button></details></div>' +
      '<div class="card" id="plist">' + playersListHtml() + '</div>' +
      '<p class="mute">★ = professeur : il comble une table quand il manque un joueur, et n\'entre pas dans le classement. Les joueurs enregistrés sont conservés d\'une séance à l\'autre : il suffit de cocher les présents.</p>';
  }
  function addPlayer(name, present) {
    name = name.trim();
    if (!name) return null;
    const p = { id: S.nextId++, name, teacher: false, present: present !== false, arrivedAt: Date.now() };
    S.players.push(p);
    return p;
  }

  /* ---------- Tour ---------- */
  function viewRound() {
    const r = BR.currentRound(S);
    const now = Date.now();
    const auto = BR.autoBoards(S, now);
    let h = '';
    const nextN = S.rounds.length + 1;
    const opts = []; for (let i = 1; i <= K(); i++) opts.push('<option value="' + i + '"' + (i === auto ? ' selected' : '') + '>' + i + ' donne' + (i > 1 ? 's' : '') + (i === auto ? ' (conseillé)' : '') + '</option>');
    h += '<div class="card"><div id="psum">' + planSummary() + '</div>' +
      '<div class="row" style="margin-top:10px"><select id="bsel" style="width:auto">' + opts.join('') + '</select>' +
      '<button class="btn pri big grow" data-a="next">' + (r ? '▶ Lancer le tour ' + nextN : '▶ Lancer le tour 1') + '</button></div>' +
      (r ? '<div class="mute" style="margin-top:6px">Le nouveau tour tient compte des arrivées et départs enregistrés dans l\'onglet Joueurs.</div>' : '') + '</div>';
    if (!r) return h + '<p class="mute">Cochez les présents dans l\'onglet Joueurs, puis lancez le premier tour.</p>';

    h += '<div class="card"><h2>Tour ' + r.n + ' · ' + plural(r.b, 'donne', 'donnes') + (r.b < K() ? ' + ' + (K() - r.b) + ' bonus' : '') + '</h2>' +
      '<div class="mute">Début ' + fmtT(r.startedAt) + ' · <span id="rcount"></span></div>' +
      (r.stats ? '<div class="mute">Partenaires déjà rencontrés : ' + r.stats.repeatPartners + ' · adversaires déjà rencontrés : ' + r.stats.repeatOpp + (r.stats.replays ? ' · <b style="color:var(--bad)">séries rejouées : ' + r.stats.replays + '</b>' : '') + '</div>' : '') + '</div>';
    (r.warnings || []).forEach(w => { h += '<div class="notice bad">' + esc(w) + '</div>'; });

    // en attente
    const w = BR.waiting(S);
    const rest = w.players;
    if (rest.length || w.teacherFree) {
      h += '<div class="notice ' + (BR.canOpenTable(S) ? 'ok' : 'warn') + '"><b>' + (rest.length ? plural(rest.length, 'joueur sans table', 'joueurs sans table') : 'Professeur disponible') + '</b>' +
        (rest.length ? ' : ' + rest.map(p => esc(p.name)).join(', ') : '') + (rest.length && w.teacherFree ? ' · le professeur est libre' : '') +
        (BR.canOpenTable(S) ? '<div style="margin-top:6px"><button class="btn pri" data-a="opentable">Ouvrir une table avec eux</button></div>' : '<div class="mute" style="margin-top:4px">Ils jouent au prochain tour, ou remplacent quelqu\'un qui part.</div>') + '</div>';
    }

    // tables
    h += '<div class="tables">' + r.tables.map(t => tableCard(r, t, w)).join('') + '</div>';

    // annonce
    const rows = [];
    r.tables.filter(t => !t.closed).forEach(t => SEATS.forEach(k => rows.push({ name: nm(t.seats[k]), txt: 'Table ' + t.n + ' · ' + SN[k] })));
    w.players.forEach(p => rows.push({ name: p.name, txt: 'sans table (repos / arrivée)' }));
    rows.sort((a, b) => a.name.localeCompare(b.name, 'fr'));
    const prev = S.rounds.length > 1 ? S.rounds[S.rounds.length - 2] : null;
    let moves = '';
    if (prev) {
      const where = {}; prev.tables.forEach(t => { where[t.set] = t.n; });
      const mv = r.tables.filter(t => !t.closed && where[t.set] !== t.n).map(t => 'Série ' + t.set + (where[t.set] ? ' : table ' + where[t.set] + ' → table ' + t.n : ' : nouvelle, à poser table ' + t.n));
      moves = mv.length ? '<h3 style="margin-top:12px">Donnes à déplacer</h3><div>' + mv.join('<br>') + '</div>' : '<div class="mute" style="margin-top:10px">Les séries de donnes restent à leur table : seuls les joueurs bougent.</div>';
    } else moves = '<div class="mute" style="margin-top:10px">Tour 1 : posez la série indiquée sur chaque table.</div>';
    h += '<div class="card"><details open><summary>Qui va où ? (annonce)</summary><div style="columns:2 220px">' + rows.map(x => '<div>' + esc(x.name) + ' → <b>' + esc(x.txt) + '</b></div>').join('') + '</div>' + moves + '<button class="btn sm noprint" style="margin-top:8px" data-a="print">Imprimer</button></details></div>';
    return h;
  }

  function resultText(x) {
    if (x.pass) return 'Passe général';
    const rs = x.res === 0 ? '=' : x.res > 0 ? '+' + x.res : '−' + (-x.res);
    return x.level + DEN[x.den] + (x.dbl === 1 ? 'X' : x.dbl === 2 ? 'XX' : '') + ' ' + x.decl + ' ' + rs;
  }

  function tableCard(r, t, w) {
    const cands = w.players.concat(w.teacher ? [w.teacher] : []);
    let h = '<div class="tcard' + (t.closed ? ' closed' : '') + '"><div class="thead"><b>Table ' + t.n + '</b><span class="mute">Série ' + t.set + (t.late ? ' · ajoutée' : '') + (t.closed ? ' · fermée' : '') + '</span></div>';
    h += '<div class="cross">';
    SEATS.forEach(k => {
      const p = getP(t.seats[k]);
      const gone = p && !p.present;
      h += '<div class="seat s-' + k + (gone ? ' gone' : '') + (p && p.teacher ? ' prof' : '') + '"><small>' + SN[k] + (p && p.teacher ? ' · prof' : '') + '</small>' + esc(p ? p.name : '?') + (gone ? ' (parti)' : '') + '</div>';
    });
    h += '<div class="mid">Table</div></div>';
    if (!t.closed) {
      SEATS.forEach(k => {
        const p = getP(t.seats[k]);
        if (p && !p.present) {
          h += '<div class="notice bad"><b>' + esc(p.name) + '</b> est parti (' + SN[k] + '). ' +
            (cands.length ? 'Remplaçant : <div class="row" style="margin-top:4px"><select id="rep-' + t.n + '-' + k + '" class="grow">' + cands.map(c => '<option value="' + c.id + '">' + esc(c.name) + (c.teacher ? ' (prof)' : '') + '</option>').join('') + '</select><button class="btn sm" data-a="replace" data-t="' + t.n + '" data-s="' + k + '">OK</button></div>' : 'Personne pour le remplacer.') +
            '</div>';
        }
      });
      const gone = SEATS.some(k => { const p = getP(t.seats[k]); return p && !p.present; });
      if (gone && !cands.length) h += '<button class="btn sm danger" data-a="dissolve" data-t="' + t.n + '">Fermer cette table (les joueurs restants attendent)</button>';
    }
    t.boards.forEach(bn => {
      const b = BR.boardInfo(bn), des = BR.designated(bn, K()), x = t.results[bn];
      const vul = b.vul === '-' ? 'Personne' : b.vul === 'ALL' ? 'Tous' : b.vul === 'NS' ? 'NS' : 'EO';
      h += '<div class="brow"><span class="bn">' + bn + '</span><span class="info">' +
        '<small>Donneur ' + SN[b.dealer] + ' · </small><span class="vul ' + (b.vul !== '-' ? 'v' : '') + '">Vul ' + vul + '</span><br>' +
        (x ? '<b>' + esc(resultText(x)) + '</b> <small>(NS ' + (BR.nsScore(x, bn) > 0 ? '+' : '') + BR.nsScore(x, bn) + ')</small>'
          : '<small>Main prévue : ' + SN[des] + ' — ' + esc(nm(t.seats[des])) + '</small>') +
        '</span><button class="btn sm noprint" data-a="score" data-t="' + t.n + '" data-b="' + bn + '">' + (x ? 'Modifier' : 'Score') + '</button></div>';
    });
    const bonus = BR.boardsOfSet(t.set, K()).filter(n => t.boards.indexOf(n) < 0);
    if (bonus.length) {
      h += '<div class="brow"><span class="info"><small>Donne tampon si le tour est fini avant les autres : ' + bonus.join(', ') + '</small></span>' +
        bonus.map(bn => '<button class="btn sm noprint" data-a="score" data-t="' + t.n + '" data-b="' + bn + '">' + (t.results[bn] ? '✓ ' : '') + bn + '</button>').join('') + '</div>';
    }
    return h + '</div>';
  }

  /* ---------- Saisie d'un score ---------- */
  function openScore(tn, bn) {
    const r = BR.currentRound(S);
    const t = r.tables.find(x => x.n === tn);
    const ex = t.results[bn];
    ui.score = { t: tn, b: bn, d: ex ? { pass: !!ex.pass, level: ex.level || 4, den: ex.den || 'S', dbl: ex.dbl || 0, decl: ex.decl || 'N', res: ex.res || 0 } : { pass: false, level: 4, den: 'S', dbl: 0, decl: BR.designated(bn, K()), res: 0 }, has: !!ex };
    render();
  }
  function scoreSheet() {
    const sc = ui.score, d = sc.d;
    const r = BR.currentRound(S);
    const t = r.tables.find(x => x.n === sc.t);
    const b = BR.boardInfo(sc.b);
    const lv = []; for (let i = 1; i <= 7; i++) lv.push('<option value="' + i + '"' + (i === d.level ? ' selected' : '') + '>' + i + '</option>');
    const dn = ['C', 'D', 'H', 'S', 'SA'].map(x => '<option value="' + x + '"' + (x === d.den ? ' selected' : '') + '>' + DEN[x] + '</option>').join('');
    const db = [[0, '—'], [1, 'Contre (X)'], [2, 'Surcontre (XX)']].map(x => '<option value="' + x[0] + '"' + (x[0] === d.dbl ? ' selected' : '') + '>' + x[1] + '</option>').join('');
    const de = SEATS.map(k => '<option value="' + k + '"' + (k === d.decl ? ' selected' : '') + '>' + SN[k] + ' — ' + esc(nm(t.seats[k])) + '</option>').join('');
    const rs = [];
    for (let v = -(d.level + 6); v <= 7 - d.level; v++) rs.push('<option value="' + v + '"' + (v === d.res ? ' selected' : '') + '>' + (v === 0 ? 'Fait juste (=)' : v > 0 ? 'Fait +' + v : 'Chute de ' + (-v)) + '</option>');
    if (d.res < -(d.level + 6) || d.res > 7 - d.level) d.res = 0;
    const val = BR.nsScore(Object.assign({}, d), sc.b);
    return '<div class="overlay" data-a="scoreclose"><div class="sheet" data-stop="1"><h2>Table ' + sc.t + ' · donne ' + sc.b + '</h2>' +
      '<div class="mute">Donneur ' + SN[b.dealer] + ' · Vulnérabilité ' + (b.vul === '-' ? 'personne' : b.vul === 'ALL' ? 'tous' : b.vul === 'NS' ? 'NS' : 'EO') + '</div>' +
      '<label class="f"><input type="checkbox" data-f="sc" data-k="pass"' + (d.pass ? ' checked' : '') + '> Tout le monde passe</label>' +
      (d.pass ? '' :
        '<div class="grid2"><div><label class="f">Niveau</label><select data-f="sc" data-k="level">' + lv.join('') + '</select></div><div><label class="f">Couleur</label><select data-f="sc" data-k="den">' + dn + '</select></div></div>' +
        '<label class="f">Contre</label><select data-f="sc" data-k="dbl">' + db + '</select>' +
        '<label class="f">Déclarant</label><select data-f="sc" data-k="decl">' + de + '</select>' +
        '<label class="f">Résultat</label><select data-f="sc" data-k="res">' + rs.join('') + '</select>') +
      '<div class="big-score">NS ' + (val > 0 ? '+' : '') + val + '</div>' +
      '<div class="row"><button class="btn pri big grow" data-a="scoresave">Enregistrer</button><button class="btn big" data-a="scoreclose">Annuler</button></div>' +
      (sc.has ? '<button class="btn sm danger" style="margin-top:10px" data-a="scoreclear">Effacer ce résultat</button>' : '') + '</div></div>';
  }
  function saveScore() {
    const sc = ui.score, r = BR.currentRound(S);
    const t = r.tables.find(x => x.n === sc.t);
    const d = sc.d;
    t.results[sc.b] = d.pass ? { pass: true, players: Object.assign({}, t.seats) } : { pass: false, level: +d.level, den: d.den, dbl: +d.dbl, decl: d.decl, res: +d.res, players: Object.assign({}, t.seats) };
    ui.score = null; commit();
  }

  /* ---------- Scores ---------- */
  function viewScores() {
    const sc = BR.computeScores(S);
    const ranked = sc.players.filter(p => !p.teacher && p.avg != null).sort((a, b) => b.avg - a.avg);
    const others = sc.players.filter(p => !p.teacher && p.avg == null && p.rounds > 0);
    const nBoards = Object.keys(sc.byBoard).length;
    let h = '<div class="card"><h2>Classement individuel</h2><div class="mute">Pourcentage moyen, donne par donne, contre tous les joueurs qui ont joué la même donne. ' + nBoards + ' donnes saisies.</div>';
    if (!ranked.length) h += '<p class="mute">Le classement apparaît dès que deux tables ont saisi le résultat d\'une même donne.</p>';
    else {
      h += '<table class="rank"><tr><th>#</th><th>Joueur</th><th class="num">%</th><th class="num">Donnes</th><th class="num">Contrats</th></tr>' +
        ranked.map((p, i) => '<tr><td>' + (i + 1) + '</td><td>' + esc(p.name) + '</td><td class="num"><b>' + p.avg.toFixed(1) + '</b></td><td class="num">' + p.boards + '</td><td class="num">' + p.declared + '</td></tr>').join('') + '</table>';
    }
    h += '</div>';
    if (others.length) h += '<div class="card"><h3>Pas encore de comparaison</h3><div class="mute">' + others.map(p => esc(p.name)).join(', ') + '</div></div>';
    const bn = Object.keys(sc.byBoard).map(Number).sort((a, b) => a - b);
    if (bn.length) {
      h += '<div class="card"><details><summary>Résultats par donne</summary>' + bn.map(n => {
        const l = sc.byBoard[n].slice().sort((a, b) => b.ns - a.ns);
        return '<h3 style="margin-top:10px">Donne ' + n + '</h3><table class="rank">' + l.map(x => '<tr><td>T' + x.table + '</td><td>' + esc(resultText(x.r)) + '</td><td class="num">NS ' + (x.ns > 0 ? '+' : '') + x.ns + '</td><td class="num">' + (x.pct == null ? '—' : x.pct.toFixed(0) + '%') + '</td></tr>').join('') + '</table>';
      }).join('') + '</details></div>';
    }
    return h + '<p class="mute">« Contrats » = nombre de fois où le joueur a été déclarant (voir qui n\'a pas encore joué de contrat).</p>';
  }

  /* ---------- Donnes ---------- */
  function viewBoards() {
    let h = '<div class="card"><h2>Plan de préparation des donnes</h2><div class="mute">Chaque série compte ' + K() + ' donnes. Un siège est le « déclarant prévu » : composez la donne pour que sa paire ait le contrat (≈ 24-27 points, belle couleur, petite difficulté de jeu). Le siège change d\'une donne à l\'autre et d\'une série à l\'autre, pour que chacun joue des contrats. Les dernières donnes de chaque série servent de donnes tampon.</div>' +
      '<button class="btn sm noprint" style="margin-top:8px" data-a="print">Imprimer</button></div>';
    for (let s = 1; s <= S.settings.bankSets; s++) {
      h += '<div class="setcard"><h3>Série ' + s + '</h3>' + BR.boardsOfSet(s, K()).map((bn, i) => {
        const b = BR.boardInfo(bn);
        const vul = b.vul === '-' ? 'Personne' : b.vul === 'ALL' ? 'Tous' : b.vul === 'NS' ? 'NS' : 'EO';
        return '<div class="brow"><span class="bn">' + bn + '</span><span class="info"><small>Donneur ' + SN[b.dealer] + ' · Vul ' + vul + ' · </small><b>main prévue : ' + SN[BR.designated(bn, K())] + '</b>' + (i >= 3 ? ' <span class="pill">tampon</span>' : '') +
          '<input type="text" data-f="note" data-b="' + bn + '" placeholder="Thème / idée de la donne" value="' + esc(S.notes[bn] || '') + '" style="margin-top:4px"></span></div>';
      }).join('') + '</div>';
    }
    return h;
  }

  /* ---------- Réglages ---------- */
  function viewSettings() {
    const s = S.settings;
    const num = (k, label, min, max) => '<label class="f">' + label + '</label><input type="number" inputmode="numeric" min="' + min + '" max="' + max + '" data-f="set" data-k="' + k + '" value="' + s[k] + '">';
    return '<div class="card"><h2>Séance</h2><div class="grid2"><div><label class="f">Début</label><input type="time" data-f="set" data-k="start" value="' + s.start + '"></div><div><label class="f">Fin</label><input type="time" data-f="set" data-k="end" value="' + s.end + '"></div></div>' +
      num('roundMin', 'Durée visée d\'un tour (minutes)', 10, 90) + num('minPerBoard', 'Minutes par donne (jeu + marque)', 4, 20) + num('changeMin', 'Minutes de changement de table', 0, 10) + num('setSize', 'Donnes par série (3 jouées + tampon = 4)', 2, 6) + num('bankSets', 'Séries de donnes préparées', 3, 30) +
      '<p class="mute">Le nombre de donnes par tour est calculé pour que le dernier tour se termine à l\'heure de fin.</p></div>' +
      '<div class="card"><h2>Sauvegarde</h2><div class="row"><button class="btn" data-a="export">Exporter (fichier)</button><label class="btn" style="margin:0">Importer<input type="file" id="imp" accept=".json,application/json" style="display:none"></label></div>' +
      '<p class="mute">Les données restent dans ce navigateur. Exportez avant de changer d\'appareil.</p></div>' +
      '<div class="card"><h2>Nouvelle séance</h2><button class="btn" data-a="newsession">Nouvelle après-midi (garde la liste des joueurs)</button> <button class="btn danger" data-a="reset" style="margin-top:8px">Tout effacer</button></div>';
  }

  /* ---------- Actions ---------- */
  function setPresent(p, v) {
    p.present = v;
    if (v) p.arrivedAt = Date.now();
  }
  const actions = {
    tab(el) { ui.tab = el.dataset.v; ui.score = null; render(); window.scrollTo(0, 0); },
    add() {
      const inp = $('#pname'); const p = addPlayer(inp.value);
      if (p) { ui.filter = ''; commit(); const i = $('#pname'); if (i) i.focus(); }
    },
    bulk() {
      const names = $('#bulk').value.split(/\n/).map(x => x.trim()).filter(Boolean);
      names.forEach(n => { if (!S.players.some(p => p.name.toLowerCase() === n.toLowerCase())) addPlayer(n, false); });
      commit();
    },
    pres(el) { const p = getP(+el.dataset.id); if (p) { setPresent(p, !p.present); commit(); } },
    teach(el) { const p = getP(+el.dataset.id); if (!p) return; const v = !p.teacher; S.players.forEach(x => { x.teacher = false; }); p.teacher = v; commit(); },
    del(el) { const p = getP(+el.dataset.id); if (p && confirm('Supprimer ' + p.name + ' de la liste ?')) { S.players = S.players.filter(x => x.id !== p.id); commit(); } },
    allpres() { S.players.forEach(p => { if (!p.present) setPresent(p, true); }); commit(); },
    nonepres() { if (confirm('Marquer tout le monde absent ?')) { S.players.forEach(p => { p.present = false; }); commit(); } },
    next() {
      const b = +$('#bsel').value;
      const r = BR.planRound(S, { boards: b, now: Date.now() });
      if (r.error) { alert(r.error); return; }
      S.rounds.push(r); commit(); window.scrollTo(0, 0);
    },
    opentable() { if (!BR.openExtraTable(S)) alert('Impossible d\'ouvrir une table.'); commit(); },
    replace(el) {
      const sel = $('#rep-' + el.dataset.t + '-' + el.dataset.s);
      if (sel) { BR.replaceSeat(S, +el.dataset.t, el.dataset.s, +sel.value); commit(); }
    },
    dissolve(el) { if (confirm('Fermer cette table ?')) { BR.dissolveTable(S, +el.dataset.t); commit(); } },
    score(el) { openScore(+el.dataset.t, +el.dataset.b); },
    scoreclose() { ui.score = null; render(); },
    scoresave() { saveScore(); },
    scoreclear() { const r = BR.currentRound(S); const t = r.tables.find(x => x.n === ui.score.t); delete t.results[ui.score.b]; ui.score = null; commit(); },
    print() { window.print(); },
    export() {
      const blob = new Blob([JSON.stringify(S)], { type: 'application/json' });
      const a = document.createElement('a'); a.href = URL.createObjectURL(blob);
      const d = new Date(); a.download = 'bridge-relax-' + d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate()) + '.json';
      document.body.appendChild(a); a.click(); setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 500);
    },
    newsession() {
      if (!confirm('Commencer une nouvelle après-midi ? Les tours et scores actuels seront effacés (pensez à exporter). La liste des joueurs est conservée.')) return;
      S.rounds = []; S.players.forEach(p => { p.present = false; }); ui.tab = 'joueurs'; commit();
    },
    reset() { if (confirm('Tout effacer, y compris la liste des joueurs ?') && confirm('Vraiment tout effacer ?')) { S = defaults(); commit(); } }
  };

  document.addEventListener('click', e => {
    if (e.target.closest('[data-stop]') && !e.target.closest('button')) return;
    const el = e.target.closest('[data-a]');
    if (!el) return;
    if (el.classList.contains('overlay') && e.target !== el) return;
    const f = actions[el.dataset.a];
    if (f) f(el);
  });
  document.addEventListener('keydown', e => {
    if (e.key === 'Enter' && e.target.id === 'pname') { e.preventDefault(); actions.add(); }
  });
  document.addEventListener('input', e => {
    const el = e.target;
    if (el.id === 'pname') { ui.filter = el.value; const l = $('#plist'); if (l) l.innerHTML = playersListHtml(); }
    else if (el.dataset.f === 'note') { S.notes[el.dataset.b] = el.value; save(); }
  });
  document.addEventListener('change', e => {
    const el = e.target;
    if (el.dataset.f === 'sc') {
      const k = el.dataset.k;
      ui.score.d[k] = el.type === 'checkbox' ? el.checked : (k === 'den' || k === 'decl') ? el.value : +el.value;
      render();
    } else if (el.dataset.f === 'set') {
      const k = el.dataset.k;
      S.settings[k] = (k === 'start' || k === 'end') ? el.value : Math.max(0, +el.value || 0);
      if (k === 'setSize' && S.settings.setSize < 2) S.settings.setSize = 2;
      save();
    } else if (el.id === 'imp' && el.files[0]) {
      const rd = new FileReader();
      rd.onload = () => { try { const j = JSON.parse(rd.result); if (j && j.v === 1) { S = Object.assign(defaults(), j); commit(); } else alert('Fichier non reconnu.'); } catch (x) { alert('Fichier illisible.'); } };
      rd.readAsText(el.files[0]);
    }
  });

  render();
  setInterval(updateClock, 15000);
  window.__BR_UI = { get state() { return S; }, ui, render, actions };
})();

</script>
</html>
