<title>Bridge Relax</title>
<style>
/* Bridge Relax — l'esthétique vient de l'étui de duplicate : carrés, bords rouges (vulnérable), cartes ivoire */
:root{
  --ink:#14233b;--ink-2:#3b4b66;--mute:#6a7890;
  --bg:#e9eef5;--paper:#ffffff;--paper-2:#f4f7fb;--line:#d3dbe7;
  --navy:#14233b;--navy-ink:#f3f6fb;
  --brass:#a97a1f;--brass-soft:#f2e6c9;
  --red:#c8342f;--red-soft:#fbe6e4;
  --green:#1f8a57;--green-soft:#dff2e8;
  --felt:#1d5c47;--felt-2:#164a39;
  --plate:#fbf8f0;--plate-ink:#1b2438;
  --shadow:0 1px 0 rgba(20,35,59,.05),0 10px 24px -14px rgba(20,35,59,.35);
  --serif:"Baskerville","Baskerville Old Face","Libre Baskerville",Georgia,"Times New Roman",serif;
  --sans:"Avenir Next","Avenir","Segoe UI",system-ui,-apple-system,Roboto,sans-serif;
}
@media (prefers-color-scheme:dark){
  :root{
    --ink:#e9eef6;--ink-2:#c3cddc;--mute:#8f9db3;
    --bg:#0c1320;--paper:#142033;--paper-2:#192840;--line:#27374f;
    --navy:#0a101b;--navy-ink:#eef3fa;
    --brass:#e0b255;--brass-soft:#3a2f17;
    --red:#ff6f66;--red-soft:#3b1d21;
    --green:#4cc38a;--green-soft:#133126;
    --felt:#16503d;--felt-2:#103a2d;
    --plate:#f3efe3;--plate-ink:#14192a;
    --shadow:0 1px 0 rgba(0,0,0,.4),0 12px 26px -16px rgba(0,0,0,.8);
  }
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.45 var(--sans);padding-bottom:calc(92px + env(safe-area-inset-bottom));min-height:100vh}
button,select,input,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--brass);outline-offset:2px}

/* En-tête */
header{position:sticky;top:0;z-index:5;background:var(--navy);color:var(--navy-ink);padding:calc(10px + env(safe-area-inset-top)) 16px 10px;display:flex;align-items:center;gap:12px}
header .logo{width:40px;height:40px;border-radius:10px;box-shadow:0 0 0 1.5px rgba(224,178,85,.7)}
header h1{margin:0;font:400 23px/1 var(--serif);letter-spacing:.2px;flex:1}
header .clock{font-variant-numeric:tabular-nums;text-align:right;font-size:13px;line-height:1.25;color:rgba(243,246,251,.82)}
header .clock b{display:block;font:400 21px/1.05 var(--serif);color:#fff}
main{max-width:1240px;margin:0 auto;padding:16px 14px}

/* Navigation */
nav{position:fixed;left:12px;right:12px;bottom:calc(10px + env(safe-area-inset-bottom));z-index:6;display:flex;gap:2px;background:var(--navy);border-radius:22px;padding:6px;box-shadow:0 14px 30px -10px rgba(0,0,0,.55)}
nav button{flex:1;border:0;background:none;color:rgba(243,246,251,.62);padding:8px 2px 7px;border-radius:16px;font-size:11.5px;display:flex;flex-direction:column;align-items:center;gap:3px}
nav button svg{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
nav button.on{background:rgba(224,178,85,.17);color:#f0cf86;font-weight:700}

/* Titres et textes */
h2{margin:0 0 4px;font:400 26px/1.15 var(--serif)}
h3{margin:0 0 6px;font:700 15px/1.3 var(--sans)}
.lead{color:var(--ink-2);margin:0 0 12px}
.mute{color:var(--mute);font-size:14px}
.sec{margin:0 0 22px}
.sec>h2{margin-bottom:10px}

.go-row{display:flex;gap:10px;align-items:stretch;margin:6px 0 4px}

.go-row .btn.go{flex:1}

/* Ligne du temps de l'après-midi */
.tl{margin:2px 0 18px}
.tl .bar{position:relative;height:14px;border-radius:9px;background:var(--paper-2);box-shadow:inset 0 0 0 1.5px var(--line);overflow:hidden}
.tl .seg{position:absolute;top:0;bottom:0;background:var(--felt);opacity:.9;border-right:2px solid var(--bg)}
.tl .seg.cur{background:var(--brass)}
.tl .now{position:absolute;top:-3px;bottom:-3px;width:3px;background:var(--red);border-radius:2px}
.tl .ticks{position:relative;height:18px;font-size:12px;color:var(--mute)}
.tl .ticks span{position:absolute;transform:translateX(-50%);top:4px}

/* Alertes */
.note{border-radius:14px;padding:11px 14px;margin:0 0 14px;font-size:15px;border:1.5px solid}
.note.warn{background:var(--brass-soft);border-color:var(--brass);color:var(--ink)}
.note.bad{background:var(--red-soft);border-color:var(--red);color:var(--ink)}
.note.ok{background:var(--green-soft);border-color:var(--green);color:var(--ink)}

/* Tables : l'étui vu de dessus */
.tables{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:18px}
.tcard{background:var(--paper);border-radius:22px;box-shadow:var(--shadow);overflow:hidden}
.tcard.closed{opacity:.5}
.tcard.deal{animation:deal .42s cubic-bezier(.2,.8,.25,1) both;animation-delay:calc(var(--i)*55ms)}
@keyframes deal{from{opacity:0;transform:translateY(18px) rotate(-1.6deg) scale(.97)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){.tcard.deal{animation:none}}
.felt{position:relative;background:radial-gradient(120% 90% at 50% 40%,var(--felt) 0%,var(--felt-2) 100%);padding:14px 12px 16px;color:#fff}
.felt .tag{position:absolute;right:12px;top:10px;font-size:12px;color:rgba(255,255,255,.8);text-align:right;line-height:1.25}
.felt .tag b{display:block;font:400 15px var(--serif);color:#f0cf86}
.seats{display:grid;grid-template-columns:minmax(0,1fr) 88px minmax(0,1fr);grid-template-rows:auto auto auto;gap:8px;align-items:center;margin-top:20px}
.plate{position:relative;background:var(--plate);color:var(--plate-ink);border-radius:12px;padding:8px 10px 8px 34px;min-height:50px;display:flex;align-items:center;font-weight:600;font-size:15px;line-height:1.2;box-shadow:0 2px 0 rgba(0,0,0,.25);word-break:break-word}
.plate .sl{position:absolute;left:7px;top:50%;transform:translateY(-50%);width:21px;height:21px;border-radius:50%;background:var(--navy);color:#fff;font:700 11px/21px var(--sans);text-align:center}
.plate.prof{box-shadow:0 0 0 3px #f0cf86,0 2px 0 rgba(0,0,0,.25)}
.plate.prof::after{content:"prof";position:absolute;right:7px;top:3px;font-size:10px;color:var(--brass);font-weight:700}
.plate.gone{background:var(--red-soft);color:var(--red);text-decoration:line-through}
.p-N{grid-column:1/4;grid-row:1;justify-self:center;width:62%}
.p-O{grid-column:1;grid-row:2}
.p-E{grid-column:3;grid-row:2}
.p-S{grid-column:1/4;grid-row:3;justify-self:center;width:62%}
.hub{grid-column:2;grid-row:2;aspect-ratio:1;border-radius:14px;background:rgba(0,0,0,.28);box-shadow:inset 0 0 0 2px rgba(240,207,134,.8);display:flex;flex-direction:column;align-items:center;justify-content:center;color:#fff}

.boards{padding:4px 14px 12px}
.brow{display:flex;align-items:center;gap:12px;padding:10px 0;border-top:1px solid var(--line)}

.brow .res{font-weight:700;font-size:16px}
.brow .btn{align-self:center}
/* mini-étui : bords rouges = camp vulnérable, point = donneur */
.mb{position:relative;flex:none;width:52px;height:52px;border-radius:8px;background:var(--paper-2);border:4px solid var(--line);display:flex;align-items:center;justify-content:center;font:400 19px/1 var(--serif);color:var(--ink)}

.mb i.dN{top:3px;left:50%;margin-left:-3.5px}.mb i.dS{bottom:3px;left:50%;margin-left:-3.5px}

.buf{padding:9px 14px 12px;background:var(--paper-2);display:flex;align-items:center;gap:8px;flex-wrap:wrap;font-size:13px;color:var(--mute)}
.fix{padding:0 14px 12px}
.fix .note{margin:10px 0 0}
.red{color:var(--red)}

/* Couleurs de cartes */
.su{font-family:"Segoe UI Symbol","Apple Symbols",var(--sans)}
.su.r{color:var(--red)}

/* Joueurs */
.plist{background:var(--paper);border-radius:20px;box-shadow:var(--shadow);padding:4px 14px}
.prow{display:flex;align-items:center;gap:12px;padding:10px 0;border-top:1px solid var(--line)}
.prow:first-child{border-top:0}
.av{flex:none;width:42px;height:42px;border-radius:50%;display:flex;align-items:center;justify-content:center;font:400 17px/1 var(--serif);color:#fff;background:var(--navy)}
.av.c1{background:#8c2b27}.av.c2{background:#1d5c47}.av.c3{background:#8a6416}.av.c4{background:#3b4b66}

.sw{border:1.5px solid var(--line);background:var(--paper);border-radius:999px;padding:7px 14px;font-weight:700;font-size:14px;color:var(--mute);min-width:92px}
.sw.on{background:var(--green-soft);border-color:var(--green);color:var(--green)}
.star{border:0;background:none;font-size:22px;color:var(--mute);padding:4px}
.star.on{color:var(--brass)}
.x{border:0;background:none;color:var(--mute);font-size:18px;padding:6px}
.pill{display:inline-block;border-radius:999px;padding:1px 9px;font-size:12px;background:var(--brass-soft);color:var(--brass);font-weight:700}

/* Classement */

.rank li{display:grid;grid-template-columns:40px 1fr auto;align-items:center;gap:10px;padding:10px 0;border-top:1px solid var(--line)}
.rank li:first-child{border-top:0}
.rk{width:34px;height:34px;border-radius:50%;display:flex;align-items:center;justify-content:center;font:400 17px var(--serif);background:var(--paper-2);color:var(--ink-2)}
.rk.g1{background:#e3b94f;color:#3b2a00}.rk.g2{background:#c5ccd6;color:#25303f}.rk.g3{background:#cf9a6b;color:#3a2210}
.rank .who b{display:block;font-size:17px;line-height:1.2}
.rank .who small{color:var(--mute);font-size:12.5px}
.rank .bar{height:6px;border-radius:3px;background:var(--paper-2);margin-top:5px;overflow:hidden}
.rank .bar i{display:block;height:100%;background:var(--felt)}
.rank .pc{font:400 24px var(--serif);text-align:right}
table.tr{width:100%;border-collapse:collapse;font-size:14px}
table.tr td{padding:6px 4px;border-bottom:1px solid var(--line)}
td.num{text-align:right;font-variant-numeric:tabular-nums}

/* Feuille de score */
.overlay{position:fixed;inset:0;background:rgba(6,12,22,.62);z-index:20;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--paper);width:100%;max-width:560px;border-radius:26px 26px 0 0;padding:18px 16px calc(18px + env(safe-area-inset-bottom));max-height:94vh;overflow:auto;animation:up .22s ease-out}
@keyframes up{from{transform:translateY(30px);opacity:.4}to{transform:none;opacity:1}}
@media (prefers-reduced-motion:reduce){.sheet{animation:none}}
.sheet h2{font-size:24px}
.chips{display:flex;gap:7px;flex-wrap:wrap;margin:4px 0 4px}
.chip{border:1.5px solid var(--line);background:var(--paper);border-radius:13px;min-width:46px;height:46px;padding:0 10px;font:400 20px/1 var(--serif);color:var(--ink);display:flex;align-items:center;justify-content:center;gap:5px}
.chip.on{background:var(--navy);border-color:var(--navy);color:var(--navy-ink)}
@media (prefers-color-scheme:dark){.chip.on{background:var(--brass);border-color:var(--brass);color:#1b1405}}
.chip.suit{font-size:26px;min-width:56px}
.chip.suit.r{color:var(--red)}
.chip.suit.r.on{color:#ffd9d6}
.chip.seatc{font:600 15px var(--sans);flex:1;min-width:120px;justify-content:flex-start;padding:0 12px}
.chip.seatc b{font:700 12px var(--sans);width:22px;height:22px;border-radius:50%;background:var(--paper-2);color:var(--ink);display:flex;align-items:center;justify-content:center}
.chip.seatc.on b{background:rgba(255,255,255,.22);color:inherit}
.step{display:flex;align-items:center;gap:10px}
.step .btn{width:54px;height:54px;font-size:26px;padding:0}
.step .val{flex:1;text-align:center;font:400 22px var(--serif)}
.big-score{margin:14px 0 12px;padding:12px;border-radius:16px;background:var(--paper-2);text-align:center;font:400 40px/1.1 var(--serif)}
.big-score small{display:block;font:500 13px var(--sans);color:var(--mute)}
.big-score.neg{color:var(--red)}

/* Plan des donnes */
.setcard{background:var(--paper);border-radius:18px;box-shadow:var(--shadow);padding:8px 14px 10px;margin:0 0 14px}
.setcard h3{font:400 20px var(--serif);margin:6px 0 2px}
.setcard input{margin-top:5px}
details{margin:0 0 12px}
details summary{cursor:pointer;font-weight:700;padding:8px 0}
.empty{text-align:center;padding:26px 10px 10px;color:var(--ink-2)}
.empty svg{width:150px;height:150px;margin-bottom:6px}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:13px;color:var(--mute);margin:0 0 14px;align-items:center}
.legend .mb{width:26px;height:26px;border-width:3px;font-size:11px}
.panel{background:var(--paper);border-radius:20px;box-shadow:var(--shadow);padding:14px 16px;margin:0 0 16px}

@media print{
  header,nav,.noprint{display:none!important}
  body{background:#fff;color:#000;padding:0}
  .tcard,.setcard,.panel{box-shadow:none;border:1px solid #999;break-inside:avoid}
}
@media (min-width:760px){
  body{padding-bottom:40px}
  nav{position:sticky;top:60px;left:auto;right:auto;bottom:auto;max-width:560px;margin:12px auto 0;box-shadow:none}
  nav button{flex-direction:row;justify-content:center;gap:8px;font-size:14px}
}

/* Portable, tablette en paysage et grands écrans */
.split{display:block}
.cols2{display:grid;grid-template-columns:repeat(auto-fit,minmax(340px,1fr));gap:16px;align-items:start}
.cols2 .panel{margin:0}
.sets{display:grid;grid-template-columns:repeat(auto-fill,minmax(330px,1fr));gap:16px;align-items:start}
.sets .setcard{margin:0}
@media (min-width:1000px){
  main{padding:22px 24px}
  .split{display:grid;grid-template-columns:340px minmax(0,1fr);grid-template-areas:"side tw" "annc tw";column-gap:28px;align-items:start}

  .tw{grid-area:tw}
  .annc{grid-area:annc}

  .plist{display:grid;grid-template-columns:1fr 1fr;column-gap:36px}
  .plist .prow:nth-child(2){border-top:0}
  .rank{display:grid;grid-template-columns:1fr 1fr;column-gap:36px}
  .rank li:nth-child(2){border-top:0}
}
@media (min-width:1700px){
  main{max-width:1560px}
  body:not(.salle-on){zoom:1.18}
}
@media (min-width:2300px){
  body:not(.salle-on){zoom:1.5}
}

<script>
/* Bridge Relax — moteur d'organisation (rotation individuelle, donnes, scores) */
(function (root) {
  'use strict';

  const SEATS = ['N', 'E', 'S', 'O'];
  const SEAT_NAME = { N: 'Nord', E: 'Est', S: 'Sud', O: 'Ouest' };
  const VUL16 = ['-', 'NS', 'EW', 'ALL', 'NS', 'EW', 'ALL', '-', 'EW', 'ALL', '-', 'NS', 'ALL', '-', 'NS', 'EW'];

  // Poids de l'optimisation
  const W_P = 400;   // même partenaire qu'avant
  const W_O = 40;    // même adversaire qu'avant
  const W_R = 3000;  // rejouer une série déjà jouée
  const W_S = 10;    // même siège qu'avant
  const W_D = 30;    // donner la main (déclarant prévu) à qui a le moins déclaré

  /* ---------- Donnes ---------- */
  function boardInfo(n) {
    const dealer = SEATS[(n - 1) % 4];
    const v = VUL16[(n - 1) % 16];
    return { n, dealer, vul: v, vulNS: v === 'NS' || v === 'ALL', vulEW: v === 'EW' || v === 'ALL' };
  }
  function setOf(n, K) { return Math.floor((n - 1) / K) + 1; }
  function designated(n, K) { return SEATS[((n - 1) % K + setOf(n, K)) % 4]; }
  function boardsOfSet(set, K, count) {
    const c = count == null ? K : count;
    return Array.from({ length: c }, (_, i) => (set - 1) * K + i + 1);
  }

  /* ---------- Marque duplicate ---------- */
  function scoreContract(c, vulDecl) {
    const level = c.level, den = c.den, dbl = c.dbl || 0, res = c.res;
    const V = !!vulDecl;
    const per = (den === 'C' || den === 'D') ? 20 : 30;
    if (res >= 0) {
      let trick = den === 'SA' ? 40 + 30 * (level - 1) : per * level;
      trick *= dbl === 0 ? 1 : dbl === 1 ? 2 : 4;
      let s = trick + (trick >= 100 ? (V ? 500 : 300) : 50);
      if (level === 6) s += V ? 750 : 500;
      if (level === 7) s += V ? 1500 : 1000;
      if (dbl === 1) s += 50;
      if (dbl === 2) s += 100;
      if (res > 0) s += dbl === 0 ? res * per : res * (V ? 200 : 100) * (dbl === 2 ? 2 : 1);
      return s;
    }
    const down = -res;
    if (dbl === 0) return -down * (V ? 100 : 50);
    let pen = 0;
    for (let i = 1; i <= down; i++) pen += V ? (i === 1 ? 200 : 300) : (i === 1 ? 100 : i <= 3 ? 200 : 300);
    if (dbl === 2) pen *= 2;
    return -pen;
  }
  // Score vu du côté Nord-Sud
  function nsScore(r, boardNo) {
    if (r.pass || !r.level) return 0;
    const b = boardInfo(boardNo);
    const declNS = r.decl === 'N' || r.decl === 'S';
    const s = scoreContract(r, declNS ? b.vulNS : b.vulEW);
    return declNS ? s : -s;
  }

  /* ---------- Utilitaires ---------- */
  function mulberry32(a) {
    return function () {
      a |= 0; a = (a + 0x6D2B79F5) | 0;
      let t = Math.imul(a ^ (a >>> 15), 1 | a);
      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };

  function shuffle(a, rng) {
    for (let i = a.length - 1; i > 0; i--) {
      const j = Math.floor(rng() * (i + 1));
      const t = a[i]; a[i] = a[j]; a[j] = t;
    }
    return a;
  }
  const pk = (a, b) => (a < b ? a + '-' + b : b + '-' + a);
  function inc(o, k) { o[k] = (o[k] || 0) + 1; }

  /* ---------- Historique ---------- */
  function history(state) {
    const h = { partner: {}, opp: {}, seat: {}, seen: {}, rests: {}, lastRest: {}, played: {}, decl: {}, setUse: {}, setLast: {}, maxSet: 0 };
    state.rounds.forEach((r, ri) => {
      (r.rest || []).forEach(id => { inc(h.rests, id); h.lastRest[id] = ri; });
      r.tables.forEach(t => {
        const s = t.seats;
        inc(h.partner, pk(s.N, s.S)); inc(h.partner, pk(s.E, s.O));
        [[s.N, s.E], [s.N, s.O], [s.S, s.E], [s.S, s.O]].forEach(x => inc(h.opp, pk(x[0], x[1])));
        SEATS.forEach(k => {
          const id = s[k];
          if (!h.seat[id]) h.seat[id] = {};
          inc(h.seat[id], k);
        });
        const ids = [s.N, s.E, s.S, s.O].concat(t.extra || []);
        ids.forEach(id => {
          if (!h.seen[id]) h.seen[id] = new Set();
          h.seen[id].add(t.set);
        });
        [s.N, s.E, s.S, s.O].forEach(id => inc(h.played, id));
        inc(h.setUse, t.set);
        h.setLast[t.set] = { round: ri, table: t.n };
        if (t.set > h.maxSet) h.maxSet = t.set;
        Object.keys(t.results || {}).forEach(bn => {
          const res = t.results[bn];
          if (res && !res.pass && res.level && res.players) inc(h.decl, res.players[res.decl]);
        });
      });
    });
    return h;
  }

  /* ---------- Coûts ---------- */
  function tableCost(h, q, set) {
    let c = 0;
    const p1 = h.partner[pk(q[0], q[1])] || 0, p2 = h.partner[pk(q[2], q[3])] || 0;
    c += W_P * (p1 * p1 + p2 * p2);
    for (let i = 0; i < 2; i++) for (let j = 2; j < 4; j++) c += W_O * (h.opp[pk(q[i], q[j])] || 0);
    for (let i = 0; i < 4; i++) { const s = h.seen[q[i]]; if (s && s.has(set)) c += W_R; }
    return c;
  }

  function anneal(ids, slots, h, rng, iters, restarts) {
    const T = slots.length;
    let best = null, bc = Infinity;
    for (let r = 0; r < restarts; r++) {
      const cur = shuffle(ids.slice(), rng);
      const tc = [];
      for (let t = 0; t < T; t++) tc.push(tableCost(h, cur.slice(4 * t, 4 * t + 4), slots[t]));
      let total = tc.reduce((a, b) => a + b, 0);
      const t0 = 300, t1 = 0.5;
      for (let it = 0; it < iters; it++) {
        const temp = t0 * Math.pow(t1 / t0, it / iters);
        const i = Math.floor(rng() * cur.length), j = Math.floor(rng() * cur.length);
        if (i === j) continue;
        const ti = (i / 4) | 0, tj = (j / 4) | 0;
        const a = cur[i], b = cur[j];
        cur[i] = b; cur[j] = a;
        const ci = tableCost(h, cur.slice(4 * ti, 4 * ti + 4), slots[ti]);
        const cj = tj === ti ? ci : tableCost(h, cur.slice(4 * tj, 4 * tj + 4), slots[tj]);
        const delta = (ci - tc[ti]) + (tj === ti ? 0 : (cj - tc[tj]));
        if (delta <= 0 || rng() < Math.exp(-delta / temp)) {
          tc[ti] = ci; if (tj !== ti) tc[tj] = cj; total += delta;
        } else { cur[i] = a; cur[j] = b; }
      }
      if (total < bc) { bc = total; best = cur.slice(); }
    }
    return { arr: best, cost: bc };
  }

  // Place 4 joueurs (paires [0,1] et [2,3]) sur les sièges
  function orient(four, boardNums, h, K, rng, useDecl) {
    const bonus = { N: 0, E: 0, S: 0, O: 0 };
    boardNums.forEach(n => bonus[designated(n, K)]++);
    const pairs = [[four[0], four[1]], [four[2], four[3]]];
    let best = null, bc = Infinity;
    for (let ns = 0; ns < 2; ns++) for (let f1 = 0; f1 < 2; f1++) for (let f2 = 0; f2 < 2; f2++) {
      const pn = pairs[ns], pe = pairs[1 - ns];
      const seats = {
        N: f1 ? pn[1] : pn[0], S: f1 ? pn[0] : pn[1],
        E: f2 ? pe[1] : pe[0], O: f2 ? pe[0] : pe[1]
      };
      let c = 0;
      SEATS.forEach(k => {
        const id = seats[k];
        const sc = (h.seat[id] && h.seat[id][k]) || 0;
        c += W_S * sc * sc;
        if (useDecl) c -= W_D * bonus[k] / (1 + (h.decl[id] || 0));
      });
      c += rng() * 0.01;
      if (c < bc) { bc = c; best = seats; }
    }
    return best;
  }

  /* ---------- Plan du jour ---------- */
  function suggestPlan(P, hasTeacher) {
    if (hasTeacher && P % 4 === 3) return { tables: (P + 1) / 4, rest: 0, teacherPlays: true };
    const tables = Math.floor(P / 4);
    return { tables, rest: P - 4 * tables, teacherPlays: false };
  }

  function timeToMs(hhmm, ref) {
    const d = new Date(ref);
    const p = String(hhmm || '00:00').split(':');
    d.setHours(+p[0] || 0, +p[1] || 0, 0, 0);
    return d.getTime();
  }
  // Nombre de donnes conseillé pour le prochain tour, pour finir pile à l'heure
  function autoBoards(state, nowMs) {
    const s = state.settings;
    const end = timeToMs(s.end, nowMs);
    const start = timeToMs(s.start, nowMs);
    const from = Math.max(nowMs, start);
    const remaining = (end - from) / 60000;
    if (remaining <= 0) return 1;
    const roundsLeft = Math.max(1, Math.round(remaining / s.roundMin));
    const per = remaining / roundsLeft - (s.changeMin || 0);
    const b = Math.floor(per / s.minPerBoard + 0.25);
    return Math.max(1, Math.min(s.setSize, b));
  }

  /* ---------- Génération d'un tour ---------- */
  function planRound(state, opt) {
    opt = opt || {};
    const rng = opt.rng || Math.random;
    const st = state.settings, K = st.setSize;
    const h = history(state);
    const present = state.players.filter(p => p.present);
    const teacher = present.find(p => p.teacher) || null;
    const pool = present.filter(p => !p.teacher);
    const P = pool.length;
    const plan = suggestPlan(P, !!teacher);
    const T = plan.tables;
    if (T < 1) return { error: 'Il faut au moins 4 joueurs présents (ou 3 avec le professeur).' };
    const b = Math.max(1, Math.min(K, opt.boards || autoBoards(state, opt.now || Date.now())));

    // Qui se repose ? (ceux qui se sont le moins reposés ; jamais un joueur qui n'a pas encore joué)
    const cand = pool.map(p => ({ p, never: (h.played[p.id] || 0) === 0 ? 1 : 0, r: h.rests[p.id] || 0, l: h.lastRest[p.id] == null ? -1 : h.lastRest[p.id], x: rng() }));
    cand.sort((a, c) => a.never - c.never || a.r - c.r || a.l - c.l || a.x - c.x);
    const rest = cand.slice(0, plan.rest).map(c => c.p);
    const restIds = new Set(rest.map(p => p.id));
    const players = pool.filter(p => !restIds.has(p.id));
    if (plan.teacherPlays) players.push(teacher);

    // Séries de donnes de ce tour
    const warnings = [];
    const poolSize = Math.min(st.bankSets, Math.max(T + 3, h.maxSet));
    const order = [];
    for (let i = 1; i <= poolSize; i++) order.push(i);
    order.sort((a, c) => (h.setUse[a] || 0) - (h.setUse[c] || 0) || a - c);
    if (T > poolSize) warnings.push('Pas assez de séries de donnes (' + poolSize + ') pour ' + T + ' tables : augmentez le nombre de séries dans les réglages.');

    // On essaie plusieurs combinaisons d'étuis et on garde celle où personne ne rejoue un étui déjà vu
    const ids = players.map(p => p.id);
    let res = null, slots = null;
    for (let attempt = 0; attempt < 8; attempt++) {
      let ord = order.slice();
      if (attempt > 0) {
        // on garde les moins utilisés en tête, mais on mélange le reste du lot
        const lead = Math.max(0, T - 2);
        ord = order.slice(0, lead).concat(shuffle(order.slice(lead), rng));
      }
      const chosen = [];
      for (let i = 0; i < T; i++) chosen.push(ord[i % ord.length]);
      // l'étui passe à la table suivante
      const sl = new Array(T).fill(null);
      const todo = [];
      chosen.forEach(s => {
        const last = h.setLast[s];
        const want = last ? (last.table % T) : -1;
        if (last && T > 1 && sl[want] == null) sl[want] = s; else todo.push(s);
      });
      todo.sort((x, y) => x - y);
      for (let t = 0; t < T; t++) if (sl[t] == null) sl[t] = todo.shift();
      const r = anneal(ids, sl, h, rng, 2500 * T + 4000, attempt === 0 ? 4 : 2);
      if (!res || r.cost < res.cost) { res = r; slots = sl; }
      if (res.cost < W_R) break;
    }
    const tables = [];
    const stats = { repeatPartners: 0, repeatOpp: 0, replays: 0 };
    for (let t = 0; t < T; t++) {
      const q = res.arr.slice(4 * t, 4 * t + 4);
      const set = slots[t];
      const boards = boardsOfSet(set, K, b);
      const seats = orient(q, boards, h, K, rng, !!st.prepared);
      if ((h.partner[pk(seats.N, seats.S)] || 0) > 0) stats.repeatPartners++;
      if ((h.partner[pk(seats.E, seats.O)] || 0) > 0) stats.repeatPartners++;
      [[seats.N, seats.E], [seats.N, seats.O], [seats.S, seats.E], [seats.S, seats.O]].forEach(x => { if (h.opp[pk(x[0], x[1])]) stats.repeatOpp++; });
      q.forEach(id => { if (h.seen[id] && h.seen[id].has(set)) stats.replays++; });
      tables.push({ n: t + 1, set, boards, seats, closed: false, results: {}, extra: [], from: h.setLast[set] ? h.setLast[set].table : null });
    }
    return {
      n: state.rounds.length + 1, startedAt: opt.now || Date.now(), b,
      tables, rest: rest.map(p => p.id), teacherPlays: plan.teacherPlays,
      warnings, stats
    };
  }

  /* ---------- Pendant un tour ---------- */
  function currentRound(state) { return state.rounds.length ? state.rounds[state.rounds.length - 1] : null; }

  function waiting(state) {
    const r = currentRound(state);
    const seated = new Set();
    if (r) r.tables.forEach(t => { if (!t.closed) SEATS.forEach(k => seated.add(t.seats[k])); });
    const present = state.players.filter(p => p.present && !seated.has(p.id));
    return {
      players: present.filter(p => !p.teacher),
      teacherFree: present.some(p => p.teacher),
      teacher: present.find(p => p.teacher) || null
    };
  }

  function replaceSeat(state, tableN, seat, newId) {
    const r = currentRound(state);
    const t = r && r.tables.find(x => x.n === tableN);
    if (!t) return false;
    const old = t.seats[seat];
    t.extra = t.extra || [];
    if (t.extra.indexOf(old) < 0) t.extra.push(old);
    t.seats[seat] = newId;
    r.rest = (r.rest || []).filter(id => id !== newId);
    return true;
  }

  function dissolveTable(state, tableN) {
    const r = currentRound(state);
    const t = r && r.tables.find(x => x.n === tableN);
    if (t) t.closed = true;
  }

  function canOpenTable(state) {
    const w = waiting(state);
    const n = w.players.length;
    return n >= 4 || (n === 3 && w.teacherFree);
  }

  function openExtraTable(state, opt) {
    opt = opt || {};
    const rng = opt.rng || Math.random;
    const r = currentRound(state);
    if (!r || !canOpenTable(state)) return null;
    const st = state.settings, K = st.setSize;
    const h = history(state);
    const w = waiting(state);
    let four = w.players.slice().sort((a, c) => (h.rests[a.id] || 0) - (h.rests[c.id] || 0)).slice(0, 4);
    if (four.length === 3) four.push(w.teacher);
    const ids = four.map(p => p.id);
    // série : pas déjà jouée par ces joueurs, la moins utilisée, pas déjà sur une table de ce tour
    const used = new Set(r.tables.filter(t => !t.closed).map(t => t.set));
    const nTables = r.tables.length + 1;
    const poolSize = Math.min(st.bankSets, Math.max(nTables + 3, h.maxSet));
    let bestSet = null, bs = Infinity;
    for (let s = 1; s <= poolSize; s++) {
      if (used.has(s)) continue;
      let c = (h.setUse[s] || 0);
      ids.forEach(id => { if (h.seen[id] && h.seen[id].has(s)) c += 1000; });
      if (c < bs) { bs = c; bestSet = s; }
    }
    if (bestSet == null) return null;
    const boards = boardsOfSet(bestSet, K, r.b);
    // meilleur appariement parmi les 3 possibles
    const perms = [[0, 1, 2, 3], [0, 2, 1, 3], [0, 3, 1, 2]];
    let bp = null, bpc = Infinity;
    perms.forEach(p => {
      const q = p.map(i => ids[i]);
      const c = tableCost(h, q, bestSet);
      if (c < bpc) { bpc = c; bp = q; }
    });
    const seats = orient(bp, boards, h, K, rng, !!st.prepared);
    const n = Math.max.apply(null, r.tables.map(t => t.n)) + 1;
    const table = { n, set: bestSet, boards, seats, closed: false, results: {}, extra: [], late: true };
    r.tables.push(table);
    r.rest = (r.rest || []).filter(id => ids.indexOf(id) < 0);
    return table;
  }

  /* ---------- Scores ---------- */
  function computeScores(state) {
    const byBoard = {};
    state.rounds.forEach((r, ri) => {
      r.tables.forEach(t => {
        Object.keys(t.results || {}).forEach(bn => {
          const x = t.results[bn];
          if (!x || !x.players) return;
          (byBoard[bn] = byBoard[bn] || []).push({ round: r.n, table: t.n, r: x, ns: nsScore(x, +bn) });
        });
      });
    });
    const acc = {};
    const add = (id, pct) => { const a = acc[id] || (acc[id] = { sum: 0, n: 0 }); a.sum += pct; a.n++; };
    Object.keys(byBoard).forEach(bn => {
      const list = byBoard[bn];
      const n = list.length;
      list.forEach(x => {
        if (n < 2) { x.pct = null; return; }
        let mp = 0;
        list.forEach(o => { if (o !== x) mp += x.ns > o.ns ? 1 : x.ns === o.ns ? 0.5 : 0; });
        x.pct = mp / (n - 1) * 100;
        add(x.r.players.N, x.pct); add(x.r.players.S, x.pct);
        add(x.r.players.E, 100 - x.pct); add(x.r.players.O, 100 - x.pct);
      });
    });
    const h = history(state);
    const players = state.players.map(p => {
      const a = acc[p.id];
      return { id: p.id, name: p.name, teacher: !!p.teacher, avg: a ? a.sum / a.n : null, boards: a ? a.n : 0, declared: h.decl[p.id] || 0, rounds: h.played[p.id] || 0 };
    });
    return { players, byBoard };
  }

  const BR = {
    SEATS, SEAT_NAME, boardInfo, setOf, designated, boardsOfSet,
    scoreContract, nsScore, mulberry32, history, suggestPlan, autoBoards, timeToMs,
    planRound, currentRound, waiting, replaceSeat, dissolveTable, canOpenTable, openExtraTable, computeScores
  };
  if (typeof module !== 'undefined' && module.exports) module.exports = BR;
  else root.BR = BR;
})(typeof window !== 'undefined' ? window : globalThis);

</script>
<script>
/* Bridge Relax — interface */
(function () {
  'use strict';
  const LS = 'bridge-relax-v1';
  const LOGO = (document.querySelector('link[rel="apple-touch-icon"]') || {}).href || '';
  const SEATS = BR.SEATS, SN = BR.SEAT_NAME;
  const DEN = { C: '♣', D: '♦', H: '♥', S: '♠', SA: 'SA' };

  function defaults() {
    return { v: 1, nextId: 1, settings: { start: '15:00', end: '18:30', roundMin: 30, minPerBoard: 9, setSize: 4, bankSets: 12, changeMin: 2, prepared: false }, players: [], rounds: [], notes: {} };
  }
  function load() {
    try {
      const j = JSON.parse(localStorage.getItem(LS));
      if (j && j.v === 1) { const d = defaults(); return Object.assign(d, j, { settings: Object.assign(d.settings, j.settings) }); }
    } catch (e) { /* ignore */ }
    return defaults();
  }
  let S = load();
  const ui = { tab: 'tour', score: null, filter: '', fresh: false, salleView: 'noms', auto: true, tick: 0 };
  function save() { try { localStorage.setItem(LS, JSON.stringify(S)); } catch (e) { /* ignore */ } }
  function commit() { save(); render(); }

  const $ = s => document.querySelector(s);
  const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  const getP = id => S.players.find(p => p.id === id);
  const nm = id => { const p = getP(id); return p ? p.name : '?'; };
  const pad = n => String(n).padStart(2, '0');
  const fmtT = ms => { const d = new Date(ms); return pad(d.getHours()) + ':' + pad(d.getMinutes()); };
  const fmtDur = min => { min = Math.max(0, Math.round(min)); return min >= 60 ? Math.floor(min / 60) + ' h ' + pad(min % 60) : min + ' min'; };
  const plural = (n, a, b) => n + ' ' + (n > 1 ? b : a);
  const K = () => S.settings.setSize;
  const vulName = v => v === '-' ? 'personne' : v === 'ALL' ? 'tous' : v === 'NS' ? 'NS' : 'EO';
  const suitHtml = d => d === 'SA' ? 'SA' : '<span class="su' + (d === 'H' || d === 'D' ? ' r' : '') + '">' + DEN[d] + '</span>';
  const initials = n => n.trim().split(/\s+/).slice(0, 2).map(w => w.charAt(0)).join('').toUpperCase();

  const ICON = {
    joueurs: '<circle cx="9" cy="8" r="3.2"/><path d="M3 20c0-3.3 2.7-6 6-6s6 2.7 6 6"/><circle cx="17" cy="9" r="2.4"/><path d="M16 14.2c2.9.2 5 2.4 5 5.3"/>',
    tour: '<rect x="6" y="6" width="12" height="12" rx="2.5"/><circle cx="12" cy="2.9" r="1.5"/><circle cx="12" cy="21.1" r="1.5"/><circle cx="2.9" cy="12" r="1.5"/><circle cx="21.1" cy="12" r="1.5"/>',
    scores: '<path d="M8 4h8v5a4 4 0 0 1-8 0V4z"/><path d="M8 6H4v1a4 4 0 0 0 4 4M16 6h4v1a4 4 0 0 1-4 4"/><path d="M12 13v4M8 20h8M10 17h4"/>',
    donnes: '<rect x="4.5" y="3.5" width="11" height="15" rx="2.2"/><path d="M8.5 21h8.3a2.2 2.2 0 0 0 2.2-2.2V7.5"/>',
    reglages: '<path d="M4 7h9M17 7h3M4 17h3M11 17h9"/><circle cx="15" cy="7" r="2"/><circle cx="9" cy="17" r="2"/>'
  };

  /* ---------- En-tête ---------- */
  function updateClock() {
    const now = Date.now();
    const end = BR.timeToMs(S.settings.end, now);
    const left = (end - now) / 60000;
    const el = $('#hclock');
    if (el) el.innerHTML = '<b>' + fmtT(now) + '</b>' + (left > 0 ? 'reste ' + fmtDur(left) : 'séance terminée');
    const sc = $('#sclock');
    if (sc) sc.textContent = fmtT(now);
    const sn = $('#scount');
    const r0 = BR.currentRound(S);
    if (sn) {
      if (r0) {
        const m0 = (r0.startedAt + r0.b * S.settings.minPerBoard * 60000 - now) / 60000;
        sn.innerHTML = m0 > 0 ? 'Fin du tour dans <b>' + fmtDur(m0) + '</b>' : '<b>Tour terminé</b> : changez de table';
      } else sn.innerHTML = 'Le premier tour va commencer';
    }
    const rc = $('#rcount');
    const r = BR.currentRound(S);
    if (rc && r) {
      const endR = r.startedAt + r.b * S.settings.minPerBoard * 60000;
      const m = (endR - now) / 60000;
      rc.textContent = m > 0 ? 'fin prévue à ' + fmtT(endR) + ', dans ' + fmtDur(m) : 'fin prévue à ' + fmtT(endR) + ' : temps écoulé, passez au tour suivant dès que les tables ont fini';
    }
  }

  /* ---------- Rendu ---------- */
  function render() {
    document.body.className = ui.tab === 'salle' ? 'salle-on' : '';
    if (ui.tab === 'salle') { document.body.innerHTML = viewSalle(); ui.fresh = false; updateClock(); return; }
    const tabs = [['joueurs', 'Joueurs'], ['tour', 'Tour'], ['scores', 'Scores'], ['donnes', 'Donnes'], ['reglages', 'Réglages']];
    document.body.innerHTML =
      '<header><img class="logo" src="' + LOGO + '" alt=""><h1>Bridge Relax</h1><div class="clock" id="hclock"></div></header>' +
      '<nav>' + tabs.map(t => '<button data-a="tab" data-v="' + t[0] + '" class="' + (ui.tab === t[0] ? 'on' : '') + '"><svg viewBox="0 0 24 24" aria-hidden="true">' + ICON[t[0]] + '</svg>' + t[1] + '</button>').join('') + '</nav>' +
      '<main>' + ({ joueurs: viewPlayers, tour: viewRound, scores: viewScores, donnes: viewBoards, reglages: viewSettings }[ui.tab] || viewRound)() + '</main>' +
      (ui.score ? scoreSheet() : '');
    ui.fresh = false;
    updateClock();
  }

  /* ---------- Situation du jour ---------- */
  function planInfo() {
    const present = S.players.filter(p => p.present);
    const teacher = present.find(p => p.teacher);
    const n = present.filter(p => !p.teacher).length;
    const plan = BR.suggestPlan(n, !!teacher);
    let txt = plural(present.length, 'personne présente', 'personnes présentes') + (teacher ? ', professeur compris' : '') + '.';
    if (plan.tables < 1) txt = plural(present.length, 'personne présente', 'personnes présentes') + '. Il en faut au moins 4 pour une table (3 avec le professeur).';
    else {
      if (plan.teacherPlays) txt += ' Le professeur joue à une table.';
      if (plan.rest) {
        txt += ' ' + plural(plan.rest, 'joueur au repos', 'joueurs au repos') + ' à chaque tour.';
        const need = teacher ? 3 - plan.rest : 4 - plan.rest;
        if (need > 0) txt += ' Encore ' + plural(need, 'arrivée', 'arrivées') + ' et une table de plus s\'ouvre.';
      }
    }
    return { tables: plan.tables, txt };
  }
  function planBlock() {
    const p = planInfo();
    return '<div class="plan"><div class="big">' + p.tables + '<small>' + (p.tables > 1 ? 'tables' : 'table') + '</small></div><div class="txt">' + esc(p.txt) + '</div></div>';
  }

  function timeline() {
    const now = Date.now();
    const a = BR.timeToMs(S.settings.start, now), z = BR.timeToMs(S.settings.end, now);
    const span = Math.max(1, z - a);
    const pct = t => Math.max(0, Math.min(100, (t - a) / span * 100));
    const r = BR.currentRound(S);
    let segs = S.rounds.map(x => {
      const e = x.startedAt + x.b * S.settings.minPerBoard * 60000;
      return '<i class="seg' + (x === r ? ' cur' : '') + '" style="left:' + pct(x.startedAt) + '%;width:' + Math.max(1, pct(e) - pct(x.startedAt)) + '%"></i>';
    }).join('');
    let ticks = '';
    const d0 = new Date(a); d0.setMinutes(0, 0, 0);
    for (let t = d0.getTime(); t <= z; t += 3600000) if (t >= a) ticks += '<span style="left:' + pct(t) + '%">' + new Date(t).getHours() + ' h</span>';
    return '<div class="tl"><div class="bar">' + segs + (now >= a && now <= z ? '<i class="now" style="left:' + pct(now) + '%"></i>' : '') + '</div><div class="ticks">' + ticks + '</div></div>';
  }

  /* ---------- Joueurs ---------- */
  function playersListHtml() {
    const f = ui.filter.trim().toLowerCase();
    const list = S.players.slice().sort((a, b) => a.name.localeCompare(b.name, 'fr')).filter(p => !f || p.name.toLowerCase().includes(f));
    if (!list.length) return '<div class="empty" style="padding:18px 0">' + (S.players.length ? 'Aucun nom ne correspond. Touchez « Ajouter » pour créer ce joueur.' : 'Aucun joueur pour l\'instant. Tapez un nom ci-dessus pour commencer.') + '</div>';
    return list.map(p =>
      '<div class="prow ' + (p.present ? '' : 'off') + '"><span class="av c' + (p.id % 4 + 1) + '">' + esc(initials(p.name)) + '</span>' +
      '<span class="nm">' + esc(p.name) + (p.teacher ? ' <span class="pill">professeur</span>' : '') + (p.present && p.arrivedAt ? '<small>arrivé à ' + fmtT(p.arrivedAt) + '</small>' : '') + '</span>' +
      '<button class="star ' + (p.teacher ? 'on' : '') + '" data-a="teach" data-id="' + p.id + '" aria-label="Professeur">' + (p.teacher ? '★' : '☆') + '</button>' +
      '<button class="sw ' + (p.present ? 'on' : '') + '" data-a="pres" data-id="' + p.id + '">' + (p.present ? 'Présent' : 'Absent') + '</button>' +
      '<button class="x" data-a="del" data-id="' + p.id + '" aria-label="Supprimer">✕</button></div>').join('');
  }
  function viewPlayers() {
    return '<div class="sec"><h2>Qui est là ?</h2><div id="psum">' + planBlock() + '</div></div>' +
      '<div class="panel"><div class="row"><input type="text" id="pname" class="grow" placeholder="Taper un nom pour chercher ou ajouter" autocomplete="off" value="' + esc(ui.filter) + '"><button class="btn pri" data-a="add">Ajouter</button></div>' +
      '<div class="row" style="margin-top:10px"><button class="btn sm" data-a="allpres">Tout le monde présent</button><button class="btn sm" data-a="nonepres">Tout le monde absent</button></div>' +
      '<details style="margin:10px 0 0"><summary>Coller une liste de noms</summary><textarea id="bulk" rows="5" placeholder="Un nom par ligne"></textarea><button class="btn" data-a="bulk" style="margin-top:8px">Importer la liste</button></details></div>' +
      '<div class="plist" id="plist">' + playersListHtml() + '</div>' +
      '<p class="mute" style="margin-top:12px">L\'étoile désigne le professeur : il complète une table quand il manque un joueur et n\'entre pas dans le classement. La liste est conservée d\'une séance à l\'autre, il suffit de cocher les présents.</p>';
  }
  function addPlayer(name, present) {
    name = name.trim();
    if (!name) return null;
    const p = { id: S.nextId++, name, teacher: false, present: present !== false, arrivedAt: Date.now() };
    S.players.push(p);
    return p;
  }

  /* ---------- Tour ---------- */
  function viewRound() {
    const r = BR.currentRound(S);
    const now = Date.now();
    const auto = BR.autoBoards(S, now);
    let h = '<div class="sec">' + planBlock() + timeline();
    const nextN = S.rounds.length + 1;
    const opts = []; for (let i = 1; i <= K(); i++) opts.push('<option value="' + i + '"' + (i === auto ? ' selected' : '') + '>' + i + ' donne' + (i > 1 ? 's' : '') + (i === auto ? ' (conseillé)' : '') + '</option>');
    h += '<div class="go-row"><select id="bsel" aria-label="Donnes par tour">' + opts.join('') + '</select><button class="btn go" data-a="next">Lancer le tour ' + nextN + '</button></div>';
    h += '<div class="mute">' + (r ? 'Le tour tient compte des arrivées et des départs notés dans l\'onglet Joueurs.' : 'Cochez les présents dans l\'onglet Joueurs, puis lancez le premier tour.') + '</div>' +
      '<div style="margin-top:12px"><button class="btn sm noprint" data-a="salle">Afficher sur grand écran</button></div></div>';
    if (!r) {
      return h + '<div class="empty"><svg viewBox="0 0 150 150" aria-hidden="true"><rect x="45" y="45" width="60" height="60" rx="10" fill="none" stroke="currentColor" stroke-width="3"/><rect x="58" y="12" width="34" height="22" rx="7" fill="none" stroke="currentColor" stroke-width="3"/><rect x="58" y="116" width="34" height="22" rx="7" fill="none" stroke="currentColor" stroke-width="3"/><rect x="12" y="58" width="22" height="34" rx="7" fill="none" stroke="currentColor" stroke-width="3"/><rect x="116" y="58" width="22" height="34" rx="7" fill="none" stroke="currentColor" stroke-width="3"/><path d="M75 62c5 8 12 9 12 16 0 5-4 7-8 6 1 4 2 6 4 9H67c2-3 3-5 4-9-4 1-8-1-8-6 0-7 7-8 12-16z" fill="currentColor"/></svg><div>Les tables apparaîtront ici dès le premier tour.</div></div>';
    }

    h += '<div class="sec"><h2>Tour ' + r.n + '</h2><p class="lead">' + plural(r.b, 'donne', 'donnes') + (r.b < K() ? ' à jouer, plus ' + (K() - r.b) + ' de réserve' : ' à jouer') + '. Début à ' + fmtT(r.startedAt) + ', <span id="rcount"></span>.</p>' +
      (r.stats ? '<div class="mute">Partenaires déjà rencontrés : ' + r.stats.repeatPartners + '. Adversaires déjà rencontrés : ' + r.stats.repeatOpp + '.' + (r.stats.replays ? ' <b class="red">Séries déjà jouées : ' + r.stats.replays + '.</b>' : '') + '</div>' : '') + '</div>';
    (r.warnings || []).forEach(w => { h += '<div class="note bad">' + esc(w) + '</div>'; });

    const w = BR.waiting(S);
    const rest = w.players;
    if (rest.length || w.teacherFree) {
      h += '<div class="note ' + (BR.canOpenTable(S) ? 'ok' : 'warn') + '"><b>' + (rest.length ? plural(rest.length, 'joueur sans table', 'joueurs sans table') : 'Le professeur est libre') + '</b>' +
        (rest.length ? ' : ' + rest.map(p => esc(p.name)).join(', ') : '') + (rest.length && w.teacherFree ? '. Le professeur est libre.' : '') +
        (BR.canOpenTable(S) ? '<div style="margin-top:8px"><button class="btn pri" data-a="opentable">Ouvrir une table avec eux</button></div>' : '<div class="mute" style="margin-top:4px">Ils jouent au prochain tour, ou remplacent quelqu\'un qui part.</div>') + '</div>';
    }

    let idx = 0;
    let tw = '<div class="tables">' + r.tables.map(t => tableCard(r, t, w, idx++)).join('') + '</div>';
    tw += '<div class="legend" style="margin-top:14px"><span class="mb vns" style="display:flex">9</span>Bords rouges : camp vulnérable. Point doré : donneur.</div>';

    const rows = [];
    r.tables.filter(t => !t.closed).forEach(t => SEATS.forEach(k => rows.push({ name: nm(t.seats[k]), txt: 'table ' + t.n + ', ' + SN[k] })));
    w.players.forEach(p => rows.push({ name: p.name, txt: 'sans table' }));
    rows.sort((a, b) => a.name.localeCompare(b.name, 'fr'));
    const prev = S.rounds.length > 1 ? S.rounds[S.rounds.length - 2] : null;
    let moves = '';
    if (prev) {
      const where = {}; prev.tables.forEach(t => { where[t.set] = t.n; });
      const mv = r.tables.filter(t => !t.closed && where[t.set] !== t.n).map(t => 'Série ' + t.set + (where[t.set] ? ' : de la table ' + where[t.set] + ' à la table ' + t.n : ' : nouvelle série, à poser table ' + t.n));
      moves = mv.length ? '<h3 style="margin-top:14px">Donnes à déplacer</h3><div>' + mv.join('<br>') + '</div>' : '<div class="mute" style="margin-top:12px">Les séries de donnes restent à leur table : seuls les joueurs bougent.</div>';
    } else moves = '<div class="mute" style="margin-top:12px">Premier tour : posez la série indiquée sur chaque table.</div>';
    const annc = '<div class="panel"><details open><summary>Qui va où ? (à annoncer)</summary><div style="columns:2 230px">' + rows.map(x => '<div>' + esc(x.name) + ' : <b>' + esc(x.txt) + '</b></div>').join('') + '</div>' + moves + '<button class="btn sm noprint" style="margin-top:10px" data-a="print">Imprimer</button></details></div>';
    return '<div class="split"><div class="side">' + h + '</div><div class="tw">' + tw + '</div><div class="annc">' + annc + '</div></div>';
  }

  function resultHtml(x) {
    if (x.pass) return 'Passe général';
    const rs = x.res === 0 ? '=' : x.res > 0 ? '+' + x.res : '−' + (-x.res);
    return x.level + suitHtml(x.den) + (x.dbl === 1 ? 'X' : x.dbl === 2 ? 'XX' : '') + ' ' + x.decl + ' ' + rs;
  }

  function alreadyDealt(r, bn) {
    for (const q of S.rounds) {
      if (q === r) break;
      if (q.tables.some(x => x.boards.indexOf(bn) >= 0 || (x.results && x.results[bn]))) return true;
    }
    return false;
  }
  function tableCard(r, t, w, i) {
    const cands = w.players.concat(w.teacher ? [w.teacher] : []);
    let h = '<div class="tcard' + (t.closed ? ' closed' : '') + (ui.fresh ? ' deal' : '') + '" style="--i:' + Math.min(i, 10) + '"><div class="felt"><div class="tag"><b>Série ' + t.set + '</b>' + (t.late ? 'ajoutée en cours de tour' : t.closed ? 'fermée' : '') + '</div><div class="seats">';
    SEATS.forEach(k => {
      const p = getP(t.seats[k]);
      const gone = p && !p.present;
      h += '<div class="plate p-' + k + (gone ? ' gone' : '') + (p && p.teacher ? ' prof' : '') + '"><span class="sl">' + k + '</span>' + esc(p ? p.name : '?') + '</div>';
    });
    h += '<div class="hub"><b>' + t.n + '</b><small>table</small></div></div></div>';
    let fix = '';
    if (!t.closed) {
      SEATS.forEach(k => {
        const p = getP(t.seats[k]);
        if (p && !p.present) {
          fix += '<div class="note bad"><b>' + esc(p.name) + '</b> est parti (' + SN[k] + '). ' +
            (cands.length ? 'Remplaçant :<div class="row" style="margin-top:6px"><select id="rep-' + t.n + '-' + k + '" class="grow">' + cands.map(c => '<option value="' + c.id + '">' + esc(c.name) + (c.teacher ? ' (professeur)' : '') + '</option>').join('') + '</select><button class="btn sm pri" data-a="replace" data-t="' + t.n + '" data-s="' + k + '">Remplacer</button></div>' : 'Personne n\'est disponible pour le remplacer.') + '</div>';
        }
      });
      const gone = SEATS.some(k => { const p = getP(t.seats[k]); return p && !p.present; });
      if (gone && !cands.length) fix += '<div style="margin-top:8px"><button class="btn sm danger" data-a="dissolve" data-t="' + t.n + '">Fermer cette table</button></div>';
    }
    if (fix) h += '<div class="fix">' + fix + '</div>';
    if (t.from) h += '<div class="mute" style="padding:8px 16px 0">Étui reçu de la table ' + t.from + '.</div>';
    h += '<div class="boards">';
    t.boards.forEach(bn => {
      const b = BR.boardInfo(bn), des = BR.designated(bn, K()), x = t.results[bn];
      h += '<div class="brow">' + miniBoard(b) + '<div class="info"><b>Donne ' + bn + '</b> <small>donneur ' + SN[b.dealer].toLowerCase() + ', vulnérable : ' + vulName(b.vul) + '</small><br>' +
        (x ? '<span class="res">' + resultHtml(x) + '</span> <small>(NS ' + (BR.nsScore(x, bn) > 0 ? '+' : '') + BR.nsScore(x, bn) + ')</small>'
          : (S.settings.prepared
            ? '<small>Main prévue : ' + SN[des] + ', ' + esc(nm(t.seats[des])) + '</small>'
            : (alreadyDealt(r, bn)
              ? '<small>Déjà distribuée : jouez-la telle quelle, sans rebattre.</small>'
              : '<small>À battre et distribuer : donneur ' + SN[b.dealer] + ', ' + esc(nm(t.seats[b.dealer])) + '.</small>'))) + '</div>' +
        '<button class="btn sm noprint" data-a="score" data-t="' + t.n + '" data-b="' + bn + '">' + (x ? 'Modifier' : 'Saisir') + '</button></div>';
    });
    h += '</div>';
    const bonus = BR.boardsOfSet(t.set, K()).filter(n => t.boards.indexOf(n) < 0);
    if (bonus.length) h += '<div class="buf">Donne de réserve si vous finissez en avance :' + bonus.map(bn => '<button class="btn sm noprint" data-a="score" data-t="' + t.n + '" data-b="' + bn + '">' + (t.results[bn] ? '✓ ' : '') + bn + '</button>').join('') + '</div>';
    return h + '</div>';
  }
  function miniBoard(b) {
    return '<span class="mb' + (b.vulNS ? ' vns' : '') + (b.vulEW ? ' veo' : '') + '"><i class="d' + b.dealer + '"></i>' + b.n + '</span>';
  }

  /* ---------- Saisie d'un score ---------- */
  function clampRes(d) {
    const lo = -(d.level + 6), hi = 7 - d.level;
    if (d.res < lo) d.res = lo;
    if (d.res > hi) d.res = hi;
  }
  function openScore(tn, bn) {
    const r = BR.currentRound(S);
    const t = r.tables.find(x => x.n === tn);
    const ex = t.results[bn];
    ui.score = { t: tn, b: bn, d: ex ? { pass: !!ex.pass, level: ex.level || 4, den: ex.den || 'S', dbl: ex.dbl || 0, decl: ex.decl || 'N', res: ex.res || 0 } : { pass: false, level: 4, den: 'S', dbl: 0, decl: S.settings.prepared ? BR.designated(bn, K()) : 'N', res: 0 }, has: !!ex };
    render();
  }
  function scoreSheet() {
    const sc = ui.score, d = sc.d;
    const r = BR.currentRound(S);
    const t = r.tables.find(x => x.n === sc.t);
    const b = BR.boardInfo(sc.b);
    clampRes(d);
    const chip = (k, v, label, cls) => '<button class="chip ' + (cls || '') + ((d[k] === v) ? ' on' : '') + '" data-a="scset" data-k="' + k + '" data-v="' + v + '">' + label + '</button>';
    const val = BR.nsScore(Object.assign({}, d), sc.b);
    const resTxt = d.res === 0 ? 'Fait juste' : d.res > 0 ? 'Fait ' + d.res + ' de plus' : 'Chute de ' + (-d.res);
    return '<div class="overlay" data-a="scoreclose"><div class="sheet" data-stop="1"><div class="row" style="margin-bottom:4px">' + miniBoard(b) + '<div><h2>Table ' + sc.t + ', donne ' + sc.b + '</h2><div class="mute">Donneur ' + SN[b.dealer].toLowerCase() + ', vulnérable : ' + vulName(b.vul) + '</div></div></div>' +
      '<div class="chips" style="margin-top:12px"><button class="chip' + (d.pass ? ' on' : '') + '" style="font:600 16px var(--sans)" data-a="scset" data-k="pass" data-v="1">Tout le monde passe</button></div>' +
      (d.pass ? '' :
        '<label class="f">Niveau</label><div class="chips">' + [1, 2, 3, 4, 5, 6, 7].map(i => chip('level', i, i)).join('') + '</div>' +
        '<label class="f">Couleur</label><div class="chips">' + ['C', 'D', 'H', 'S', 'SA'].map(x => chip('den', x, DEN[x], 'suit' + (x === 'H' || x === 'D' ? ' r' : ''))).join('') + '</div>' +
        '<label class="f">Contre</label><div class="chips">' + chip('dbl', 0, 'Non') + chip('dbl', 1, 'X') + chip('dbl', 2, 'XX') + '</div>' +
        '<label class="f">Déclarant</label><div class="chips">' + SEATS.map(k => '<button class="chip seatc' + (d.decl === k ? ' on' : '') + '" data-a="scset" data-k="decl" data-v="' + k + '"><b>' + k + '</b>' + esc(nm(t.seats[k])) + '</button>').join('') + '</div>' +
        '<label class="f">Résultat</label><div class="step"><button class="btn" data-a="scres" data-v="-1" aria-label="Une levée de moins">−</button><div class="val">' + resTxt + '</div><button class="btn" data-a="scres" data-v="1" aria-label="Une levée de plus">+</button></div>') +
      '<div class="big-score' + (val < 0 ? ' neg' : '') + '"><small>Pour Nord-Sud</small>' + (val > 0 ? '+' : '') + val + '</div>' +
      '<div class="row"><button class="btn go grow" data-a="scoresave">Enregistrer</button><button class="btn" data-a="scoreclose" style="height:100%">Annuler</button></div>' +
      (sc.has ? '<button class="btn sm danger" style="margin-top:12px" data-a="scoreclear">Effacer ce résultat</button>' : '') + '</div></div>';
  }
  function saveScore() {
    const sc = ui.score, r = BR.currentRound(S);
    const t = r.tables.find(x => x.n === sc.t);
    const d = sc.d;
    t.results[sc.b] = d.pass ? { pass: true, players: Object.assign({}, t.seats) } : { pass: false, level: +d.level, den: d.den, dbl: +d.dbl, decl: d.decl, res: +d.res, players: Object.assign({}, t.seats) };
    ui.score = null; commit();
  }

  /* ---------- Scores ---------- */
  function viewScores() {
    const sc = BR.computeScores(S);
    const ranked = sc.players.filter(p => !p.teacher && p.avg != null).sort((a, b) => b.avg - a.avg);
    const others = sc.players.filter(p => !p.teacher && p.avg == null && p.rounds > 0);
    const nBoards = Object.keys(sc.byBoard).length;
    let h = '<div class="sec"><h2>Classement</h2><p class="lead">Chaque donne est comparée à la même donne jouée aux autres tables. Le pourcentage est la moyenne de chacun. ' + plural(nBoards, 'donne saisie', 'donnes saisies') + '.</p>';
    if (!ranked.length) h += '<div class="empty"><div>Le classement apparaît dès que deux tables ont saisi la même donne.</div></div>';
    else {
      h += '<ol class="rank">' + ranked.map((p, i) => '<li><span class="rk' + (i < 3 ? ' g' + (i + 1) : '') + '">' + (i + 1) + '</span><span class="who"><b>' + esc(p.name) + '</b><small>' + plural(p.boards, 'donne', 'donnes') + ', ' + plural(p.declared, 'contrat joué', 'contrats joués') + '</small><div class="bar"><i style="width:' + p.avg.toFixed(1) + '%"></i></div></span><span class="pc">' + p.avg.toFixed(1) + '<small style="font:400 13px var(--sans)"> %</small></span></li>').join('') + '</ol>';
    }
    h += '</div>';
    if (others.length) h += '<div class="panel"><h3>Pas encore de comparaison</h3><div class="mute">' + others.map(p => esc(p.name)).join(', ') + '</div></div>';
    const bn = Object.keys(sc.byBoard).map(Number).sort((a, b) => a - b);
    if (bn.length) {
      h += '<div class="panel"><details><summary>Résultats donne par donne</summary>' + bn.map(n => {
        const l = sc.byBoard[n].slice().sort((a, b) => b.ns - a.ns);
        return '<h3 style="margin-top:14px">Donne ' + n + '</h3><table class="tr">' + l.map(x => '<tr><td>Table ' + x.table + '</td><td>' + resultHtml(x.r) + '</td><td class="num">NS ' + (x.ns > 0 ? '+' : '') + x.ns + '</td><td class="num">' + (x.pct == null ? '' : x.pct.toFixed(0) + ' %') + '</td></tr>').join('') + '</table>';
      }).join('') + '</details></div>';
    }
    return h;
  }

  /* ---------- Donnes ---------- */
  function viewBoards() {
    let h = '<div class="sec"><h2>Plan des étuis</h2><p class="lead">' + (S.settings.prepared
      ? 'Chaque série compte ' + K() + ' donnes. À chaque donne, un siège est la « main prévue » : composez la donne pour que sa paire ait le contrat (environ 24 à 27 points, une belle couleur, une petite difficulté de jeu). Le siège change d\'une donne et d\'une série à l\'autre, pour que chacun joue des contrats. La dernière donne de chaque série sert de réserve.'
      : 'Les étuis sont numérotés et vides au départ. La première table qui joue une série bat et distribue ses donnes, puis l\'étui passe à une autre table : personne ne rejoue une donne déjà vue. Le donneur et la vulnérabilité sont ceux du numéro de la donne. La dernière donne de chaque série sert de réserve.') + '</p>' +
      '<div class="legend"><span class="mb vns" style="display:flex">9</span>Bords rouges : camp vulnérable. Point doré : donneur.<button class="btn sm noprint" data-a="print">Imprimer</button></div></div>';
    h += '<div class="sets">';
    for (let s = 1; s <= S.settings.bankSets; s++) {
      h += '<div class="setcard"><h3>Série ' + s + '</h3>' + BR.boardsOfSet(s, K()).map((bn, i) => {
        const b = BR.boardInfo(bn);
        return '<div class="brow" style="align-items:flex-start">' + miniBoard(b) + '<div class="info"><b>Donne ' + bn + '</b> <small>donneur ' + SN[b.dealer].toLowerCase() + ', vulnérable : ' + vulName(b.vul) + '</small><br>' + (S.settings.prepared ? 'Main prévue : <b>' + SN[BR.designated(bn, K())] + '</b>' : '') + (i >= 3 ? ' <span class="pill">réserve</span>' : '') +
          (S.settings.prepared ? '<input type="text" data-f="note" data-b="' + bn + '" placeholder="Thème ou idée de la donne" value="' + esc(S.notes[bn] || '') + '">' : '') + '</div></div>';
      }).join('') + '</div>';
    }
    return h + '</div>';
  }

  /* ---------- Réglages ---------- */
  function viewSettings() {
    const s = S.settings;
    const num = (k, label, min, max) => '<label class="f">' + label + '</label><input type="number" inputmode="numeric" min="' + min + '" max="' + max + '" data-f="set" data-k="' + k + '" value="' + s[k] + '">';
    return '<div class="sec"><h2>Réglages</h2></div><div class="cols2"><div class="panel"><h3>Séance</h3><label class="f">Étuis</label><select data-f="mode"><option value="live"' + (s.prepared ? '' : ' selected') + '>Donnes non préparées : les joueurs battent et distribuent</option><option value="prep"' + (s.prepared ? ' selected' : '') + '>Donnes préparées à l\'avance (main prévue par donne)</option></select><div class="row"><div class="grow"><label class="f">Début</label><input type="time" data-f="set" data-k="start" value="' + s.start + '"></div><div class="grow"><label class="f">Fin</label><input type="time" data-f="set" data-k="end" value="' + s.end + '"></div></div>' +
      num('roundMin', 'Durée visée d\'un tour (minutes)', 10, 90) + num('minPerBoard', 'Minutes par donne, marque comprise', 4, 20) + num('changeMin', 'Minutes pour changer de table', 0, 10) + num('setSize', 'Donnes par série (3 jouées et 1 de réserve)', 2, 6) + num('bankSets', 'Nombre de séries d\'étuis', 3, 30) +
      '<p class="mute">Le nombre de donnes par tour est calculé pour que le dernier tour se termine à l\'heure de fin.</p></div>' +
      '<div class="panel"><h3>Sauvegarde</h3><div class="row"><button class="btn" data-a="export">Exporter dans un fichier</button><label class="btn" style="margin:0">Importer un fichier<input type="file" id="imp" accept=".json,application/json" style="display:none"></label></div>' +
      '<p class="mute">Les données restent dans ce navigateur. Exportez avant de changer d\'appareil.</p></div>' +
      '<div class="panel"><h3>Nouvelle séance</h3><div class="row"><button class="btn" data-a="newsession">Nouvelle après-midi</button><button class="btn danger" data-a="reset">Tout effacer</button></div><p class="mute">Une nouvelle après-midi efface les tours et les scores mais garde la liste des joueurs.</p></div></div>';
  }

  /* ---------- Grand écran ---------- */
  function salleTile(t) {
    const row = k => {
      const p = getP(t.seats[k]);
      return '<div class="trw' + (p && p.teacher ? ' prof' : '') + '"><span class="sl">' + k + '</span><span class="tn2">' + esc(p ? p.name : '?') + '</span></div>';
    };
    return '<div class="tile"><div class="th"><b>' + t.n + '</b><span>table</span></div><div class="grp">' + row('N') + row('S') + '</div><div class="grp g2">' + row('E') + row('O') + '</div></div>';
  }
  function viewSalle() {
    const r = BR.currentRound(S);
    const present = S.players.filter(p => p.present);
    let top = '<div class="stop"><div class="sl1"><img class="logo" src="' + LOGO + '" alt=""><div><b>' + (r ? 'Tour ' + r.n : 'Bridge Relax') + '</b><span>' + (r ? plural(r.b, 'donne', 'donnes') : plural(present.length, 'joueur présent', 'joueurs présents')) + '</span></div></div><div class="scount" id="scount"></div><div class="sclock" id="sclock"></div></div>';
    let body = '';
    if (!r) {
      body = '<div class="swait"><div>Bienvenue</div><small>Installez-vous : les tables vont être annoncées ici.</small></div>';
    } else {
      const w = BR.waiting(S);
      const act = r.tables.filter(t => !t.closed);
      if (ui.salleView === 'tables') {
        const n = act.length;
        const cols = n <= 2 ? n : n <= 4 ? 2 : n <= 6 ? 3 : n <= 8 ? 4 : 5;
        body = '<div class="sgrid" style="--cols:' + cols + '">' + act.map(t => salleTile(t)).join('') + '</div>';
        if (w.players.length) body += '<div class="srest">Sans table pour l\'instant : ' + w.players.map(p => esc(p.name)).join(', ') + '</div>';
      } else {
        const rows = [];
        act.forEach(t => SEATS.forEach(k => rows.push({ name: nm(t.seats[k]), t: t.n, seat: SN[k], prof: !!(getP(t.seats[k]) || {}).teacher })));
        w.players.forEach(p => rows.push({ name: p.name, t: null, seat: 'repos' }));
        rows.sort((a, b) => a.name.localeCompare(b.name, 'fr'));
        const cc = rows.length <= 16 ? 2 : rows.length <= 30 ? 3 : 4;
        body = '<div class="snames" style="--cc:' + cc + '">' + rows.map(x => '<div class="ni"><span class="nn">' + esc(x.name) + '</span><span class="nt' + (x.t ? '' : ' rest') + '">' + (x.t ? '<b>' + x.t + '</b>' : '') + '<small>' + x.seat + '</small></span></div>').join('') + '</div>';
      }
    }
    const ctl = '<div class="sctl noprint"><button class="' + (ui.salleView === 'noms' ? 'on' : '') + '" data-a="salleview" data-v="noms">Par nom</button><button class="' + (ui.salleView === 'tables' ? 'on' : '') + '" data-a="salleview" data-v="tables">Par table</button><button class="' + (ui.auto ? 'on' : '') + '" data-a="salleauto">Alterner</button><button data-a="fullscreen">Plein écran</button><button data-a="salleclose">Fermer</button></div>';
    return '<div class="salle">' + top + body + ctl + '</div>';
  }

  /* ---------- Actions ---------- */
  function setPresent(p, v) {
    p.present = v;
    if (v) p.arrivedAt = Date.now();
  }
  const actions = {
    tab(el) { ui.tab = el.dataset.v; ui.score = null; render(); window.scrollTo(0, 0); },
    add() {
      const inp = $('#pname'); const p = addPlayer(inp.value);
      if (p) { ui.filter = ''; commit(); const i = $('#pname'); if (i) i.focus(); }
    },
    bulk() {
      const names = $('#bulk').value.split(/\n/).map(x => x.trim()).filter(Boolean);
      names.forEach(n => { if (!S.players.some(p => p.name.toLowerCase() === n.toLowerCase())) addPlayer(n, false); });
      commit();
    },
    pres(el) { const p = getP(+el.dataset.id); if (p) { setPresent(p, !p.present); commit(); } },
    teach(el) { const p = getP(+el.dataset.id); if (!p) return; const v = !p.teacher; S.players.forEach(x => { x.teacher = false; }); p.teacher = v; commit(); },
    del(el) { const p = getP(+el.dataset.id); if (p && confirm('Supprimer ' + p.name + ' de la liste ?')) { S.players = S.players.filter(x => x.id !== p.id); commit(); } },
    allpres() { S.players.forEach(p => { if (!p.present) setPresent(p, true); }); commit(); },
    nonepres() { if (confirm('Marquer tout le monde absent ?')) { S.players.forEach(p => { p.present = false; }); commit(); } },
    next() {
      const b = +$('#bsel').value;
      const r = BR.planRound(S, { boards: b, now: Date.now() });
      if (r.error) { alert(r.error); return; }
      S.rounds.push(r); ui.fresh = true; commit(); window.scrollTo(0, 0);
    },
    opentable() { if (!BR.openExtraTable(S)) alert('Impossible d\'ouvrir une table.'); ui.fresh = false; commit(); },
    replace(el) {
      const sel = $('#rep-' + el.dataset.t + '-' + el.dataset.s);
      if (sel) { BR.replaceSeat(S, +el.dataset.t, el.dataset.s, +sel.value); commit(); }
    },
    dissolve(el) { if (confirm('Fermer cette table ?')) { BR.dissolveTable(S, +el.dataset.t); commit(); } },
    score(el) { openScore(+el.dataset.t, +el.dataset.b); },
    scset(el) {
      const k = el.dataset.k, v = el.dataset.v, d = ui.score.d;
      if (k === 'pass') d.pass = !d.pass;
      else if (k === 'den' || k === 'decl') d[k] = v;
      else d[k] = +v;
      render();
    },
    scres(el) { const d = ui.score.d; d.res += +el.dataset.v; clampRes(d); render(); },
    scoreclose() { ui.score = null; render(); },
    scoresave() { saveScore(); },
    scoreclear() { const r = BR.currentRound(S); const t = r.tables.find(x => x.n === ui.score.t); delete t.results[ui.score.b]; ui.score = null; commit(); },
    print() { window.print(); },
    salle() { ui.tab = 'salle'; ui.tick = 0; render(); },
    salleclose() { if (document.fullscreenElement && document.exitFullscreen) document.exitFullscreen(); ui.tab = 'tour'; render(); },
    salleview(el) { ui.salleView = el.dataset.v; ui.auto = false; render(); },
    salleauto() { ui.auto = !ui.auto; render(); },
    fullscreen() {
      const el = document.documentElement;
      if (document.fullscreenElement) { document.exitFullscreen(); return; }
      if (el.requestFullscreen) el.requestFullscreen(); else if (el.webkitRequestFullscreen) el.webkitRequestFullscreen();
    },
    export() {
      const blob = new Blob([JSON.stringify(S)], { type: 'application/json' });
      const a = document.createElement('a'); a.href = URL.createObjectURL(blob);
      const d = new Date(); a.download = 'bridge-relax-' + d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate()) + '.json';
      document.body.appendChild(a); a.click(); setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 500);
    },
    newsession() {
      if (!confirm('Commencer une nouvelle après-midi ? Les tours et scores actuels seront effacés (pensez à exporter). La liste des joueurs est conservée.')) return;
      S.rounds = []; S.players.forEach(p => { p.present = false; }); ui.tab = 'joueurs'; commit();
    },
    reset() { if (confirm('Tout effacer, y compris la liste des joueurs ?') && confirm('Vraiment tout effacer ?')) { S = defaults(); commit(); } }
  };

  document.addEventListener('click', e => {
    const el = e.target.closest('[data-a]');
    if (!el) return;
    if (el.classList.contains('overlay') && e.target !== el) return;
    const f = actions[el.dataset.a];
    if (f) f(el);
  });
  document.addEventListener('keydown', e => {
    if (e.key === 'Enter' && e.target.id === 'pname') { e.preventDefault(); actions.add(); }
  });
  document.addEventListener('input', e => {
    const el = e.target;
    if (el.id === 'pname') { ui.filter = el.value; const l = $('#plist'); if (l) l.innerHTML = playersListHtml(); }
    else if (el.dataset.f === 'note') { S.notes[el.dataset.b] = el.value; save(); }
  });
  document.addEventListener('change', e => {
    const el = e.target;
    if (el.dataset.f === 'mode') { S.settings.prepared = el.value === 'prep'; commit(); }
    else if (el.dataset.f === 'set') {
      const k = el.dataset.k;
      S.settings[k] = (k === 'start' || k === 'end') ? el.value : Math.max(0, +el.value || 0);
      if (k === 'setSize' && S.settings.setSize < 2) S.settings.setSize = 2;
      save();
    } else if (el.id === 'imp' && el.files[0]) {
      const rd = new FileReader();
      rd.onload = () => { try { const j = JSON.parse(rd.result); if (j && j.v === 1) { S = Object.assign(defaults(), j); commit(); } else alert('Fichier non reconnu.'); } catch (x) { alert('Fichier illisible.'); } };
      rd.readAsText(el.files[0]);
    }
  });

  render();
  setInterval(updateClock, 15000);
  setInterval(() => {
    if (ui.tab !== 'salle') return;
    updateClock();
    ui.tick++;
    if (ui.auto && ui.tick % 15 === 0 && BR.currentRound(S)) { ui.salleView = ui.salleView === 'noms' ? 'tables' : 'noms'; render(); }
  }, 1000);
  window.__BR_UI = { get state() { return S; }, ui, render, actions };
})();

</script>
</html>
